    explain:`
<div class="card"><h3>التمهيد</h3>
<p>خلق الله الإنسان فسوّاه وعدّله، وجعله في أحسن تقويم، وكرّمه أبلغ تكريم، ومنحه نعمة <b>العقل والتمييز</b> ليفرّق بين الحق والباطل، وبين النافع والضار، وتلك هي الحرية في أسمى معانيها. وإلى جانب ذلك علّمنا الإسلام كيف نصل بحريّتنا إلى أقصى درجات الكمال، بحيث لا يضرّ الإنسان نفسه باستخدامها ولا يضرّ غيره كذلك.</p>
<p>الإسلام دين الفطرة السليمة التي فطر الناس عليها، فهو يكره الاستبداد والتسلّط، بعد أن وضّحت طرق الهداية والرشاد من طرق الضلالة والفساد. قال تعالى:</p>
<div class="ayah">﴿ لَا إِكْرَاهَ فِي الدِّينِ قَد تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ ﴾ [البقرة: 255]</div>
<p>والرسول ﷺ عندما بُعث بالإسلام أمره ربّه أن يبيّن للناس طرق الخير، وأن يسلك في سبيل دعوته سبل الإقناع. قال تعالى:</p>
<div class="ayah">﴿ ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ ﴾ [النحل: 125]</div>
<p>والإسلام إنما انتشر في ربوع الأرض لأنه دين الفطرة الإنسانية التي تراعي جميع الحريات. وللحرية مجالات متعددة منها:</p></div>

<div class="card"><h3>١. حرية التفكير</h3>
<p>وجّه الإسلام أنظار الناس إلى التأمل في الكون، والتفكير في آيات الله تعالى دون أن يضع عليهم القيود، ويرسم لهم الحدود إلا فيما يتعلّق بالغيبيات التي لا يدركها العقل، مما يؤكّد حرية التفكير في الإسلام، ومن ثمّ <b>حرية الإبداع</b> فيما يعود بالفائدة على البشرية جمعاء.</p></div>

<div class="card"><h3>٢. حرية التعبير</h3>
<p>انطلاقًا من حرية التفكير، كفل الإسلام للناس حرية التعبير الموجّه إلى الخير والإصلاح، مع التزام طريق الإقناع والقول الحسن. قال تعالى:</p>
<div class="ayah">﴿ وَقُل لِّعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ ﴾ [الإسراء: 53]</div><br>
<div class="ayah">﴿ وَلَا تَسْتَوِي الْحَسَنَةُ وَلَا السَّيِّئَةُ ادْفَعْ بِالَّتِي هِيَ أَحْسَنُ فَإِذَا الَّذِي بَيْنَكَ وَبَيْنَهُ عَدَاوَةٌ كَأَنَّهُ وَلِيٌّ حَمِيمٌ ﴾ [فصلت: 33]</div>
<p>واللسان الذي هو أحد وسائل التعبير عضو من الأعضاء التي يُسأل عنها الإنسان يوم القيامة، فإن سخّره فيما فيه نفع كان له أجره، وإن سخّره في مجال الضرر كان عليه وزره وعقابه. قال ﷺ:</p>
<div class="hadith">«وهل يكبّ الناس في النار على وجوههم إلا حصائد ألسنتهم». <small>(رواه الترمذي)</small></div></div>

<div class="card"><h3>٣. حرية التصرّف</h3>
<p>وهي الحرية التي تنبع من طبع الإنسان وخصائصه التي ميّزه الله تعالى بها، وموقف الإسلام من تلك الحرية هو توجيهها إلى الخير والصلاح بحيث يحقّق الإنسان بها منافعه دون أن يلحق الضرر بغيره. فليس من الحرية:</p>
<ul><li>أن يعتدي الإنسان على غيره بالقول أو بالفعل.</li>
<li>أن ينتهك الإنسان الحرمات ويتمرّد على القيم والأخلاق.</li>
<li>التصرّف في الأشياء العامة دون وجه حق.</li>
<li>عدم احترام الآخرين في الأماكن العامة أو الخاصة.</li></ul>
<p>إنما الحرية <b>التصرّف المعقول</b> فيما فيه مصلحة خاصة وعامة، وعدم إلحاق الأذى بالآخرين.</p></div>

<div class="card"><h3>٤. حرية الوطن والمواطن</h3>
<p>يحثّ الإسلام أتباعه على أن يعيشوا في أوطانهم أحرارًا، يمتلكون مقدّراتها، وينعمون بخيراتها في ظل عدالة اجتماعية تضمن لكل فرد حقّه في الحياة الحرّة الكريمة، حتى لا يكون عبدًا للمستغلّين. وقبل هذا وذاك لا بدّ أن يمتلك أرضه وبحاره وسماءه، ويتخلّص من ذلّ الاستعمار وقيوده، وعليه في سبيل ذلك أن يستميت في الدفاع عن حريّته وحرية وطنه لينال إحدى الحسنيين: إمّا النصر وإمّا الشهادة.</p></div>

<div class="card"><h3>اقرأ وافهم</h3><ol>
<li>يكفل الإسلام للفرد حرية التفكير في إطار حدود الشرع.</li>
<li>يكفل الإسلام حرية التعبير ما دام موجّهًا للخير والإصلاح، لأن الإسلام دين خير وإصلاح للبشرية كلها.</li>
<li>يكفل الإسلام حرية السلوك والتصرّف ما لم يؤدِّ إلى إضرار بالآخرين أو وقوع في الحرام.</li>
<li>يحثّ الإسلام أتباعه على أن يعيشوا أحرارًا في أوطانهم، وأن يدافعوا عن تلك الحرية حتى وإن كلّفهم ذلك أرواحهم.</li></ol></div>

<div class="card"><h3>مدخل الموضوع</h3>
<p>خلق الله سبحانه الكون وما فيه من مصادر الثروة من حيوان ونبات وجماد، وجعل ذلك كلّه <b>مسخّرًا للإنسان</b> أسمى مخلوقاته. يقول الله تعالى:</p>
<div class="ayah">﴿ وَالْأَنْعَامَ خَلَقَهَا لَكُمْ فِيهَا دِفْءٌ وَمَنَافِعُ وَمِنْهَا تَأْكُلُونَ ﴾ [النحل: 5]</div><br>
<div class="ayah">﴿ هُوَ الَّذِي أَنزَلَ مِنَ السَّمَاءِ مَاءً لَّكُم مِّنْهُ شَرَابٌ وَمِنْهُ شَجَرٌ فِيهِ تُسِيمُونَ ﴾ [النحل: 10]</div><br>
<div class="ayah">﴿ وَسَخَّرَ لَكُمُ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَ وَالنُّجُومُ مُسَخَّرَاتٌ بِأَمْرِهِ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَعْقِلُونَ ﴾ [النحل: 12]</div><br>
<div class="ayah">﴿ وَهُوَ الَّذِي سَخَّرَ الْبَحْرَ لِتَأْكُلُوا مِنْهُ لَحْمًا طَرِيًّا وَتَسْتَخْرِجُوا مِنْهُ حِلْيَةً تَلْبَسُونَهَا وَتَرَى الْفُلْكَ مَوَاخِرَ فِيهِ وَلِتَبْتَغُوا مِن فَضْلِهِ وَلَعَلَّكُمْ تَشْكُرُونَ ﴾ [النحل: 14]</div><br>
<div class="ayah">﴿ وَإِن تَعُدُّوا نِعْمَةَ اللَّهِ لَا تُحْصُوهَا إِنَّ اللَّهَ لَغَفُورٌ رَّحِيمٌ ﴾ [النحل: 18]</div></div>

<div class="card"><h3>العمل هو السبيل للاستفادة</h3>
<p>إن الاستفادة مما في الكون من خيرات، والانتفاع بما فيه من مصادر الثروة لا يتمّ إلا عن طريق <b>العمل</b>، فالعمل هو الوسيلة الوحيدة التي يستثمر بها الإنسان ما أودعه الله في الكون من ثروات طبيعية أو بشرية، مادّية اقتصادية، أو روحية عقلية. قال تعالى:</p>
<div class="ayah">﴿ وَآيَةٌ لَّهُمُ الْأَرْضُ الْمَيْتَةُ أَحْيَيْنَاهَا وَأَخْرَجْنَا مِنْهَا حَبًّا فَمِنْهُ يَأْكُلُونَ ۞ وَجَعَلْنَا فِيهَا جَنَّاتٍ مِّن نَّخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا مِنَ الْعُيُونِ ۞ لِيَأْكُلُوا مِن ثَمَرِهِ وَمَا عَمِلَتْهُ أَيْدِيهِمْ أَفَلَا يَشْكُرُونَ ﴾ [يس: 33-35]</div></div>

<div class="card"><h3>مكانة العمل في الإسلام</h3>
<p>العمل يتوقّف عليه <b>عمار الكون</b> وبقاء النوع واستمرار الحياة؛ لذلك أمر به الإسلام وحثّ عليه، وجعل له مكانة رفيعة ومنزلة عالية وقدسية خاصة. فقد عمل جميع الرسل:</p>
<ul><li>فكان رسول الله ﷺ يرعى الغنم، ويتاجر في مال خديجة رضي الله عنها.</li>
<li>وعمل مع المسلمين في بناء المسجد بعد الهجرة، وفي حفر الخندق يوم غزوة الأحزاب.</li>
<li>وكان نبي الله داود عليه السلام يأكل من عمل يده.</li></ul>
<div class="hadith">يقول الرسول الكريم ﷺ: «ما أكل أحد طعامًا قطّ خيرًا من أن يأكل من عمل يده، وإن نبيّ الله داود عليه السلام كان يأكل من عمل يده». <small>(رواه البخاري)</small></div>
<p>وكذلك كان الصحابة رضي الله عنهم؛ فكان عمر رضي الله عنه يرى الرجل فيعجبه، ثم يسأل: «ألَه حرفة؟» فإن قيل: لا، سقط من عينه.</p></div>

<div class="card"><h3>العمل المأمور به في الإسلام</h3>
<p>إن العمل الذي أعطاه الإسلام هذه المكانة الرفيعة والمنزلة العالية، وأمر به أتباعه، واعتبره لونًا من العبادة يقرّب المسلم من ربه ويرفعه درجات عند خالقه، وحرص عليه رسله، هو <b>العمل الصالح</b> الذي تصلح به نفوس الأفراد وأحوالهم وأحوال المجتمعات في الإنسانية كلّها. وكل عمل لا يؤدّي إلى الإصلاح والصلاح هو عمل غير صالح، سواء أكان عبادة دينية أو معاملة مدنية أو سياسية. يقول الله تعالى:</p>
<div class="ayah">﴿ مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً وَلَنَجْزِيَنَّهُمْ أَجْرَهُم بِأَحْسَنِ مَا كَانُوا يَعْمَلُونَ ﴾ [النحل: 97]</div></div>

<div class="card"><h3>الإسلام ينهى عن الكسل</h3>
<p>المسلم منهيّ عن الخلود إلى الكسل والبطالة، أو الاعتماد على مال موروث، أو الوقوف مواقف الذلّ والمهانة، مطالَب أن ينظّم حياته بين <b>العمل الجادّ المثمر</b> وبين الاستمتاع بالراحة والاستقرار. وذلك استجابةً لما صنعه العليم الخبير من تنظيم الصلة بين حركة الأرض والكواكب الأخرى، وما نتج عنه من تقسيم الزمن بين ليل يهدأ الإنسان فيه ويسكن عن الحركة والعمل، وبين نهار يسعى فيه على رزقه يبتغي فضل ربّه. يقول الله تعالى:</p>
<div class="ayah">﴿ وَمِن رَّحْمَتِهِ جَعَلَ لَكُمُ اللَّيْلَ وَالنَّهَارَ لِتَسْكُنُوا فِيهِ وَلِتَبْتَغُوا مِن فَضْلِهِ وَلَعَلَّكُمْ تَشْكُرُونَ ﴾ [القصص: 73]</div>
<p>فديننا الإسلامي اهتمّ بالعمل، وأمرنا به لنستثمر ما في الكون من خيرات ونعم لا تعدّ ولا تحصى، ونستفيد مما أودعه الله فيه من ثروات، فنحقّق الرخاء والسعادة لأنفسنا ولغيرنا في هذه الدنيا، بشرط أن يكون هذا العمل غير منافٍ لتعاليم الإسلام وقيمه. يقول الله تعالى:</p>
<div class="ayah">﴿ وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ إِنَّ اللَّهَ لَا يُحِبُّ الْمُفْسِدِينَ ﴾ [القصص: 77]</div></div>

    id:'g9-islamic-21', title:'من دروس السيرة: غيرة عمر بن الخطاب على الإسلام والمسلمين (الجزء الثاني)',
    explain:`
<div class="card"><h3>غيرته على الإسلام والمسلمين</h3>
<p>كان عمر بن الخطاب رضي الله عنه <b>غيورًا على الإسلام</b> من أن يُهان أو تُنتزع هيبته، <b>غيورًا على المسلمين</b> من أن تُداس كرامتهم أو يتعرّض أحدهم لمكروه. وإليك يا بنيّ شواهد على ذلك:</p>
<p><b>أ.</b> عندما مكّن الله المسلمين من كفّار قريش في غزوة بدر، استشار الرسول ﷺ صحابته فيما يفعل بالأسرى، فكان رأي عمر بن الخطاب <b>قتلهم والتخلّص منهم</b>؛ ذلك لأن غزوة بدر هي أول معركة قامت بين المسلمين والمشركين، وفي قتل أسراهم بثّ للخوف في أنفسهم، وإشعارهم بقوة الإسلام وهيبته حتى يتجنّبوا لقاءه مرة ثانية ويُحجموا عن محاربته. ولقد نزل القرآن الكريم مؤيّدًا لرأي عمر بن الخطاب رضي الله عنه، قال تعالى:</p>
<div class="ayah">﴿ مَا كَانَ لِنَبِيٍّ أَن يَكُونَ لَهُ أَسْرَىٰ حَتَّىٰ يُثْخِنَ فِي الْأَرْضِ ﴾ [الأنفال: 68]</div>
<p><b>ب.</b> ومن مواقف غيرة عمر ما حصل بُعيد وفاة الرسول ﷺ عندما اختلف المسلمون فيمن يخلفه، وكادت أن تحصل فتنة لولا تدخّل عمر بن الخطاب الذي وقف وبيّن للناس مكانة وفضل أبي بكر الصدّيق رضي الله عنه، وأسرع ببيعته خليفةً للمسلمين، فبايعه المسلمون جميعًا، وانتهى الخلاف وانطفأت نار الفتنة بفضل الله تعالى، ثم غيرة عمر على الإسلام والمسلمين.</p></div>

<div class="card"><h3>٥. خلافته</h3>
<p>تولّى عمر بن الخطاب رضي الله عنه الخلافة بعد أبي بكر الصدّيق رضي الله عنه، حيث أجمع المسلمون على مبايعته وتسميته <b>أمير المؤمنين</b>. ولم تكن تلك الخلافة تعني عند عمر رضي الله عنه سوى مسؤولية كبرى تجاه الإسلام والمسلمين جميعًا، وذلك يعني إرساء قواعد الدولة على أسس تضمن لها الصمود أمام الأعاصير وتضمن لها النمو والاستقرار. فعمل عمر بن الخطاب منذ توليه الخلافة على ذلك، وكان أول عمل قام به: <b>اختيار رجالات الدولة</b> من العناصر التي توسّم فيها الورع والقدرة على إدارة الأمور وتطبيق شريعة الله في أرضه بين خلقه، وكان هو نفسه قدوة في ذلك، فضرب للناس أعظم المثل في النزاهة والعدل. ومن شواهد ذلك:</p>
<p><b>أ. قصة العدل مع ابن عمرو بن العاص:</b> من أشهر قصص العدل التي تُروى عن ابن الخطاب رضي الله عنه ما حدث في مصر عندما كان عمرو بن العاص واليًا عليها من قبل عمر بن الخطاب، حيث أُقيم سباق للخيل اشترك فيه محمد بن عمرو بن العاص، فكان أن سبقت فرسُ أحد المصريين فرسَ محمد بن عمرو بن العاص، فغضب لذلك وضرب المصري، وصار يقول له: «خذها وأنا ابن الأكرمين» (يقصد أنه ابن والي مصر، أي من الطبقة الحاكمة). فشكا المصري إلى عمر بن الخطاب، فماذا فعل؟ عقد مجلسًا حضره جمع كبير من الصحابة، واستدعى عمرو بن العاص وابنه، ثم أعطى المصري سوطًا وقال له: اضرب محمد بن عمرو، فضربه، ثم قال له: اضرب عمرًا نفسه، فوالله ما ضربك ابنه إلا بسلطانه. قال المصري: يا أمير المؤمنين، قد ضربتُ من ضربني. فالتفت عمر إلى عمرو بن العاص وقال له قولته التي ظلّت خالدة على مدى التاريخ:</p>
<div class="hadith">«متى استعبدتم الناس وقد ولدتهم أمهاتهم أحرارًا».</div>
<p><b>ب. تفقّده أحوال الرعية:</b> ومن شواهد عدله وإحساسه بالمسؤولية تجاه رعيّته ما يُروى من أنه كان دائم الخروج في الليل ليتفقّد أحوال المسلمين، وذات ليلة كان يسير خارج المدينة مع أحد الصحابة فرأيا نارًا، ولما وصلاها وجدا صبية يبكون وامرأة تضع قِدرًا على النار. اقترب عمر من المرأة وقال: السلام عليكم يا أهل الضوء. ردّت المرأة السلام. قال عمر: أأدنو؟ فأذنت له، فدنا، ثم قال: ما بالكم؟ قالت المرأة: قصّر بنا الليل والبرد. قال عمر: وما بال هؤلاء الصبية؟ قالت: الجوع. قال: أي شيء في هذا القِدر؟ قالت: ماء أغليه أسكتهم به حتى يناموا، فنحن لا نملك شيئًا، والله بيننا وبين عمر -ولم تكن تعرفه. قال: وما يدري عمر بكم؟ قالت: يتولّى أمرنا ثم يغفل عنّا؟!</p>
<p>أحسّ عمر بمسؤوليته، وخرج مع رفيقه مسرعين وذهبا إلى مقرّ الخلافة، فحمل دقيقًا وسمنًا وأسرع بهما إلى تلك المرأة، وحال وصوله طلب من المرأة أن تطبخ لصبيتها، وصار يساعدها في الطبخ وينفخ في النار والدخان يتخلّل لحيته، وبعد الانتهاء من الطبخ أخذ عمر يبرّد الطعام للصبية. قالت المرأة: جزاك الله خيرًا، لقد فعلتَ ما لم يفعله أمير المؤمنين عمر!!</p>
<p>إن ذلك يا بنيّ قليل من كثير مما عُرف عن عدل عمر بن الخطاب ورحمته بالمسلمين وغير المسلمين، فكان لا ينام حتى يخرج فيتفقّد أحوال الرعية، يعطي المعدوم، ويواسي المصاب، ويعلّم ولاته معنى العدل والمساواة، كل ذلك خوفًا من الله وإحساسًا بالمسؤولية.</p></div>

<div class="card"><h3>٦. سياسته</h3>
<p>إلى جانب ما اشتهر به عمر بن الخطاب من عدل ونزاهة، فقد ساس دولته <b>أعظم سياسة</b>، حيث نظّم أمورها وأنشأ فيها إدارات متخصّصة تسيّر تلك الأمور. ولقد أكّدت الأحداث في عهده أنه كان سياسيًّا محنّكًا يعدّ لكل شيء عدّته، ويتفاعل مع تلك الأحداث وفق رؤية نافذة توجد الحلول المناسبة لكل طارئ.</p>
<p><b>أ. عام الرمادة:</b> ومن شواهد ذلك ما حدث للمسلمين في العام السابع عشر للهجرة عندما أُصيبوا بقحط شديد ونزلت بهم ضائقة لم يكن بوسعهم تحمّلها، فقد شحّت السماء (كناية عن تعطّل نزول المطر)، فجفّ الزرع والضرع، وتحوّلت الأرض إلى ما يشبه لون الرماد، حتى سمّى المسلمون ذلك العام <b>بعام الرمادة</b>. عندها ظهرت عبقرية عمر السياسية، حيث أرسل إلى ولاة الأقاليم الإسلامية وطلب منهم أن يرسلوا كل ما يقدرون عليه من مؤونة، وكان يدرك أن ذلك لا يكفي إن لم يوزَّع بمقدار، فكان يقف بنفسه ويوزّع على الناس ما يصلهم ويشرف على موائد الطعام حتى يضمن وصول الغذاء للجميع، ولم يؤثر نفسه ولا أهله بشيء، بل كان يأخذ الأقلّ حتى يكون القدوة الحسنة في ذلك.</p>
<p><b>ب. السياسة الخارجية:</b> وفي مجال السياسة الخارجية عمل عمر بن الخطاب رضي الله عنه على إتمام ما بدأه الرسول ﷺ من توسيع رقعة الدولة الإسلامية، ففي عهده تمّ فتح بلاد فارس آنذاك، وفتح بلاد الشام وفلسطين بما فيها <b>بيت المقدس</b> الذي ذهب إليه عمر بنفسه، وكتب لأهله عهدًا أمّنهم فيه على أنفسهم وكنائسهم وأموالهم، وأظهر فيه التسامح الإسلامي مع غير المسلمين، كما تمّ في عهد عمر فتح الإسكندرية وبقية الأقاليم المصرية.</p>
<p>وهكذا يا أبنائي كانت حياة عمر بن الخطاب حافلة بالمآثر، جديرة بأن تكون منهاجًا يأخذ به المصلحون ويسير على هديه الراغبون في مرضاة الله ورسوله، فرحم الله عمر وجزاه عن الإسلام والمسلمين خير الجزاء.</p></div>

    explain:`
<div class="card"><h3>مقدمة الدرس</h3>
<p>لقد وهب الله سبحانه وتعالى للإنسان القدرة على <b>التفكير العلمي</b> في حل المسائل التي عجز عنها باقي المخلوقات. ولم يستطع الإنسان بكل ما أوتي من الذكاء والإبداع أن يعطي هذه القدرة لأي آلة أو اختراع مثل الإنسان الآلي أو الحاسوب بجميع أحجامه واستخداماته.</p>
<p>وسندرس <b>خطوات حل المشكلة</b>، واستخدام <b>الخوارزميات</b> و<b>مخطط سير العمليات</b> في حل المسائل المتنوعة.</p></div>

<div class="card"><h3>الحاسوب والمسألة</h3>
<p>يتميّز الحاسوب بقدرته الفائقة على معالجة الأوامر والتعليمات المعطاة له جميعها، وتنفيذها بدقة متناهية وسرعة فائقة، لكنه <b>يعجز عن حل أية مسألة (مشكلة) بشكل ذاتي</b>، أي أن عمله يقتصر على تنفيذ ما يُطلب منه من أوامر وتعليمات؛ لذلك لا بدّ لنا من معرفة خطوات حل المسألة حسب الأسس العلمية للوصول إلى حلول مناسبة، وعلينا إعطاء الأوامر للحاسوب حتى يقوم بتنفيذها بشكل صحيح ويؤدّي النتيجة المطلوبة.</p>
<p><b>المسألة</b> هي الهدف أو الناتج المطلوب الوصول إليه، حيث يقوم المبرمج بمجموعة من الخطوات بناءً على معطيات المسألة للوصول إلى المطلوب.</p>
<p>وللوصول إلى حل أي مسألة باستخدام الحاسوب هناك خطوات محددة يجب اتّباعها، وتتلخّص فيما يأتي:</p></div>

<div class="fl">كتابة البرنامج بواسطة إحدى لغات البرمجة</div><div class="fa">⬇</div>
<div class="fl">تنفيذ البرنامج واختباره</div><div class="fa">⬇</div>

<div class="card"><h3>١. فهم المسألة وتحليلها</h3>
<p>تُعدّ خطوة فهم المسألة وتحليل عناصرها من الأمور المهمة التي يجب عدم تجاهلها؛ لأنها تساعدك للوصول إلى الحل السليم، وقد يؤدّي تجاهلها إلى حلّ خاطئ للمسألة. ويتم ذلك بتحديد:</p>
<ul><li><b>المدخلات</b> المتوافرة في المسألة.</li>
<li><b>المخرجات</b> وشكلها (النتائج المراد الوصول إليها).</li>
<li><b>طرق الحل</b> المختلفة (المعالجة)، وقد تكون معادلة أو قانونًا رياضيًا...، وتقييمها لاختيار أفضلها.</li></ul>
<div class="hadith"><b>مثال 1: حلّ المسألة الآتية إلى عناصرها:</b> إيجاد مساحة مستطيل طوله (س) وعرضه (ص).
<div style="overflow-x:auto;margin-top:8px"><table class="idx-table"><tbody>

<tr><td><b>طريقة الحل</b></td><td>مساحة المستطيل = الطول × العرض، أي: م = س × ص.</td></tr></tbody></table></div></div>
<p><b>نشاط (تحليل المسألة):</b> حلّ المسألة الآتية إلى عناصرها (المدخلات، المخرجات، طرق الحل الممكنة): إيجاد متوسط درجات التلميذ في ثلاث مواد: اللغة العربية، الرياضيات، اللغة الإنجليزية.</p></div>

<div class="card"><h3>٢. كتابة خوارزمية</h3>
<p><b>الخوارزمية:</b> هي مجموعة من الخطوات الواضحة والمتسلسلة منطقيًا، المكتوبة بلغة الإنسان (مثلًا اللغة العربية أو اللغة الإنجليزية) للوصول إلى حلّ للمسألة. ويمكن تمثيل الخوارزمية باستخدام الرسم عن طريق <b>مخططات سير العمليات</b>، وسيأتي شرحهما فيما بعد.</p></div>

<div class="card"><h3>٥. التوثيق</h3>
<p>تُعدّ خطوة التوثيق من الخطوات المهمة جدًّا في حل المسألة، وهي <b>وصف كتابي</b> لكاتب البرنامج وأهدافه وأجزائه وإجراءات تشغيله، مدعومًا بالوثائق والمستندات والرسوم الإيضاحية، وذلك للرجوع إلى البرنامج وقت الحاجة، بهدف:</p>

    id:'g9-computer-2', title:'الدرس الثاني: الخوارزميات',
    explain:`
<div class="card"><h3>تعريف الخوارزمية</h3>
<p>تُعرف <b>الخوارزمية</b> بأنها مجموعة من الخطوات الواضحة، والمتسلسلة منطقيًا، والمكتوبة بلغة الإنسان بشكل مفصل للوصول إلى حل مسألة معينة.</p></div>

<div class="card"><h3>أصل الكلمة</h3>
<p>استحدث فكرتها عالم الرياضيات (<b>أبو جعفر محمد بن موسى الخوارزمي</b>) في القرن التاسع الميلادي. ويعد الخوارزمي <b>مؤسس علم الجبر</b>، وهو من أوائل علماء الرياضيات، وقد اشتقت كلمة خوارزمية (Algorithm) من اسمه.</p></div>

<div class="card"><h3>فوائد كتابة الخوارزمية</h3>
<ul><li>توفر الكثير من الوقت في حل المسألة؛ لأنها ترسم طريق الحل بشكل محدد وواضح.</li>
<li>تصبح عملية ترجمتها إلى برنامج <b>أسهل بكثير</b> من الشروع في كتابة البرنامج مباشرة.</li></ul>
<p>وهناك أكثر من طريقة لكتابة الخوارزمية، وعوامل عديدة لتحديد أيّ الخوارزميات هي الأفضل للتطبيق، هل هو عامل الوقت أو الأقل أوامر، فهو أفضل في الترجمة وكذلك التنفيذ. فهناك خوارزميات قد تأخذ وقتًا طويلًا للوصول إلى الحل، بينما تأخذ خوارزميات أخرى وقتًا أقصر لحل المسألة نفسها.</p></div>

<div class="card"><h3>خصائص الخوارزميات</h3>
<p>تمتاز الخوارزمية بمجموعة من الخصائص ومنها:</p>
<ol><li>وضوح خطوات الحل ولا تعتمد لغة محددة.</li>
<li>التنوع في أساليب الحل وعدم اعتمادها على أسلوب محدد.</li>
<li>الوصول إلى حل صحيح بعد عدد معين ومحدود من الخطوات.</li>
<li>تستخدم الخوارزمية في حل مسائل مشابهة.</li>
<li>سهولة اكتشاف وتصحيح الأخطاء.</li>
<li>تعتبر توثيق للحل.</li></ol></div>

<div class="card"><h3>تحديد المدخلات والمخرجات</h3>
<p>قبل البدء بحل المسألة يجب <b>تحديد المدخلات والمخرجات</b>.</p>
<div class="hadith"><b>مثال 1:</b> اكتب خوارزمية لحساب وطباعة مساحة مربع علمًا بأن مساحة المربع = طول الضلع × نفسه.
<table class="idx-table"><tbody>
<tr><td><b>المدخلات</b></td><td>طول ضلع المربع <span dir="ltr">A</span></td></tr>
<tr><td><b>المخرجات</b></td><td>مساحة المربع <span dir="ltr">M</span></td></tr></tbody></table>
<p><b>الحل:</b></p>
<div class="flow"><div class="fl">1- ابدأ</div><div class="fa">⬇</div>
<div class="fl">2- ادخل طول ضلع المربع A</div><div class="fa">⬇</div>
<div class="fl">3- احسب مساحة المربع: <span dir="ltr">M = A × A</span></div><div class="fa">⬇</div>
<div class="fl">4- اطبع مساحة المربع M</div><div class="fa">⬇</div>
<div class="fl">5- توقف</div></div></div>
<p><b>نشاط:</b> اكتب خوارزمية تقرأ طول مستطيل (L) وعرضه (W) واحسب مساحة المستطيل Area ثم اطبعها علمًا بأن مساحة المستطيل = الطول × العرض.</p></div>

<div class="card"><h3>مثال 2: المدخلات والمخرجات (مساحة المثلث)</h3>
<p>حدد المدخلات والمخرجات في الخوارزمية الآتية:</p>
<div class="flow"><div class="fl">1- إبدأ</div><div class="fa">⬇</div>
<div class="fl">2- اقرأ قاعدة المثلث L</div><div class="fa">⬇</div>
<div class="fl">3- إقرأ ارتفاع المثلث H</div><div class="fa">⬇</div>
<div class="fl">4- احسب مساحة المثلث: <span dir="ltr">A = 1/2 * L * H</span></div><div class="fa">⬇</div>
<div class="fl">5- اطبع مساحة المثلث A</div><div class="fa">⬇</div>
<div class="fl">6- توقف</div></div>
<div class="hadith"><b>الحل:</b>
<table class="idx-table"><tbody>
<tr><td><b>المدخلات</b></td><td>طول قاعدة المثلث <span dir="ltr">L</span> وارتفاع المثلث <span dir="ltr">H</span></td></tr>
<tr><td><b>المخرجات</b></td><td>مساحة المثلث <span dir="ltr">A</span></td></tr></tbody></table></div>
<p><b>نشاط:</b> حدد المدخلات والمخرجات في الخوارزمية الآتية:</p>
<div class="flow"><div class="fl">1- إبدأ</div><div class="fa">⬇</div>
<div class="fl">2- ادخل ثلاث درجات <span dir="ltr">A , B , C</span></div><div class="fa">⬇</div>
<div class="fl">3- احسب مجموع الدرجات: <span dir="ltr">sum = A + B + C</span></div><div class="fa">⬇</div>
<div class="fl">4- احسب المتوسط: <span dir="ltr">AV = sum/3</span></div><div class="fa">⬇</div>
<div class="fl">5- اطبع المتوسط AV</div><div class="fa">⬇</div>
<div class="fl">6- توقف</div></div></div>

<div class="card"><h3>مثال 3: الاختيار بين حالتين</h3>
<p>اكتب خوارزمية لإدخال مجموع درجات تلميذ واطبع كلمة <b>ناجح</b> إذا كان المجموع أكبر أو يساوي 50 وكلمة <b>راسب</b> إذا كان المجموع أقل من 50.</p>
<div class="hadith"><b>الحل:</b>
<div class="flow"><div class="fl">1- إبدأ.</div><div class="fa">⬇</div>
<div class="fl">2- أدخل مجموع درجات التلميذ D.</div><div class="fa">⬇</div>
<div class="fl">3- هل مجموع الدرجات <span dir="ltr">D&gt;=50</span>؟ إذا (نعم) إطبع ناجح وإذا (لا) إطبع راسب.</div><div class="fa">⬇</div>
<div class="fl">4- توقف.</div></div></div></div>

<div class="card"><h3>نشاط: إكمال خوارزمية</h3>
<p>أكمل كتابة الخوارزمية الآتية لإدخال اسم التلميذ و3 درجات واحسب مجموع الدرجات والمتوسط ثم اطبع اسم التلميذ والمتوسط:</p>
<div class="hadith"><b>الإكمال (صياغة Claude، راجعها على دليل المعلم):</b>
<div class="flow"><div class="fl">1- إبدأ</div><div class="fa">⬇</div>
<div class="fl">2- أدخل اسم التلميذ</div><div class="fa">⬇</div>
<div class="fl">3- أدخل الدرجات الثلاث A , B , C</div><div class="fa">⬇</div>
<div class="fl">4- احسب مجموع الدرجات: sum = A + B + C</div><div class="fa">⬇</div>
<div class="fl">5- احسب المتوسط: AV = sum / 3</div><div class="fa">⬇</div>
<div class="fl">6- اطبع اسم التلميذ</div><div class="fa">⬇</div>
<div class="fl">7- اطبع المتوسط AV</div><div class="fa">⬇</div>
<div class="fl">8- توقف</div></div></div></div>`,

      {t:'open',q:'نشاط: أكمل كتابة خوارزمية لإدخال اسم التلميذ و3 درجات وحساب المجموع والمتوسط ثم طباعة اسم التلميذ والمتوسط.',a:'1- ابدأ. 2- أدخل اسم التلميذ. 3- أدخل الدرجات الثلاث A , B , C. 4- احسب المجموع: sum = A + B + C. 5- احسب المتوسط: AV = sum / 3. 6- اطبع اسم التلميذ. 7- اطبع المتوسط AV. 8- توقف. (صياغة Claude، راجعها على دليل المعلم)'},
      {t:'open',q:'تمرين 1: عدّد خمس خصائص للخوارزميات.',a:'1- وضوح خطوات الحل وعدم اعتمادها على لغة محددة. 2- التنوع في أساليب الحل وعدم اعتمادها على أسلوب محدد. 3- الوصول إلى حل صحيح بعد عدد معين ومحدود من الخطوات. 4- تستخدم في حل مسائل مشابهة. 5- سهولة اكتشاف الأخطاء وتصحيحها. (وتعتبر أيضًا توثيقًا للحل)'},
      {t:'open',q:'تمرين 2: حلل المسألة الآتية إلى عناصرها: إيجاد محيط مستطيل طوله (Y) وعرضه (X)، علمًا بأن محيط المستطيل = 2 × (الطول + العرض)، أي F = 2*(Y+X).',a:'المدخلات: طول المستطيل Y وعرضه X. المخرجات: محيط المستطيل F. طريقة الحل (المعالجة): F = 2 * (Y + X).'},

      {t:'open',q:'تمرين 4: ابحث عن أهم منجزات العالم أبو جعفر الخوارزمي، وإسهاماته في علم الجبر، وتأثير علمه على حضارة أوروبا.',a:'من نص الدرس: هو أبو جعفر محمد بن موسى الخوارزمي، عالم رياضيات من أوائل علماء الرياضيات في القرن التاسع الميلادي، ومؤسس علم الجبر، ومنه اشتقت كلمة (Algorithm). (تنبيه: بقية الإجابة من خارج الكتاب ويجب مراجعتها) ألّف كتاب «الجبر والمقابلة»، وأسهم في نقل الأرقام الهندية وطرق الحساب العشري إلى العالم، وترجمت مؤلفاته إلى اللاتينية في أوروبا وأثرت في تطور الرياضيات هناك.'}

    id:'g9-computer-3', title:'الدرس الثالث: مخطط سير العمليات (خرائط التدفق)',
    explain:`
<div class="card"><h3>مقدمة الدرس</h3>
<p>يُعد تمثيل الخوارزمية باستخدام الرسم، عن طريق <b>مخططات سير العمليات</b>، أسهل وأكثر وضوحًا من كتابة الخوارزمية بالطريقة التقليدية المتمثلة في نقاط متسلسلة؛ حيث تستطيع أن تلاحظ <b>التتبع المنطقي</b> لحل المشكلة بسهولة أكبر، وأن تحدد مخططات سير العمليات المستخدمة بآلية معينة في الرسم عن طريق استخدام <b>أشكال هندسية محددة</b>.</p></div>

<div class="card"><h3>١. رموز مخططات سير العمليات</h3>
<p>تستخدم مخططات سير العمليات أشكالًا هندسية خاصة للتعبير عن خطوات حل المسألة، بحيث يكون لكل شكل <b>مدلوله الخاص به</b>، ويُكتب داخل كل شكل نص مختصر للخطوة المطلوبة. ويبين الجدول بعض الأشكال المستخدمة ومعناها ومثالًا على كل منها:</p>
<div style="overflow-x:auto"><table class="idx-table"><thead><tr><th>الشكل الهندسي</th><th>المعنى</th><th>مثال</th></tr></thead><tbody>
<tr><td><span class="sh sh-oval">&nbsp;</span></td><td>بداية أو نهاية مخطط سير العمليات</td><td><span class="sh sh-oval">ابدأ</span> <span class="sh sh-oval">توقف</span></td></tr>
<tr><td><span class="sh sh-io">&nbsp;</span></td><td>إدخال (قراءة) البيانات / إخراج (طباعة) المعلومات</td><td><span class="sh sh-io"><i>اقرأ A</i></span> <span class="sh sh-io"><i>اطبع Z</i></span></td></tr>
<tr><td><span class="sh sh-proc">&nbsp;</span></td><td>عملية معالجة (مثل العمليات الحسابية)</td><td><span class="sh sh-proc">أوجد قيمة E من المعادلة: <span dir="ltr">E = C + B</span></span></td></tr>
<tr><td><span class="sh sh-dec">&nbsp;</span></td><td>اتخاذ قرار</td><td><span class="sh sh-dec">هل C أكبر من 5؟</span><br>(نعم ← / → لا)</td></tr>
<tr><td><span style="font-size:1.6rem">⟶ ⟵ ⇅</span></td><td>أسهم اتجاه سير العمليات</td><td>—</td></tr>
<tr><td><span class="sh sh-con">&nbsp;</span></td><td>حلقة ربط داخلية</td><td>—</td></tr></tbody></table></div>
<p><b>نشاط (أشكال ورموز):</b> بالتعاون مع زملائك، وباستخدام شبكة الإنترنت، ابحث عن أشكال ورموز أخرى غير المذكورة في الجدول، واكتب المعنى الذي يمثله كل شكل منها.</p></div>

<div class="card"><h3>٢. فوائد مخططات سير العمليات</h3>
<p>لمخططات سير العمليات فوائد كثيرة منها:</p>
<ul style="list-style:none;padding:0 4px"><li><b>أ –</b> توضيح التسلسل المنطقي لخطوات حل المسألة، وإعطاء صورة كاملة وواضحة لخطوات الحل، والاطلاع على أجزاء المسألة جميعها قبل التنفيذ.</li><li><b>ب –</b> إعطاء المستخدم فرصة لتجربة أكثر من طريقة واحدة لحل مسألة معينة.</li><li><b>ج –</b> تساعد على تجنب الأخطاء والتخلص من التفصيلات غير الضرورية.</li><li><b>د –</b> تستخدم مرجعًا خاصًا لحفظ وثائق المسألة، حيث يسهل الرجوع إليها عند إعادة حل المسألة ذاتها أو المسائل المشابهة لها.</li><li><b>هـ –</b> تساعد على تعديل البرنامج بسهولة.</li><li><b>و –</b> تساعد على اكتشاف <b>الأخطاء المنطقية</b> (Logical errors)، وهي من الأخطاء التي يصعب اكتشافها، حيث يعتمد اكتشافها على التسلسل المنطقي لخطوات الحل.</li></ul></div>

<div class="card"><h3>٣. إرشادات عامة لرسم مخططات سير العمليات</h3>
<p>الأسلوب الشائع في رسم مخططات سير العمليات هو الذي يبدأ <b>من الأعلى إلى الأسفل</b>، و<b>من اليسار إلى اليمين</b>، ويبدأ الرسم عادةً برمز البداية وينتهي برمز النهاية. ومن الإرشادات العامة التي تساعدك في الرسم:</p>
<div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div><div class="fl" style="min-width:40%">خطوات الحل ...</div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div>
<ul style="list-style:none;padding:0 4px"><li><b>أ –</b> ابدأ برسم مخطط سير العمليات من أعلى الصفحة، بحيث يكون خط السير إلى أسفل.</li><li><b>ب –</b> رقّم كل صفحة من صفحات مخطط سير العمليات في تسلسل معين، واكتب عنوان المسألة والتاريخ واسمك على كل صفحة من صفحات المخطط.</li><li><b>ج –</b> صف كل خطوة لغويًا، بحيث يمكن فهمها ومتابعة جميع الخطوات بسهولة.</li></ul>
<p><b>نشاط (الأشكال):</b> توجد برمجيات كثيرة تساعدك على رسم مخططات سير العمليات بسهولة ويسر، منها برنامج معالج النصوص. استخدم برنامج معالج النصوص وابحث عن الأشكال المستخدمة التي تعلمتها في رسم مخططات سير العمليات. ثم ابحث في شبكة الإنترنت عن برمجيات جاهزة تستخدم لرسم مخططات سير العمليات واستخدم إحداها.</p></div>

<div class="card"><h3>٤. أنواع مخططات سير العمليات</h3>
<p>هناك ثلاثة أنواع رئيسة لمخططات سير العمليات:</p>
<ul style="list-style:none;padding:0 4px"><li><b>أ –</b> <b>مخططات سير العمليات التتابعية</b> (Sequential Flowcharts).</li><li><b>ب –</b> <b>مخططات سير العمليات ذات التفرع</b> (Branched Flowcharts).</li><li><b>ج –</b> <b>مخططات سير العمليات ذات التكرار</b> (Loop Flowcharts).</li></ul>
<p>ويمتاز كل نوع من هذه الأنواع بخاصية تميزه عن غيره:</p>
<table class="idx-table"><thead><tr><th>النوع</th><th>الخاصية</th></tr></thead><tbody>
<tr><td><b>التتابعي</b></td><td>تكون خطواته تتابعية متسلسلة</td></tr>
<tr><td><b>ذو التفرع</b></td><td>يحتوي عادةً على عملية اتخاذ قرار</td></tr>
<tr><td><b>ذو التكرار</b></td><td>يمتاز بوجود تكرار لعمليات معينة أكثر من مرة</td></tr></tbody></table>
<p>ويمكن لمخطط سير العمليات أن يحتوي على <b>أكثر من نوع</b> من أنواع المخططات.</p></div>

<div class="card"><h3>نشاط (الأشكال): رسم مخطط الخطوات</h3>
<p>ارسم الشكل الهندسي الذي يمثل كلًّا من الخطوات الآتية في مخطط سير العمليات: 1- إبدأ. 2- اقرأ درجة طالب X. 3- أضف العدد (5) إلى المتغير (X): <span dir="ltr">Y = X + 5</span>. 4- اطبع Y. 5- توقف.</p>
<div class="hadith"><b>الحل (بحسب رموز الجدول، صياغة Claude):</b>
<div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div>
<span class="sh sh-io"><i>اقرأ X</i></span><div class="fa">⬇</div>
<span class="sh sh-proc"><span dir="ltr">Y = X + 5</span></span><div class="fa">⬇</div>
<span class="sh sh-io"><i>اطبع Y</i></span><div class="fa">⬇</div>
<span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>نشاط (مخطط سير العمليات): إكمال الجدول</h3>
<p>اكمل الجدول بكتابة عمل رموز مخطط سير العمليات الآتي:</p>

<div style="overflow-x:auto;margin-top:8px"><table class="idx-table"><thead><tr><th>الرمز</th><th>العملية</th></tr></thead><tbody>
<tr><td><span class="sh sh-oval">&nbsp;</span></td><td>بداية أو نهاية المخطط</td></tr>
<tr><td><span class="sh sh-con">&nbsp;</span></td><td>حلقة ربط داخلية</td></tr>
<tr><td><span class="sh sh-proc"><span dir="ltr">X + Y</span></span></td><td>عملية معالجة (عملية حسابية)</td></tr>
<tr><td><span class="sh sh-io"><i><span dir="ltr">X , Y</span></i></span></td><td>إدخال (قراءة) البيانات</td></tr>
<tr><td><span class="sh sh-io"><i>Z</i></span></td><td>إخراج (طباعة) المعلومات</td></tr>
<tr><td><span class="sh sh-dec"><span dir="ltr">X = Y</span></span></td><td>اتخاذ قرار</td></tr>
<tr><td><span style="font-size:1.4rem">⟶ ⟵ ⇅</span></td><td>أسهم اتجاه سير العمليات</td></tr></tbody></table></div></div></div>`,

    id:'g9-computer-4', title:'الدرس الرابع: مخطط التتابع البسيط',
    explain:`
<div class="card"><h3>١. مخطط سير العمليات التتابعي</h3>
<p>يتميز مخطط سير العمليات التتابعي بأنه يحتوي على مجموعة من <b>الخطوات المتسلسلة والمتتابعة</b>، من دون وجود <b>تفرع</b> أو <b>تكرار</b> لأي منها، وقد تكون هذه الخطوات <b>إدخالًا</b> أو <b>إخراجًا</b> أو <b>معالجة</b>، وبالتالي يتخذ شكل مخطط سير العمليات التتابعي شكلًا عامًّا، كما هو مبين في الشكل:</p>
<div class="flow"><span class="sh sh-oval">START</span><div class="fa">⬇</div><span class="sh sh-io"><i>إدخال</i></span><div class="fa">⬇</div><span class="sh sh-proc">معالجة</span><div class="fa">⬇</div><span class="sh sh-oval">STOP</span></div>
<p>ويبدأ الشكل العام للمخطط برمز ابدأ <span dir="ltr">(START)</span>، وينتهي برمز توقف <span dir="ltr">(STOP)</span>، وما بينهما خطوات تحددها المسألة المطلوبة واحتياجاتها، من إدخال ومعالجة وإخراج.</p>
<div class="note">ويجب الانتباه عند رسم مخطط سير العمليات التتابعي إلى ضرورة <b>ترتيب خطوات الحل بالشكل التسلسلي الصحيح</b>، وألّا تسبق خطوة خطوة أخرى، كي لا تنتج عندها <b>أخطاء منطقية</b> يصعب اكتشافها فيما بعد.</div>
<p><b>نشاط (الشكل العام لمخططات سير العمليات):</b> بالتعاون مع زملائك، وباستخدام شبكة الإنترنت، نفذ ما يأتي: ابحث عن الشكل العام لمخططات سير العمليات ذات التفرع، ومخططات سير العمليات ذات التكرار. ثم قارن بين الأشكال العامة لأنواع مخططات سير العمليات الرئيسة.</p></div>

<div class="card"><h3>مثال ١: مخطط التتابع البسيط</h3>
<p>ارسم مخطط سير العمليات لإدخال وطباعة ضرب عددين.</p>
<div class="hadith"><b>الحل:</b>
<div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div>
<span class="sh sh-io"><i>أدخل قيمة X</i></span><div class="fa">⬇</div>
<span class="sh sh-io"><i>أدخل قيمة Y</i></span><div class="fa">⬇</div>
<span class="sh sh-proc">احسب <span dir="ltr">A = X * Y</span></span><div class="fa">⬇</div>
<span class="sh sh-io"><i>اطبع الناتج A</i></span><div class="fa">⬇</div>
<span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>نشاط (ارسم مخطط): جمع رقمين</h3>
<p>ارسم مخطط سير العمليات لجمع رقمين، وطباعة الناتج:</p>
<div class="hadith"><b>الحل:</b>
<div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div>
<span class="sh sh-io"><i>أدخل <span dir="ltr">X , Y</span></i></span><div class="fa">⬇</div>
<span class="sh sh-proc">احسب <span dir="ltr">Z = X + Y</span></span><div class="fa">⬇</div>
<span class="sh sh-io"><i>اطبع Z</i></span><div class="fa">⬇</div>
<span class="sh sh-oval">توقف</span></div></div>
<p>كما تلاحظ في المثال، فقد أعطيت <b>المتغيرات رمزًا</b>، حيث إن التعامل مع الرموز يكون أكثر سهولة وسرعة عندما يتطلب الأمر كتابة معادلات رياضية. ونلاحظ في المخطط أعلاه أننا رمزنا للرقمين المدخلين بالرمزين <b>X</b> و<b>Y</b>، وللمخرجات – وهي حاصل جمع الرقمين – بالرمز <b>Z</b>.</p></div>

<div class="card"><h3>مثال ٢: مخطط التتابع البسيط</h3>
<p>ارسم مخطط سير العمليات لإدخال قيم وحساب وطباعة مجموع القيم ومتوسطها حسب المعادلات الآتية:</p>
<div class="hadith" dir="ltr" style="text-align:left"><span dir="ltr">Sum = X + Y + Z</span><br><span dir="ltr">Avg = Sum / 3</span></div>
<div class="hadith"><b>الحل:</b>
<div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div>
<span class="sh sh-io"><i>أدخل <span dir="ltr">X , Y , Z</span></i></span><div class="fa">⬇</div>
<span class="sh sh-proc">احسب <span dir="ltr">sum = X + Y + Z</span></span><div class="fa">⬇</div>
<span class="sh sh-proc">احسب <span dir="ltr">Avg = sum / 3</span></span><div class="fa">⬇</div>
<span class="sh sh-io"><i>اطبع sum</i></span><div class="fa">⬇</div>
<span class="sh sh-io"><i>اطبع Avg</i></span><div class="fa">⬇</div>
<span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>نشاط (مخطط التتابع البسيط): تتبع المخطط</h3>
<p>تتبع مخطط سير العمليات الآتي ثم أجب عن الأسئلة اللاحقة:</p>
<div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div>
<span class="sh sh-io"><i>أدخل نصف القطر نق</i></span><div class="fa">⬇</div>
<span class="sh sh-proc">أحسب مساحة الدائرة<br>س = ط نق<sup>2</sup></span><div class="fa">⬇</div>
<span class="sh sh-proc">أحسب محيط الدائرة<br>ح = 2 ط نق</span><div class="fa">⬇</div>
<span class="sh sh-io"><i>أطبع س ، ح</i></span><div class="fa">⬇</div>
<span class="sh sh-oval">توقف</span></div>
<div class="hadith"><b>الإجابات (من المخطط):</b>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> المدخلات: نصف القطر (نق).</li><li><b>2 –</b> المعالجة: حساب مساحة الدائرة س = ط نق²، وحساب محيط الدائرة ح = 2 ط نق.</li><li><b>3 –</b> المخرجات: مساحة الدائرة (س) ومحيطها (ح).</li><li><b>4 –</b> عمل المخطط: حساب مساحة الدائرة ومحيطها وطباعتهما بمعلومية نصف القطر.</li></ul></div></div>`,

      {t:'fill',q:'ينتج عن ترتيب الخطوات الخاطئ أخطاء ...... يصعب اكتشافها.',a:'منطقية'},
      {t:'fill',q:'الخطوات في مخطط التتابع قد تكون إدخالًا أو إخراجًا أو ......',a:'معالجة'},
      {t:'open',q:'ما الذي يتميز به مخطط سير العمليات التتابعي؟',a:'يتميز بأنه يحتوي على مجموعة من الخطوات المتسلسلة والمتتابعة، من دون وجود تفرع أو تكرار لأي منها، وقد تكون هذه الخطوات إدخالًا أو إخراجًا أو معالجة.'},
      {t:'open',q:'اذكر الشكل العام لمخطط سير العمليات التتابعي.',a:'يبدأ برمز ابدأ (START)، ثم خطوات الإدخال، ثم المعالجة، ثم الإخراج بحسب المسألة، وينتهي برمز توقف (STOP).'},
      {t:'open',q:'نشاط (الشكل العام): ابحث عن الشكل العام لمخططات سير العمليات ذات التفرع وذات التكرار، وقارن بين الأشكال العامة لأنواع مخططات سير العمليات الرئيسة.',a:'نشاط بحثي: تتعدد إجاباته بحسب ما يجده الطالب. راجع دليل المعلم.'},
      {t:'open',q:'مثال 1: ارسم مخطط سير العمليات لإدخال وطباعة ضرب عددين.',a:'ابدأ (بيضاوي) ← أدخل قيمة X (متوازي أضلاع) ← أدخل قيمة Y (متوازي أضلاع) ← احسب A = X * Y (مستطيل) ← اطبع الناتج A (متوازي أضلاع) ← توقف (بيضاوي).'},
      {t:'open',q:'نشاط (ارسم مخطط): ارسم مخطط سير العمليات لجمع رقمين، وطباعة الناتج.',a:'ابدأ ← أدخل X , Y ← احسب Z = X + Y ← اطبع Z ← توقف.'},
      {t:'open',q:'مثال 2: ارسم مخطط سير العمليات لإدخال قيم وحساب وطباعة مجموع القيم ومتوسطها حسب المعادلتين: Sum = X + Y + Z و Avg = Sum / 3.',a:'ابدأ ← أدخل X , Y , Z ← احسب sum = X + Y + Z ← احسب Avg = sum / 3 ← اطبع sum ← اطبع Avg ← توقف.'},
      {t:'open',q:'نشاط: تتبع مخطط سير العمليات (نصف القطر، مساحة الدائرة س = ط نق²، محيط الدائرة ح = 2 ط نق، طباعة س ، ح) ثم أجب: 1- المدخلات هي. 2- المعالجة هي. 3- المخرجات هي. 4- ما عمل المخطط؟',a:'1- المدخلات: نصف القطر (نق). 2- المعالجة: حساب مساحة الدائرة س = ط نق²، وحساب محيط الدائرة ح = 2 ط نق. 3- المخرجات: مساحة الدائرة (س) ومحيطها (ح). 4- عمل المخطط: حساب مساحة الدائرة ومحيطها وطباعتهما بمعلومية نصف القطر. (صياغة Claude من المخطط، راجعها على دليل المعلم)'},
      {t:'open',q:'تمرين 1 (السؤال الأول): ارسم مخطط سير العمليات لحساب وطباعة قيمة الآتي: 1- A = X + 3Y. 2- B = (X + Y) / 2. 3- F = A + B - A / 2.',a:'1- ابدأ ← أدخل X , Y ← احسب A = X + 3*Y ← اطبع A ← توقف. 2- ابدأ ← أدخل X , Y ← احسب B = (X + Y) / 2 ← اطبع B ← توقف. 3- ابدأ ← أدخل A , B ← احسب F = A + B - A / 2 ← اطبع F ← توقف. (المدخلات في البند 3 هي A و B لأنهما يظهران في المعادلة؛ صياغة Claude، وللرسم أكثر من شكل صحيح)'},
      {t:'open',q:'تمرين 2 (السؤال الثاني): تتبع مخطط سير العمليات (أدخل X , Y ← احسب F = X + 2 ← X = Y ← Y = X + 3 ← اطبع F , X , Y) واحسب الناتج النهائي إذا علمت أن X = 2 و Y = 3.',a:'F = X + 2 = 2 + 2 = 4. ثم X = Y أي X = 3. ثم Y = X + 3 = 3 + 3 = 6. الناتج: 1- F = 4. 2- X = 3. 3- Y = 6.'},
      {t:'open',q:'تمرين 3 (السؤال الثالث): عرّف ما يأتي: 1- المشكلة (المسألة). 2- الخوارزمية. 3- مخطط سير العمليات.',a:'1- المسألة: هي الهدف أو الناتج المطلوب الوصول إليه، حيث يقوم المبرمج بمجموعة من الخطوات بناءً على معطيات المسألة للوصول إلى المطلوب. 2- الخوارزمية: مجموعة من الخطوات الواضحة والمتسلسلة منطقيًا والمكتوبة بلغة الإنسان بشكل مفصل للوصول إلى حل مسألة معينة. 3- مخطط سير العمليات: مجموعة من الأشكال الهندسية التي توضح التسلسل المنطقي لخطوات الخوارزمية في حل المسألة.'},
      {t:'open',q:'تمرين 4 (السؤال الرابع): علل ما يأتي: 1- تعد خطوة التوثيق من الخطوات المهمة جدًّا في حل المسألة. 2- عند اختبار صحة البرنامج، يجب تنفيذه أكثر من مرة بإعطائه مدخلات مختلفة في كل مرة.',a:'1- لأن التوثيق وصف كتابي لكاتب البرنامج وأهدافه وأجزائه وإجراءات تشغيله، مدعومًا بالوثائق والمستندات والرسوم الإيضاحية، وذلك للرجوع إلى البرنامج وقت الحاجة لتصحيحه أو تعديله وتطويره. 2- للتأكد من عمل البرنامج بالشكل الصحيح والحصول على النتائج المطلوبة.'},
      {t:'open',q:'تمرين 5 (السؤال الخامس): وضح أهمية الخوارزمية في حل المشكلات.',a:'توفر الكثير من الوقت في حل المسألة لأنها ترسم طريق الحل بشكل محدد وواضح، وتصبح عملية ترجمتها إلى برنامج أسهل بكثير من الشروع في كتابة البرنامج مباشرة. (من نص الدرس الثاني؛ راجعها على دليل المعلم)'}
    ]

    id:'g9-computer-5', title:'الدرس الخامس: مخططات التفرع',
    explain:`
<div class="card"><h3>١. مخطط سير العمليات ذو التفرع</h3>
<p>يتضمن هذا النوع <b>اتخاذ القرارات</b> أو <b>مفاضلة بين خيارين أو أكثر</b>، والشكل العام لجملة التفرع:</p>
<div class="flow"><span class="sh sh-dec">جملة الشرط</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><span class="sh sh-proc">نفذ A</span></td><td><span class="sh sh-proc">نفذ B</span></td></tr></tbody></table></div></div>
<div class="note">معنى هذا التفرع: في حالة <b>تحقق</b> جملة الشرط أي كانت الإجابة (<b>نعم</b>) يتم تنفيذ الخطوة <b>(A)</b>، وفي حالة <b>عدم تحقق</b> جملة الشرط أي كانت الإجابة (<b>لا</b>) يتم تنفيذ الخطوة <b>(B)</b>.</div></div>

<div class="card"><h3>مثال ١: القيمة العظمى</h3>
<p>ارسم مخطط سير العمليات لاختيار القيمة العظمى لقيمتين معلومتين.</p><div class="hadith"><b>الحل:</b><p><b>الخوارزمية:</b></p><ul style="list-style:none;padding:0 4px"><li><b>1 –</b> ابدأ.</li><li><b>2 –</b> اقرأ قيمة كل من <span dir="ltr">A , B</span>.</li><li><b>3 –</b> هل <span dir="ltr">A &gt; B</span>؟ إذا كان (نعم) أطبع A، وإذا كان (لا) أطبع B.</li><li><b>4 –</b> توقف.</li></ul><div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div><span class="sh sh-io"><i>اقرأ <span dir="ltr">A , B</span></i></span><div class="fa">⬇</div><span class="sh sh-dec">هل <span dir="ltr">A &gt; B</span>؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><span class="sh sh-io"><i>أطبع A</i></span></td><td><span class="sh sh-io"><i>أطبع B</i></span></td></tr></tbody></table></div><div class="fa">⬇</div><span class="sh sh-con">&nbsp;</span><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>مثال ٢: النجاح والرسوب</h3>
<p>اكتب خوارزمية لإدخال معدل وطباعة كلمة <b>Pass</b> إذا كان المعدل أكبر أو يساوي 50، وطباعة كلمة <b>Fail</b> إذا كان المعدل أقل من 50. ثم ارسم مخطط سير العمليات.</p><div class="hadith"><b>الحل:</b><p><b>الخوارزمية:</b></p><ul style="list-style:none;padding:0 4px"><li><b>1 –</b> ابدأ.</li><li><b>2 –</b> أدخل قيمة المعدل Avg.</li><li><b>3 –</b> هل <span dir="ltr">Avg &ge; 50</span>؟ إذا كان (نعم) أطبع Pass، وإذا كان (لا) أطبع Fail.</li><li><b>4 –</b> توقف.</li></ul><div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div><span class="sh sh-io"><i>أدخل Avg</i></span><div class="fa">⬇</div><span class="sh sh-dec">هل <span dir="ltr">Avg &ge; 50</span>؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><span class="sh sh-io"><i>طباعة Pass</i></span></td><td><span class="sh sh-io"><i>طباعة Fail</i></span></td></tr></tbody></table></div><div class="fa">⬇</div><span class="sh sh-con">&nbsp;</span><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>مثال ٣: العدد الأصغر</h3>
<p>اكتب خوارزمية لإدخال عددين وطباعة العدد الأصغر منهما. ثم ارسم مخطط سير العمليات للخوارزمية.</p><div class="hadith"><b>الحل:</b><p><b>الخوارزمية:</b></p><ul style="list-style:none;padding:0 4px"><li><b>1 –</b> ابدأ.</li><li><b>2 –</b> أدخل العددين <span dir="ltr">X , Y</span>.</li><li><b>3 –</b> هل <span dir="ltr">X &lt; Y</span>؟ إذا كان (نعم) اطبع X، وإذا كان (لا) اطبع Y.</li><li><b>4 –</b> توقف.</li></ul><div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div><span class="sh sh-io"><i>أدخل <span dir="ltr">X , Y</span></i></span><div class="fa">⬇</div><span class="sh sh-dec">هل <span dir="ltr">X &lt; Y</span>؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><span class="sh sh-io"><i>طباعة X</i></span></td><td><span class="sh sh-io"><i>طباعة Y</i></span></td></tr></tbody></table></div><div class="fa">⬇</div><span class="sh sh-con">&nbsp;</span><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>مثال ٤: ضريبة الدخل</h3>
<p>ارسم مخطط سير العمليات لإدخال الراتب الشهري لموظف وحساب الدخل السنوي وحساب ضريبة الدخل التي تقدر بالآتي:</p>
<ul><li>إذا كان دخل الموظف السنوي يزيد عن 15 ألف دينار فإن ضريبة الدخل تساوي 5% من الدخل السنوي.</li><li>إذا كان دخل الموظف السنوي أقل من أو يساوي 15 ألف دينار فإن ضريبة الدخل = 0.</li></ul><div class="hadith"><b>الحل:</b><div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div><span class="sh sh-io"><i>أدخل الراتب الشهري S</i></span><div class="fa">⬇</div><span class="sh sh-proc">الدخل السنوي <span dir="ltr">T = S * 12</span></span><div class="fa">⬇</div><span class="sh sh-dec">هل <span dir="ltr">T &gt; 15000</span>؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><span class="sh sh-proc">الضريبة <span dir="ltr">Tax = 5/100 * T</span></span></td><td><span class="sh sh-proc">الضريبة <span dir="ltr">Tax = 0</span></span></td></tr></tbody></table></div><div class="fa">⬇</div><span class="sh sh-con">&nbsp;</span><div class="fa">⬇</div><span class="sh sh-io"><i>أطبع Tax</i></span><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>مثال ٥: تفرع متداخل</h3>
<p>ارسم مخطط سير العمليات لحساب قيمة الاقتران F في الحالات الآتية:</p>
<ul><li>إذا كانت قيمة X موجبة: <span dir="ltr">F = X + 10</span></li><li>إذا كانت قيمة X = صفر: <span dir="ltr">F = X + 5</span></li><li>إذا كانت قيمة X سالبة: <span dir="ltr">F = X + 2</span></li></ul><div class="hadith"><b>الحل:</b><div class="flow"><span class="sh sh-oval">ابدأ</span><div class="fa">⬇</div><span class="sh sh-io"><i>أدخل قيمة X</i></span><div class="fa">⬇</div><span class="sh sh-dec">هل <span dir="ltr">X &ge; 0</span>؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><div class="flow" style="margin:0"><span class="sh sh-dec">هل <span dir="ltr">X = 0</span>؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><span class="sh sh-proc"><span dir="ltr">F = X + 5</span></span></td><td><span class="sh sh-proc"><span dir="ltr">F = X + 10</span></span></td></tr></tbody></table></div><div class="fa">⬇</div><span class="sh sh-con">&nbsp;</span></div></td><td><span class="sh sh-proc"><span dir="ltr">F = X + 2</span></span></td></tr></tbody></table></div><div class="fa">⬇</div><span class="sh sh-con">&nbsp;</span><div class="fa">⬇</div><span class="sh sh-io"><i>أطبع F</i></span><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>`,
    summary:[
      'يتضمن مخطط سير العمليات <b>ذو التفرع</b> اتخاذ القرارات أو المفاضلة بين خيارين أو أكثر، ويستخدم لذلك شكل <b>المعين</b> لجملة الشرط.',

      {t:'mcq',q:'في مخطط القيمة العظمى، إذا كانت الإجابة عن (هل A > B؟) نعم فإننا:',o:['نطبع A', 'نطبع B', 'نطبع A و B', 'نتوقف دون طباعة'],a:0},

      {t:'mcq',q:'إذا كان المعدل 50 في مخطط (Pass / Fail) فإن المطبوع هو:',o:['Pass', 'Fail', '50', 'لا شيء'],a:0},

    id:'g9-computer-6', title:'الدرس السادس: مخطط الدوران',
    explain:`
<div class="card"><h3>١. مخطط الدوران (Loop Flowchart)</h3>
<p>يُستخدم <b>مخطط الدوران</b> لتنفيذ مجموعة من <b>العمليات المتكررة</b>، والتي تُعتبر من أهم مزايا الحاسوب. ونحتاج في التكرارات المحددة إلى استخدام <b>العداد (Counter)</b> ليحدد <b>عدد مرات التكرار</b>.</p>
<div class="note">ملاحظة: في الكتاب يعود سهم من المعين إلى أعلى المخطط في حالة (لا). في هذا الموقع رُسمت العمليات المتكررة داخل <b>إطار متقطع</b>، وتعني (لا): العودة إلى بداية الإطار، وتعني (نعم): الخروج من الدوران.</div></div>

<div class="card"><h3>مثال ١: الدوران</h3>
<p>ارسم مخطط سير العمليات لطباعة اسمك عشر مرات.</p><div class="hadith"><b>الحل:</b><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc">العداد <span dir="ltr">C = 0</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-io"><i>اطبع اسمك</i></span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">C = C + 1</span></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">C = 10</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>الخروج من الدوران ⬇</td><td>↩ العودة إلى بداية الإطار</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>مثال ٢: الدوران</h3>
<p>ارسم مخطط سير العمليات لطباعة الأعداد من 1 إلى 100.</p><div class="hadith"><b>الحل:</b><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc">العداد <span dir="ltr">C = 1</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-io"><i>اطبع C</i></span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">C = C + 1</span></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">C &gt; 100</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>الخروج من الدوران ⬇</td><td>↩ العودة إلى بداية الإطار</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>

<div class="card"><h3>نشاط (مخطط الدوران): تتبع المخطط</h3>
<p>تتبع مخطط سير العمليات الآتي واكتب عمل البرنامج:</p>
<div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">C = 5</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-proc"><span dir="ltr">Z = C * C</span></span><div class="fa">⬇</div><span class="sh sh-io"><i>اطبع Z</i></span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">C = C + 1</span></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">C = 10</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>الخروج من الدوران ⬇</td><td>↩ العودة إلى بداية الإطار</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div>
<div class="hadith"><b>الإجابة (تتبع المخطط، صياغة Claude):</b>
<table class="idx-table" style="text-align:center"><thead><tr><th>C</th><th>Z = C * C (المطبوع)</th><th>C بعد الزيادة</th><th>هل C = 10؟</th></tr></thead><tbody>
<tr><td>5</td><td>25</td><td>6</td><td>لا</td></tr><tr><td>6</td><td>36</td><td>7</td><td>لا</td></tr><tr><td>7</td><td>49</td><td>8</td><td>لا</td></tr><tr><td>8</td><td>64</td><td>9</td><td>لا</td></tr><tr><td>9</td><td>81</td><td>10</td><td>نعم ← توقف</td></tr></tbody></table>
<p><b>عمل البرنامج:</b> يطبع مربعات الأعداد الصحيحة من 5 إلى 9، أي: 25 ، 36 ، 49 ، 64 ، 81.</p></div></div>

<div class="card"><h3>مثال ٣: الدوران</h3>
<p>ارسم مخطط سير العمليات لإدخال ثلاث درجات لصف مكون من خمسين طالب وأحسب ثم اطبع المعدل لكل طالب.</p><div class="hadith"><b>الحل:</b><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">I = 0</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-io"><i>أدخل <span dir="ltr">A , B , C</span></i></span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">Avg = (A + B + C) / 3</span></span><div class="fa">⬇</div><span class="sh sh-io"><i>اطبع Avg</i></span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">I = I + 1</span></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">I = 50</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>الخروج من الدوران ⬇</td><td>↩ العودة إلى بداية الإطار</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div>`,

    id:'g9-computer-7', title:'الدرس السابع: العداد',
    explain:`
<div class="card"><h3>العداد (Counter)</h3>
<p>نحتاج في البرامج الحاسوبية إلى <b>العداد</b> في كثير من الأحيان، وعملية العد للإنسان طبيعية اكتسبها مع نموه خلال حياته، إلا أن الحاسب يحتاج لتلقينه <b>خطوات معينة يتبعها ليستطيع العد</b>. ويمكن أن نحدد هذه الخطوات بما يلي:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> اجعل العداد مساويًا للصفر.</li><li><b>2 –</b> اجعل القيمة الجديدة للعداد تساوي القيمة القديمة زائد واحد؛ أي: <span dir="ltr">قيمة العداد (الجديدة) = قيمة العداد (القديمة) + 1</span>.</li><li><b>3 –</b> كرر الخطوات ابتداءً من الخطوة (2).</li></ul></div>

<div class="card"><h3>مثال ١: طباعة الأعداد</h3>
<p>اكتب خوارزمية لطباعة الأعداد الطبيعية من 1 إلى 100 ومربعاتها وارسم مخطط سير العمليات المناسب.</p><div class="hadith"><b>الحل:</b><p><b>الخوارزمية:</b></p><ul style="list-style:none;padding:0 4px"><li><b>1 –</b> إبدأ.</li><li><b>2 –</b> اجعل <span dir="ltr">I = 0</span>.</li><li><b>3 –</b> اجعل <span dir="ltr">I = I + 1</span>.</li><li><b>4 –</b> اجعل <span dir="ltr">J = I × I</span>.</li><li><b>5 –</b> اطبع <span dir="ltr">( I , J )</span>.</li><li><b>6 –</b> إذا كان <span dir="ltr">I = 100</span> (نعم) اذهب للخطوة (7)، وإذا (لا) اذهب للخطوة (3).</li><li><b>7 –</b> توقف.</li></ul><p><b>المخطط التدفقي:</b></p><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc">احسب <span dir="ltr">I = 0</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-proc">احسب <span dir="ltr">I = I + 1</span></span><div class="fa">⬇</div><span class="sh sh-proc">احسب <span dir="ltr">J = I × I</span></span><div class="fa">⬇</div><span class="sh sh-io"><i>اطبع <span dir="ltr">( I , J )</span></i></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">I = 100</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>الخروج من الدوران ⬇</td><td>↩ العودة إلى بداية الإطار</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div>
<div class="note"><b>ملاحظة:</b> تعتمد الزيادة في قيمة العداد على المسألة المطروحة، وليس بالضرورة زيادة (1).</div>
<div class="note">كما في الدرس السابق، رُسمت العمليات المتكررة داخل <b>إطار متقطع</b>؛ ويعني السهم الراجع في الكتاب هنا: العودة إلى بداية الإطار.</div></div>

<div class="card"><h3>نشاط (ارسم مخطط): الأعداد الزوجية</h3>
<p>ارسم خريطة سير العمليات التي يتبعها الحاسوب لطباعة الأعداد الزوجية بين 0 و 50.</p><div class="hadith"><b>الحل:</b><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">A = 0</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-io"><i>اطبع A</i></span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">A = A + 2</span></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">A &lt;= 50</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>↩ العودة إلى بداية الإطار</td><td>الخروج من الدوران ⬇</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div><p>(الزيادة هنا 2 لا 1، بحسب الملاحظة السابقة. صياغة Claude، وللمسألة أكثر من حل.)</p></div></div>

<div class="card"><h3>مثال ٢: طباعة الأعداد من 0 إلى 20</h3>
<p>اكتب خوارزمية مع رسم المخطط الانسيابي لطباعة الأعداد من 0 إلى 20؟</p><div class="hadith"><b>الحل:</b><p><b>الخوارزمية:</b></p><ul style="list-style:none;padding:0 4px"><li><b>1 –</b> إبدأ.</li><li><b>2 –</b> اجعل <span dir="ltr">A = 0</span>.</li><li><b>3 –</b> اطبع A.</li><li><b>4 –</b> احسب <span dir="ltr">A = A + 1</span>.</li><li><b>5 –</b> إذا كانت <span dir="ltr">A &lt;= 20</span> ارجع إلى الخطوة 3، وإلا اذهب إلى الخطوة 6.</li><li><b>6 –</b> توقف.</li></ul><p><b>المخطط:</b></p><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc">اجعل <span dir="ltr">A = 0</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-io"><i>اطبع A</i></span><div class="fa">⬇</div><span class="sh sh-proc">احسب <span dir="ltr">A = A + 1</span></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">A &lt;= 20</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>↩ العودة إلى بداية الإطار</td><td>الخروج من الدوران ⬇</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div>
<div class="note">في هذا المثال تعني (<b>نعم</b>) العودة إلى بداية الإطار، وتعني (<b>لا</b>) الخروج من الدوران، بعكس مثال ١.</div></div>`,

      {t:'open',q:'مثال 1: اكتب خوارزمية لطباعة الأعداد الطبيعية من 1 إلى 100 ومربعاتها وارسم مخطط سير العمليات المناسب.',a:'1- إبدأ. 2- اجعل I = 0. 3- اجعل I = I + 1. 4- اجعل J = I × I. 5- اطبع (I , J). 6- إذا كان I = 100 (نعم) اذهب للخطوة 7، وإذا (لا) اذهب للخطوة 3. 7- توقف. والمخطط: إبدأ ← I = 0 ← I = I + 1 ← J = I × I ← اطبع (I , J) ← هل I = 100؟ لا: العودة إلى I = I + 1، نعم: توقف.'},
      {t:'open',q:'نشاط: ارسم خريطة سير العمليات التي يتبعها الحاسوب لطباعة الأعداد الزوجية بين 0 و 50.',a:'إبدأ ← A = 0 ← اطبع A ← A = A + 2 ← هل A <= 50؟ نعم: العودة إلى اطبع A، لا: توقف. (صياغة Claude، وللمسألة أكثر من حل، مثل البدء من 2 أو استخدام شرط A = 50؛ راجعها على دليل المعلم)'},
      {t:'open',q:'مثال 2: اكتب خوارزمية مع رسم المخطط الانسيابي لطباعة الأعداد من 0 إلى 20.',a:'1- إبدأ. 2- اجعل A = 0. 3- اطبع A. 4- احسب A = A + 1. 5- إذا كانت A <= 20 ارجع إلى الخطوة 3، وإلا اذهب إلى الخطوة 6. 6- توقف.'},
      {t:'open',q:'تمرين 1 (السؤال الأول): ضع علامة (✓) للجملة الصائبة أو علامة (✗) للجملة الخطأ: 1- يستخدم العداد للتكرارات غير المنتهية. 2- يمكن للعداد أن يتزايد أو يتناقص. 3- يعرف العداد خارج منطقة الدوران.',a:'1- ✗ (يستخدم للتكرارات المحددة، إذ نحتاج إلى العداد ليحدد عدد مرات التكرار). 2- ✓. 3- ✓ (فقيمته الابتدائية تُعطى قبل الدوران كما في الأمثلة). (بحسب نص الدرس والأمثلة؛ راجعها على دليل المعلم)'},
      {t:'open',q:'تمرين 2 (السؤال الثاني): ارسم مخطط سير العمليات لطباعة: 1- اسمك عشرين مرة. 2- اسم دولتك واسم العاصمة 10 مرات. 3- الأعداد من 1 إلى 50.',a:'1- إبدأ ← C = 0 ← اطبع اسمك ← C = C + 1 ← هل C = 20؟ لا: العودة إلى الطباعة، نعم: توقف. 2- إبدأ ← C = 0 ← اطبع اسم الدولة واسم العاصمة ← C = C + 1 ← هل C = 10؟ لا: العودة، نعم: توقف. 3- إبدأ ← C = 1 ← اطبع C ← C = C + 1 ← هل C > 50؟ لا: العودة، نعم: توقف. (صياغة Claude على نموذج أمثلة الدرس 6، وللرسم أكثر من حل)'},
      {t:'open',q:'تمرين 3 (السؤال الثالث؛ مطبوع في الكتاب «السؤال الثاني» مكررًا): تتبع مخطط سير العمليات (I = 0 ← I = I + 1 ← J = I * I ← اطبع (I , J) ← هل I = 5؟ لا: العودة إلى I = I + 1، نعم: توقف) واكتب عمل المخطط.',a:'يطبع الأعداد من 1 إلى 5 ومربعاتها: (1 , 1) ، (2 , 4) ، (3 , 9) ، (4 , 16) ، (5 , 25)، ثم يتوقف عندما تصبح I = 5. (بالتتبع، صياغة Claude)'}
    ]

    id:'g9-computer-8', title:'الدرس الثامن: المجاميع الإجمالية',
    explain:`
<div class="card"><h3>المجاميع الإجمالية</h3>
<p>نحتاج في برامج الحاسب الآلي في كثير من الأحيان إلى <b>جمع مجموعة كبيرة من الأعداد</b> التي تمثل ظاهرة معينة، فمثلًا عندما نريد أن نحسب معدل درجات تلميذ وكذلك الأمر في هذه الحالة يجب علينا أن نرشد الحاسب للقيام بعملية الجمع. ويمكننا ذلك باستخدام <b>متغيرين</b> اثنين: أحدهما <b>المتغير الذي نجمعه</b> والآخر هو <b>الجمع الإجمالي (المجمع)</b>. ويتم ذلك وفق الخطوات التالية:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> اجعل المجمع مساويًا للصفر <span dir="ltr">(sum = 0)</span>.</li><li><b>2 –</b> أدخل قيمة واحدة للمتغير.</li><li><b>3 –</b> اجعل القيمة الجديدة للمجمع تساوي القيمة القديمة له زائد القيمة المدخلة للمتغير؛ أي أن: قيمة المجمع الجديدة = قيمة المجمع القديمة + آخر قيمة مدخلة للمتغير.</li><li><b>4 –</b> كرر ابتداءً من الخطوة الثانية.</li></ul></div>

<div class="card"><h3>مثال ١: خوارزمية لإيجاد مجموع الأرقام</h3>
<p>اكتب خوارزمية لإيجاد مجموع الأرقام من 1 إلى 20 وارسم مخطط سير العمليات المناسب للمسألة المطروحة.</p><div class="hadith"><b>الحل:</b><p><b>الخوارزمية:</b></p><ul style="list-style:none;padding:0 4px"><li><b>1 –</b> إبدأ.</li><li><b>2 –</b> اجعل <span dir="ltr">sum = 0</span> و <span dir="ltr">I = 1</span>.</li><li><b>3 –</b> اجعل <span dir="ltr">sum = sum + I</span>.</li><li><b>4 –</b> اجعل <span dir="ltr">I = I + 1</span>.</li><li><b>5 –</b> هل <span dir="ltr">I &lt;= 20</span>؟ إذا كان (نعم) أذهب إلى الخطوة 3.</li><li><b>6 –</b> اطبع sum.</li><li><b>7 –</b> توقف.</li></ul><p><b>مخطط سير العمليات:</b></p><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc">اجعل <span dir="ltr">sum = 0</span></span><div class="fa">⬇</div><span class="sh sh-proc">اجعل <span dir="ltr">I = 1</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-con">&nbsp;</span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">I &lt;= 20</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td><span class="sh sh-proc"><span dir="ltr">sum = sum + I</span></span><div class="fa">⬇</div><span class="sh sh-proc"><span dir="ltr">I = I + 1</span></span><div class="fa">⬇</div>↩ العودة إلى حلقة الربط (بداية الإطار)</td><td>الخروج من الدوران ⬇</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-io"><i>اطبع sum</i></span><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div>
<div class="note">في مخطط الكتاب (ص47) يعود السهم إلى دائرة الربط التي تسبق المعين؛ لذلك رُسم المعين في أول الإطار المتقطع، وتعني (نعم): تنفيذ الخطوتين ثم العودة إلى دائرة الربط، وتعني (لا): الخروج وطباعة المجموع.</div></div>

<div class="card"><h3>مثال ٢: مجموع الدرجات</h3>
<p>اكتب خوارزمية لإدخال 10 درجات لمواد طالب وطباعة مجموعها.</p><div class="hadith"><b>الحل:</b><p><b>الخوارزمية:</b></p><ul style="list-style:none;padding:0 4px"><li><b>1 –</b> إبدأ.</li><li><b>2 –</b> اجعل <span dir="ltr">sum = 0</span> و <span dir="ltr">N = 0</span>.</li><li><b>3 –</b> ادخل الدرجة G.</li><li><b>4 –</b> احسب <span dir="ltr">N = N + 1</span>.</li><li><b>5 –</b> احسب <span dir="ltr">sum = sum + G</span>.</li><li><b>6 –</b> هل <span dir="ltr">N &lt; 10</span>؟ إذا كان نعم اذهب إلى الخطوة (3)، وإذا كان لا اذهب إلى الخطوة (7).</li><li><b>7 –</b> اطبع المجموع sum.</li><li><b>8 –</b> توقف.</li></ul><p><b>مخطط التكرار:</b></p><div class="flow"><span class="sh sh-oval">إبدأ</span><div class="fa">⬇</div><span class="sh sh-proc">اجعل <span dir="ltr">sum = 0 , N = 0</span></span><div class="fa">⬇</div><div class="flow" style="border:2px dashed #2a7fc0;border-radius:14px;padding:10px;width:100%;box-sizing:border-box"><div style="font-weight:700;color:#2a7fc0">⟲ إطار الدوران (التكرار)</div><span class="sh sh-io"><i>ادخل الدرجة G</i></span><div class="fa">⬇</div><span class="sh sh-proc">احسب <span dir="ltr">N = N + 1</span></span><div class="fa">⬇</div><span class="sh sh-proc">احسب <span dir="ltr">sum = sum + G</span></span><div class="fa">⬇</div><span class="sh sh-dec"><span dir="ltr">N &lt; 10</span> ؟</span><div class="fa">⬇</div><div style="overflow-x:auto;width:100%"><table class="idx-table" style="text-align:center"><thead><tr><th>نعم</th><th>لا</th></tr></thead><tbody><tr><td>↩ العودة إلى بداية الإطار</td><td>الخروج من الدوران ⬇</td></tr></tbody></table></div></div><div class="fa">⬇</div><span class="sh sh-io"><i>اطبع sum</i></span><div class="fa">⬇</div><span class="sh sh-oval">توقف</span></div></div></div><div class="card"><h3>التقويم</h3><p><b>استراتيجية التقويم:</b> التقويم المعتمد على الأداء.<br><b>أداة التقويم:</b> سلم التقدير.</p><div style="overflow-x:auto"><table class="idx-table"><thead><tr><th>الرقم</th><th>المعيار</th><th>ممتاز</th><th>جيد جدًا</th><th>جيد</th></tr></thead><tbody><tr><td>1</td><td>يتعرف على خطوات حل المشكلة.</td><td></td><td></td><td></td></tr><tr><td>2</td><td>يستخدم خطوات حل المشكلة في حل المسائل.</td><td></td><td></td><td></td></tr><tr><td>3</td><td>يدرك مفهوم الخوارزمية.</td><td></td><td></td><td></td></tr><tr><td>4</td><td>يبين خصائص الخوارزميات.</td><td></td><td></td><td></td></tr><tr><td>5</td><td>يستخدم الخوارزمية لحل مشكلة محددة.</td><td></td><td></td><td></td></tr><tr><td>6</td><td>يوضح مفهوم مخطط سير العمليات.</td><td></td><td></td><td></td></tr><tr><td>7</td><td>يميز بين رموز مخطط سير العمليات.</td><td></td><td></td><td></td></tr><tr><td>8</td><td>يصمم مخطط سير العمليات البسيط.</td><td></td><td></td><td></td></tr><tr><td>9</td><td>يرسم مخطط التفرع لسير العمليات.</td><td></td><td></td><td></td></tr><tr><td>10</td><td>يتعرف على مخطط الدوران.</td><td></td><td></td><td></td></tr><tr><td>11</td><td>يتتبع مخطط الدوران.</td><td></td><td></td><td></td></tr><tr><td>12</td><td>يرسم مخطط سير العمليات الحساب المجاميع.</td><td></td><td></td><td></td></tr></tbody></table></div></div>`,

    explain:`
<div class="card"><h3>١. تعريف البرمجة</h3>
<p>يمكن تعريف البرمجة على أنها <b>وسيلة للتواصل بين الإنسان (المبرمج) والآلة</b> (والتي تتمثل في أي جهاز قابل للبرمجة). فقد اعتاد الإنسان على استخدام اللغات المختلفة مثل اللغة العربية أو الإنجليزية للتواصل فيما بينهم، فتم ابتكار مجموعة من اللغات الأخرى (<b>لغات البرمجة</b>) للتواصل بين الإنسان والآلة.</p>
<p>وكما هو الحال بين البشر الذين يتحدثون بلغات مختلفة، حيث يتم استخدام <b>مترجم</b> ليتمكن البشر من فهم اللغات المختلفة، يتم ذلك أيضًا بين البشر والآلة، حيث تتم ترجمة لغة البرمجة (التي يفهمها الإنسان) إلى <b>لغة الآلة</b>، والتي تتمثل في الصفر والواحد أو كما تعرف بـ<b>النظام الثنائي</b>، وهي اللغة التي تفهمها الآلة. ويتم ذلك عن طريق استخدام برامج مخصصة لذلك مثل <b>المترجم (Compiler)</b> أو <b>المفسر (Interpreter)</b>.</p>
<div class="hadith"><b>تعريف البرمجة:</b> هي عبارة عن كتابة شفرة <span dir="ltr">(Code)</span>، أي مجموعة من الأوامر، والتي يتم ترجمتها وتنفيذها من قبل جهاز الحاسوب. ويتكون البرنامج الحاسوبي من مجموعة من الأوامر، والتي تقوم بدورها بتحديد سلوك البرنامج وآلية عمله.</div></div>

<div class="card"><h3>٢. لغات البرمجة</h3>
<p>تُستخدم في عملية البرمجة ما يعرف بـ<b>لغات البرمجة</b> <span dir="ltr">(Programming languages)</span>، وهي عبارة عن لغة خاصة تُستخدم من قبل المبرمجين من أجل تطوير البرمجيات، أو النصوص <span dir="ltr">(Scripts)</span>، أو غير ذلك مما يمكن تنفيذه على جهاز الحاسوب. ومن الأمثلة على لغات البرمجة:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> لغة سي <span dir="ltr">(C)</span></li><li><b>2 –</b> لغة جافا <span dir="ltr">(Java)</span></li><li><b>3 –</b> لغة بايثون <span dir="ltr">(Python)</span></li></ul></div>

<div class="card"><h3>٣. تصنيف لغات البرمجة حسب المستوى</h3>
<ul style="list-style:none;padding:0 4px"><li><b>1 – لغات البرمجة عالية المستوى (High level):</b> تعد أكثر سهولة من اللغات الأقل مستوى، لذا يُنصح بالبدء بها عند تعلّم البرمجة.</li><li><b>2 – لغات البرمجة منخفضة المستوى:</b> عادةً ما توفر إمكانية أكبر للتحكم بجهاز الحاسوب، كالقدرة على إدارة الذاكرة والبيانات، وتعد <b>لغة الآلة</b> بالإضافة إلى <b>لغة التجميع</b> اللغتين الأكثر انخفاضًا في المستوى من بين لغات البرمجة الأخرى.</li></ul>
<p><b>الترجمة من البرنامج المصدري إلى البرنامج الهدف:</b></p>
<div class="flow"><div class="fl">البرنامج المصدري<br><small>المكتوب بإحدى لغات البرمجة عالية المستوى</small></div><div class="fa">⬇</div><div class="fl"><b>المترجم</b></div><div class="fa">⬇</div><div class="fl">البرنامج الهدف<br><small>الذي يفهمه الحاسوب والمعبَّر عنه بلغة الآلة</small></div></div></div>

<div class="card"><h3>٤. اللغات عالية المستوى</h3>
<p>ومن الأمثلة على اللغات عالية المستوى:</p>
<ul><li>لغة بيسك المرئي <span dir="ltr">Visual Basic</span></li><li>لغة سي <span dir="ltr">(C)</span></li><li>لغة <span dir="ltr">Cobol</span></li><li>لغة <span dir="ltr">RPG</span></li><li>لغة <span dir="ltr">Pascal</span></li></ul>
<p>ويُدعى البرنامج المكتوب بإحدى لغات البرمجة عالية المستوى بـ<b>البرنامج المصدري</b>، والبرنامج المحوَّل المترجَم إلى لغة الآلة بـ<b>البرنامج الهدف</b>. وتمتاز اللغات عالية المستوى بالآتي:</p>
<ul><li>سهلة الفهم والتعلم.</li><li>سهلة الاستخدام.</li><li>سهولة اكتشاف وتصحيح الأخطاء.</li></ul></div>

    id:'g9-computer-10', title:'الدرس العاشر: التعابير الحسابية',
    explain:`
<div class="card"><h3>١. التعبير الحسابي</h3>
<p><b>التعبير الحسابي</b> هو <b>معادلة لحساب قيمة معينة</b> تتكون من ثابت أو متغير أو مزيج بينهما يفصل بينهما عملية حسابية. ويمكن للتعبير الحسابي أن يكون <b>مركبًا</b> أو <b>معقدًا</b> بإحتوائه على أكثر من عملية. والجمل الآتية تمثل تعابير حسابية:</p>
<ul><li><span dir="ltr">A + B</span></li><li><span dir="ltr">B × A (5A + 2)</span></li></ul></div>

<div class="card"><h3>٢. العمليات الحسابية في الحاسوب</h3>
<p>عند تحويل التعبير الحسابي إلى الحاسوب تتغير بعض علامات العمليات الحسابية، ويبين الجدول الآتي بعض العمليات الحسابية الأساسية المستخدمة في الحاسوب:</p>
<div style="overflow-x:auto"><table class="idx-table" style="text-align:center"><thead><tr><th>العملية الحسابية</th><th>استخدامها في الجبر (الحساب)</th><th>استخدامها في الحاسوب</th></tr></thead><tbody>
<tr><td>الجمع</td><td><span dir="ltr">+</span></td><td><span dir="ltr">+</span></td></tr>
<tr><td>الطرح</td><td><span dir="ltr">-</span></td><td><span dir="ltr">-</span></td></tr>
<tr><td>الضرب</td><td><span dir="ltr">×</span></td><td><span dir="ltr">*</span></td></tr>
<tr><td>القسمة</td><td><span dir="ltr">÷</span></td><td><span dir="ltr">/</span></td></tr>
<tr><td>الأسس</td><td><span dir="ltr">X²</span> (X أس 2)</td><td><span dir="ltr">X^2</span></td></tr>
</tbody></table></div></div>

<div class="card"><h3>٣. أولويات العمليات الحسابية</h3>
<p>ولحساب ناتج التعابير الحسابية يجب مراعاة <b>تسلسل أولويات العمليات الحسابية</b>؛ فعند حساب <span dir="ltr">1 + 2 × 3</span> تكون الأولوية لعملية الضرب ثم الجمع ويكون الناتج <b>7</b>. أما إذا لم تلتزم بالأولويات فإن الناتج سوف يكون خاطئًا. وعليه فإن الحاسوب كما في التعابير الحسابية يستخدم قواعد تسلسل أولويات تنفيذ العمليات الحسابية الآتية:</p>
<div class="hadith"><b>أولويات العمليات الحسابية:</b>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> تنفيذ ما بداخل الأقواس أولًا، القوس الداخلي ثم الخارجي.</li><li><b>2 –</b> تنفيذ الأسس.</li><li><b>3 –</b> تنفيذ الضرب والقسمة.</li><li><b>4 –</b> تنفيذ الجمع والطرح.</li><li><b>5 –</b> في حال تساوي الأولويات نبدأ بالتنفيذ من اليسار إلى اليمين للمسألة باللغة الإنجليزية، ومن اليمين إلى اليسار للمسألة باللغة العربية.</li></ul></div></div>

<div class="card"><h3>٤. كتابة التعابير الحسابية بلغة الحاسوب</h3>
<p>والأمثلة الآتية توضح عملية كتابة التعابير الحسابية باستخدام لغة الحاسوب.</p>
<p><b>مثال ١:</b> اكتب التعابير الحسابية الآتية بلغة الحاسوب:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> <span dir="ltr">A + B² + 2B + AC</span></li><li><b>2 –</b> <span dir="ltr">AB + Y ÷ X</span></li><li><b>3 –</b> <span dir="ltr">AB + 2 + X + Y(A + Y) - 2X</span></li></ul>
<div class="hadith"><b>الحل:</b>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> <span dir="ltr">A+B^2+2*B+A*C</span></li><li><b>2 –</b> <span dir="ltr">A*B+Y/X</span></li><li><b>3 –</b> <span dir="ltr">A*B+2+X+Y*(A+Y)-2*X</span></li></ul></div>
<p><b>نشاط (التعابير الحسابية):</b> اكتب التعابير الحسابية الآتية بلغة الحاسوب:</p>
<ul><li><span dir="ltr">AB + (A - B) + B³ + 2B</span></li><li><span dir="ltr">A ÷ 2 + 2X + Y(A + Y)</span></li></ul></div>

<div class="card"><h3>٥. نواتج العمليات الحسابية</h3>
<p>ينبغي التقيد بقواعد تسلسل أولويات العمليات الحسابية لإيجاد ناتج التعابير الحسابية للوصول إلى الحلول الصحيحة.</p>
<p><b>مثال ٢:</b> أوجد ناتج التعبير الحسابي الآتي: <span dir="ltr">A+B^2+2*B+(A*C)</span>، إذا علمت أن <span dir="ltr">A=2 , B=3 , C=4</span>، والعمليات حسب الأولوية من 1 إلى 6.</p>
<div class="hadith"><b>ترتيب العمليات:</b> (1) القوس <span dir="ltr">(A*C)</span> ← (2) الأس <span dir="ltr">B^2</span> ← (3) الضرب <span dir="ltr">2*B</span> ← (4) الجمع <span dir="ltr">A+B^2</span> ← (5) جمع ناتج الضرب <span dir="ltr">2*B</span> ← (6) جمع القوس.
<p><b>الحل:</b></p>
<div dir="ltr" style="text-align:left;line-height:2"><u>2+3^2+2*3+(2*4)</u><br>2+3^2+2*3+8 &nbsp;(أ)<br>2+9+2*3+8 &nbsp;(ب)<br>2+9+6+8 &nbsp;(ج)<br>11+6+8<br>17+8<br><b>25</b></div></div>
<div class="note">اختصارًا: الأس 3^2 = 9، والقوس (2*4) = 8، والضرب 2*3 = 6؛ ثم 2+9 = 11، ثم 11+6 = 17، ثم 17+8 = 25.</div>
<p><b>مثال ٣:</b> أوجد ناتج التعبير الحسابي الآتي: <span dir="ltr">(A*B)^2 + X + Y*(A + Y) - 2*X</span>، إذا علمت أن <span dir="ltr">A=2 , B=8 , X=4 , Y=3</span>، والعمليات حسب الأولوية من 1 إلى 8.</p>
<div class="hadith"><b>الحل:</b>
<div dir="ltr" style="text-align:left;line-height:2">= (2*8)^2 + 4 + 3*(2 + 3) - 2*4 &nbsp;<b>[1]</b><br>= (16)^2 + 4 + 3*(2 + 3) - 2*4 &nbsp;<b>[2]</b><br>= (16)^2 + 4 + 3*5 - 2*4 &nbsp;<b>[3]</b><br>= 256 + 4 + 3*5 - 2*4 &nbsp;<b>[4]</b><br>= 256 + 4 + 15 - 2*4 &nbsp;<b>[5]</b><br>= 256 + 4 + 15 - 8 &nbsp;<b>[6]</b><br>= 260 + 15 - 8 &nbsp;<b>[7]</b><br>= 275 - 8 &nbsp;<b>[8]</b><br><b>= 267</b></div></div>
<div class="note">الأرقام بين [ ] تدل على رقم العملية في الأولوية: (1) <span dir="ltr">2*8=16</span>، (2) <span dir="ltr">2+3=5</span>، (3) <span dir="ltr">16^2=256</span>، (4) <span dir="ltr">3*5=15</span>، (5) <span dir="ltr">2*4=8</span>، (6) <span dir="ltr">256+4=260</span>، (7) <span dir="ltr">260+15=275</span>، (8) <span dir="ltr">275-8=267</span>.</div>
<p><b>نشاط (ناتج التعابير الحسابية):</b> اكتب ناتج التعابير الحسابية الآتية مع بيان أولوية تسلسل التنفيذ: <span dir="ltr">1*3 + 4^2 - 1 + 1</span> ، و <span dir="ltr">5 + 3*(2 + 1) - 2*3</span>.</p></div>`,

<div class="card"><h3>١. التعبير المنطقي <span dir="ltr">(Logical Expression)</span></h3>
<p><b>التعبير المنطقي</b> هو <b>جملة خبرية</b> قيمتها النهائية إما <b>صواب <span dir="ltr">(True)</span></b> أو <b>خطأ <span dir="ltr">(False)</span></b>. والتعبير المنطقي يستخدم مجموعة من <b>عمليات المقارنة</b> التي يمكن وصفها كما في الجدول الآتي:</p>
<div style="overflow-x:auto"><table class="idx-table" style="text-align:center"><thead><tr><th>العملية</th><th>مثال</th><th>الوصف</th></tr></thead><tbody>
<tr><td><span dir="ltr">=</span></td><td><span dir="ltr">X = Y</span></td><td>X تساوي Y</td></tr>
<tr><td><span dir="ltr">&gt;</span></td><td><span dir="ltr">X &gt; Y</span></td><td>X أكبر من Y</td></tr>
<tr><td><span dir="ltr">&lt;</span></td><td><span dir="ltr">X &lt; Y</span></td><td>X أصغر من Y</td></tr>
<tr><td><span dir="ltr">&gt;=</span></td><td><span dir="ltr">X &gt;= Y</span></td><td>X أكبر من أو تساوي Y</td></tr>
<tr><td><span dir="ltr">&lt;=</span></td><td><span dir="ltr">X &lt;= Y</span></td><td>X أصغر من أو تساوي Y</td></tr>
<tr><td><span dir="ltr">&lt;&gt;</span></td><td><span dir="ltr">X &lt;&gt; Y</span></td><td>X لا تساوي Y</td></tr>
</tbody></table></div></div>

<div class="card"><h3>٢. إيجاد ناتج التعبير المنطقي</h3>
<p><b>مثال ١:</b> ما ناتج التعابير المنطقية الآتية: إذا علمت أن <span dir="ltr">X=2 , Y=3 , Z=5</span>.</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> <span dir="ltr">X = Y</span></li><li><b>2 –</b> <span dir="ltr">X &gt; Z - 4</span></li><li><b>3 –</b> <span dir="ltr">X = 2 + 3</span></li><li><b>4 –</b> <span dir="ltr">Y &gt;= Z - 2</span></li><li><b>5 –</b> <span dir="ltr">X &lt;&gt; Z + Y - 3</span></li></ul>
<div class="hadith"><b>الحل:</b>
<div style="overflow-x:auto"><table class="idx-table" style="text-align:center"><thead><tr><th>التعبير</th><th>بعد التعويض</th><th>الجواب</th></tr></thead><tbody>
<tr><td><span dir="ltr">X = Y</span></td><td><span dir="ltr">2 = 3</span></td><td>خطأ <span dir="ltr">(False)</span></td></tr>
<tr><td><span dir="ltr">X &gt; Z - 4</span></td><td><span dir="ltr">2 &gt; 5 - 4</span> ← <span dir="ltr">2 &gt; 1</span></td><td>صواب <span dir="ltr">(True)</span></td></tr>
<tr><td><span dir="ltr">X = 2 + 3</span></td><td><span dir="ltr">2 = 5</span></td><td>خطأ <span dir="ltr">(False)</span></td></tr>
<tr><td><span dir="ltr">Y &gt;= Z - 2</span></td><td><span dir="ltr">3 &gt;= 5 - 2</span> ← <span dir="ltr">3 &gt;= 3</span></td><td>صواب <span dir="ltr">(True)</span></td></tr>
<tr><td><span dir="ltr">X &lt;&gt; Z + Y - 3</span></td><td><span dir="ltr">2 &lt;&gt; 5 + 3 - 3</span> ← <span dir="ltr">2 &lt;&gt; 5</span></td><td>صواب <span dir="ltr">(True)</span></td></tr>
</tbody></table></div></div>
<p><b>نشاط (ناتج التعابير المنطقية):</b> أوجد ناتج التعابير المنطقية في الجدول الآتي إذا علمت أن <span dir="ltr">A = 3 , B = 4 , C = 1</span>، (لاحظ أن التعابير من اليسار إلى اليمين): <span dir="ltr">A=4+1</span> ، <span dir="ltr">A&lt;=B-C</span> ، <span dir="ltr">C&lt;&gt;B-A</span> ، <span dir="ltr">B&gt;C+B/2*2</span> ، <span dir="ltr">A=B-C+1</span> ، <span dir="ltr">5&gt;=5</span>.</p></div>

<div class="card"><h3>٣. كتابة التعابير المنطقية</h3>
<p><b>مثال ٢:</b> اكتب التعابير المنطقية للآتي:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> العدد (X) أكبر من حاصل جمع العددين (A) و (B).</li><li><b>2 –</b> المتوسط الحسابي (AVG) أكبر من أو يساوي 50.</li><li><b>3 –</b> ارتفاع المستطيل (H) أقل من طول المستطيل (L).</li></ul>
<div class="hadith"><b>الحل:</b>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> <span dir="ltr">X &gt; A + B</span></li><li><b>2 –</b> <span dir="ltr">AVG &gt;= 50</span></li><li><b>3 –</b> <span dir="ltr">H &lt; L</span></li></ul></div>

      {t:'open',q:'تمرين 3 (السؤال الثالث): اكتب مثالًا على كل مما يلي: تعبير حسابي، تعبير منطقي، لغات برمجة عالية المستوى، لغات برمجة ذات مستوى منخفض، معامل منطقي.',a:'تعبير حسابي: A + B * 2. تعبير منطقي: X > Y. لغات عالية المستوى: Visual Basic، C، Pascal، Cobol، RPG (وأيضًا Java وPython من الدرس 9). لغات منخفضة المستوى: لغة الآلة ولغة التجميع. معامل منطقي: AND أو OR أو NOT. (الأمثلة من نصوص الدروس 9 و10 و11 و12 ويصح غيرها)'},
      {t:'open',q:'تمرين 4 (السؤال الرابع): قارن بين لغات البرمجة عالية المستوى ولغات البرمجة ذات المستوى المنخفض من حيث: سهولة التعلم، سهولة فهم البرنامج واكتشاف الأخطاء، قربها من طريقة عمل الحاسوب.',a:'سهولة التعلم: العالية سهلة الفهم والتعلم، والمنخفضة أصعب. سهولة فهم البرنامج واكتشاف الأخطاء: في العالية أسهل، وفي المنخفضة أصعب. قربها من طريقة عمل الحاسوب: المنخفضة أقرب (توفر تحكمًا أكبر بالحاسوب كإدارة الذاكرة والبيانات)، والعالية أبعد. (من نص الدرس 9؛ بند «القرب» مستنتج، راجعه على دليل المعلم)'},
      {t:'open',q:'تمرين 5 (السؤال الخامس): ما ناتج التعابير الحسابية الآتية إذا علمت أن A=2 , B=3: (1) A^2 + A*(B-1) (2) A - 2 + A(4/2*2) (3) A*B - 1 + 1',a:'(1) 2^2 + 2*(3-1) = 4 + 2*2 = 4 + 4 = 8. (2) 2 - 2 + 2*(4/2*2) = 0 + 2*(2*2) = 0 + 2*4 = 8. (3) 2*3 - 1 + 1 = 6 - 1 + 1 = 6. (من حسابي بتطبيق الأولويات؛ راجعه على دليل المعلم)'},

      {t:'open',q:'تمرين 6 (السؤال السادس) البند 3: ما ناتج A*B > B^2 - 4 AND C (A>=2 OR True) إذا علمت أن A=1 , B=4 , C=False؟',a:'A*B > B^2-4 ← 4 > 12 ← False. وبما أن AND يرجع False إذا كان أي من وسائطه False فالناتج False. (التعبير مطبوع في الكتاب هكذا بلا معامل منطقي بين C والقوس؛ الناتج False في كل الأحوال، راجعه على دليل المعلم)'},
