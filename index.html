<div class="card"><h3>١. نشأة الذكاء الاصطناعي وأهدافه</h3>
<p>ظهر الذكاء الاصطناعي في <b>الخمسينات</b> نتيجة الثورة التي حدثت في مجال تقنية المعلومات والتحكم الآلي، ويهدف الذكاء الاصطناعي إلى تحقيق <b>هدفين رئيسيين</b> هما:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> الوصول إلى فهم عميق للذكاء الإنساني عن طريق محاكاته.</li><li><b>2 –</b> الاستثمار الأفضل للحاسب والعمل على استغلال إمكاناته كافة، وخصوصًا بعد التطور السريع لقدرات الحاسبات ورخص ثمنها.</li></ul></div>

<div class="card"><h3>٢. أولًا: الذكاء الاصطناعي <span dir="ltr">(Artificial Intelligence - AI)</span></h3>
<div class="hadith">هو فرع من فروع علم الحاسب الآلي <span dir="ltr">(Computer Science)</span> وهو يختص بعلم <b>هندسة صناعة الآلات</b> التي يطلق عليها مجازًا <b>بالآلات الذكية</b>، والذكاء الاصطناعي مبني على أساس <b>وصف ومحاكاة الذكاء البشري</b> (التصرفات البشرية) في الأنظمة والأجهزة التقنية في الآلات الذكية.</div></div>

<div class="card"><h3>٣. ثانيًا: سمات الذكاء الاصطناعي</h3>
<p>يشكل الذكاء الاصطناعي تحديًا وإلهامًا لعلماء هندسة الحاسوب ومحاولاتهم المتكررة على استخدام بعض قدرات العقل البشري. فهل هناك حدود لمدى ذكاء الآلات؟ وهل هناك فرق جوهري بين الذكاء البشري والذكاء الاصطناعي؟ وهل يمكن أن يكون للآلة عقل ووعي؟</p>
<p>وللذكاء الاصطناعي مجموعة من <b>الميزات والقدرات</b> للقيام ببعض الأعمال ومنها:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> التقليل من الخطأ البشري.</li><li><b>2 –</b> المرونة والسرعة في الاستجابة.</li><li><b>3 –</b> العمل على مدار الساعة طوال أيام الأسبوع.</li><li><b>4 –</b> المساعدة في إجراء المهام المحفوفة بالمخاطر.</li><li><b>5 –</b> توفير الوقت والجهد.</li></ul>
<p><b>نشاط (مميزات الذكاء الاصطناعي):</b> ابحث عن ثلاث مميزات للذكاء الاصطناعي لم ترد بالدرس.</p></div>

<div class="card"><h3>٤. ثالثًا: مشاكل الذكاء الاصطناعي</h3>
<p>لا شك أن مجال الذكاء الاصطناعي له فوائد عظيمة تخدم البشرية ويمكن استخدامها لتسهيل الحياة بشكل كبير، إلا أن له سلبياته ومشاكله العديدة التي لا يمكن إغفالها. وتتمثل مشاكل الذكاء الاصطناعي في النقاط التالية:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> يرفع نسبة البطالة.</li><li><b>2 –</b> التكلفة العالية.</li><li><b>3 –</b> فقدان البيانات.</li><li><b>4 –</b> يعود البشر على الكسل.</li><li><b>5 –</b> الاستخدام الخاطئ.</li></ul>
<p>على الرغم من مشاكل الذكاء الاصطناعي إلا أنه يمثل <b>المستقبل</b> شرط أن يُستخدم بشكل صحيح ولخدمة المجتمع فقط، وتتم الموازنة بين عمل الآلات وعمل البشر بهدف الوصول إلى الفائدة القصوى.</p>
<p><b>نشاط (مشاكل الذكاء الاصطناعي):</b> اذكر ثلاث مشاكل للذكاء الاصطناعي لم ترد بالدرس.</p></div>

<div class="card"><h3>٥. رابعًا: لغات البرمجة للذكاء الاصطناعي</h3>
<p>تختلف لغات برمجة الذكاء الاصطناعي عن باقي لغات البرمجة بكونها قادرة على استخدام <b>عبارات منطقية محددة بدلًا من الأوامر والتعليمات</b>. ومن هذه اللغات:</p>
<p><b>1 – لغة برولوغ <span dir="ltr">(Prolog)</span>:</b> تُعتبر من أشهر لغات الذكاء الاصطناعي، حيث صُممت لتُستخدم في عمل برامج معالجة اللغات الطبيعية. وتُعتبر لغة برولوغ لغة برمجة منطقية <span dir="ltr">(logic programming)</span>، والاسم مأخوذ من اللغة الفرنسية <span dir="ltr">Programmation Enlogique</span>.</p>
<p><b>2 – لغة بايثون <span dir="ltr">(Python)</span>:</b> طُوّرت لغة البرمجة بايثون في عام 1991م، وتُعتبر من أقوى لغات البرمجة وأكثرها انتشارًا، نظرًا لسهولة تعلمها، وتُستخدم في عدة مجالات منها الذكاء الاصطناعي؛ إذ إن بايثون من أكثر لغات البرمجة استخدامًا في تطوير حلول الذكاء الاصطناعي، حيث تُستخدم في تطبيقات مثل التعلم الآلي <span dir="ltr">(Machine Learning)</span> والتعلم العميق <span dir="ltr">(Deep Learning)</span>، ولغة المعالجة الطبيعية <span dir="ltr">(NLP)</span>.</p>
<p><b>3 – لغة ليسب <span dir="ltr">(Lisp)</span>:</b> وهو نظام عملي حسابي لبرامج الحاسوب بُني على أساس لا مبدأ في الحساب. حيث تستخدم اللغة <b>القوائم المترابطة</b> التي تُعتبر واحدة من هياكل البيانات الرئيسية للغة <span dir="ltr">Lisp</span>، وتسمح هذه اللغة للمبرمجين بإنشاء تراكيب جديدة أو البرمجة المتخصصة المتضمنة في اللغة.</p>
<p><b>4 – لغة السترِبس <span dir="ltr">(STRIPS)</span>:</b> وهي لغة للتعبير عن <b>التخطيط الآلي للمشاكل</b>، حيث تعبّر عن الحالة الأولية للمهمة الموكلة بها مثل أحوال الهدف، ومجموعة من الإجراءات المتخذة لبدء المهمة؛ فلكل عمل شروط محددة ومجموعة مسبقًا تُحدد قبل إنجاز العمل، وشروط تحدد ما تم إنجازه من العمل.</p>
<p><b>5 – لغات أخرى</b> تُستخدم في تطبيقات الذكاء الاصطناعي مثل لغة <span dir="ltr">C++</span>، ولغة <span dir="ltr">Lush</span>، ولغة <span dir="ltr">MathLab</span>.</p>
<p><b>نشاط (لغات برمجة الذكاء الاصطناعي):</b> اذكر اسم لغة البرمجة التي تتصف بالآتي:</p>
<ul style="list-style:none;padding:0 4px"><li><b>1 –</b> لغة ذات نظام عملي حسابي لبرامج الحاسوب بُني على أساس لا مبدأ في الحساب هي ......</li><li><b>2 –</b> اللغة التي تُستخدم في عمل برامج معالجة اللغات الطبيعية هي ......</li><li><b>3 –</b> لغة للتعبير عن التخطيط الآلي للمشاكل هي ......</li><li><b>4 –</b> لغة تُستخدم لدعم برامج حل المشكلات العامة مثل القوائم، والأفكار المرتبطة ببعضها البعض ......</li></ul></div>`,

    id:'g9-computer-14', title:'الدرس الرابع عشر: مجالات الذكاء الاصطناعي',
    explain:`
<div class="card"><h3>مقدمة</h3>
<p>مهما بلغ الذكاء الاصطناعي من الإتقان والمهارة فلن يصل لتحاكي الجنس البشري في أسلوب التفكير والإبداع والعاطفة والمشاعر؛ فعندما يلعب الإنسان مباراة ما وينتصر فيها يشعر بالفخر والفرح والسرور، وهذا ما اختصه الله سبحانه وتعالى في الإنسان وميزه به عن غيره. أما الآلة فعندما تنتصر تعرف حتى على من انتصرت وتكون الحلقة النهائية لها <span dir="ltr">Game Over</span> دون الشعور بلذة الانتصار.</p>
<p>والنجاح الحالي للذكاء الاصطناعي يعود إلى <b>البرامج المتخصصة في الذكاء الاصطناعي</b> التي وضعها الإنسان، وما زالت الأبحاث تتوالى لتقدم المزيد في هذا الميدان، وتنوعت مجالات الذكاء الاصطناعي لتشمل مجالات واسعة في الحياة العملية، ومنها:</p></div>
<div class="card"><h3>أولًا: تمثيل المعرفة</h3>
<p>تمثيل المعرفة يعتبر واحدًا من أبرز سمات الذكاء الاصطناعي من أجل اتخاذ خيارات صائبة وإيجاد أفضل الحلول، وتستند معظم أنظمة الذكاء الاصطناعي إلى جزئين رئيسيين هما:</p>
<div class="hadith">١- <b>قاعدة معلومات</b> تحتوي على المعرفة وتخزن على أجهزة الذكاء الاصطناعي.<br>٢- <b>معرفة آلية للتدخل</b>.</div>
<p>فالأفكار المتعلقة بالمخلوقات الذكية التي يمكن أن تؤدي مهام ذكية تتشابه مع ذكاء البشر، تتطلب أساسًا كبيرًا من المعرفة المختزنة على شكل رموز في أنظمة الذكاء الاصطناعي. ولا شك إن التحدي الكبير الذي يواجه الباحثين في مجال الذكاء الاصطناعي هو <b>إيجاد أفضل أسلوب لتمثيل المعرفة وتطبيقها على نظام قادر على التفكير من أجل حل أي مشكلة</b>.</p>
<p>والمعرفة لدى البشر تتكون من جزئين:</p>
<ul>
<li><b>معرفة ظاهرة:</b> تعتمد على المخزون من قاعدة البيانات المتوفرة في وسائل التخزين المتاحة له كالكتب والاسطوانات الممغنطة وغيرها، وتشترك أنظمة الذكاء الاصطناعي مع الإنسان في هذا النوع من المعرفة.</li>
<li><b>معرفة ضمنية:</b> وهي المتكونة من الخبرات العملية الموجودة في عقول البشر وغير مدونة؛ فكيف للأنظمة الذكية الوصول إلى هذا النوع من المعرفة؟ ويمتاز الإنسان بالمعرفة الضمنية.</li>
</ul></div>
<div class="card"><h3>نشاط: تمثيل المعرفة</h3>
<p>إكمال جدول المقارنة بين الإنسان وأنظمة الذكاء الاصطناعي:</p>
<table class="idx-table"><tr><th>وجه المقارنة</th><th>الإنسان</th><th>الآلة (الذكاء الاصطناعي)</th></tr>
<tr><td>يعتمد على قاعدة البيانات</td><td>نعم</td><td>نعم</td></tr>
<tr><td>يشعر بلذة الانتصارات</td><td>نعم</td><td>لا</td></tr>
<tr><td>يمتلك معرفة ضمنية</td><td>نعم</td><td>لا</td></tr></table></div>
<div class="card"><h3>ثانيًا: الشبكات العصبية الاصطناعية</h3>
<p>هناك أبحاث تدفعنا إلى التفاؤل في تطوير واستعمال الشبكات العصبية الاصطناعية في بناء الآلة الذكية. والميزة الهامة التي تم ملاحظتها في الأبحاث أن <b>شبكات الخلايا العصبية قادرة على تسجيل وتخزين وتذكر واسترجاع مختلف الإشارات والمعلومات</b>، وهي قادرة أيضًا على <b>محاكاة كيفية عمل الذاكرة لأنماط الإدراك</b>. ولوحظ أيضًا أن لشبكة الخلايا العصبية <b>القدرة على التدريب</b>، ويمكن إعادتها عدة مرات على نفس المجموعة ليتم تعلم النمط الوارد في المعطيات.</p>
<p>والشبكات العصبية الاصطناعية تشبه إلى حد كبير الخلايا العصبية في الدماغ البشري.</p>
<p class="note">في الكتاب شكل «شبكة عصبية بسيطة» من ثلاث طبقات: طبقة الإدخال (input layer) ← الطبقة المخفية (hidden layer) ← طبقة الإخراج (output layer).</p></div>
<div class="card"><h3>ثالثًا: معالجة اللغة الطبيعية (Natural Language Processing)</h3>
<p>يتعامل الحاسوب مع البيانات من أوامر وتعليمات بلغة متداولة مثل اللغة الإنجليزية، حيث يقوم المستخدم بإعطاء الأوامر والتعليمات للحاسوب بصوته فتمر عبر اللاقط وتحول الأمواج الصوتية إلى نبضات كهربائية ليقوم الحاسوب بالتعامل معها.</p>
<p>والمعالجة الطبيعية للغة تعطي الآلات <b>القدرة على قراءة وفهم اللغات التي يتحدثها البشر</b>. ويأمل كثير من الباحثين أن يكون نظام معالجة اللغة الطبيعية قويًا بما يكفي لاكتساب المعرفة من تلقاء نفسه، وذلك من خلال قراءة النص المتاح والتعامل معه، باسترجاع المعلومات (أو تحليل النصوص)، والترجمة الآلية وغيرها.</p></div>
<div class="card"><h3>رابعًا: نظام التعلم (Learning)</h3>
<p>صمم علماء الذكاء الاصطناعي مجموعة من البرامج الذكية التي تتيح للحاسوب القدرة على <b>التعلم من أخطائه السابقة بتخزين المواقف الخاطئة وتحليلها وعدم الوقوع فيها مرة أخرى</b>. وتركز هذه البرامج على الألعاب الذكية بحيث يسترجع الحاسوب المواقف التي أخطأ بها عند أداء اللعبة ليتجنبها في اللعبة التالية وهكذا.</p></div>
<div class="card"><h3>خامسًا: الروبوتات (Robotics)</h3>
<p>الروبوتات عبارة عن <b>أجهزة ميكانيكية تم برمجتها لتقوم بمهام مختلفة بدقة عالية وسرعة فائقة</b>. وبعض من الروبوتات تشبه الإنسان ويطلق عليها <b>الإنسان الآلي</b>، وبعضها عبارة عن آلات تختلف بالشكل حسب المهمة المراد تكليفها بها ويطلق عليها <b>بالإنسالة</b>، وسندرس لاحقًا بعض مهام الروبوتات.</p></div>
<div class="card"><h3>سادسًا: الأنظمة المرئية (Vision Systems)</h3>
<p>تستخدم الأنظمة المرئية في كثير من المجالات وأهمها في مجال <b>الأمن والحماية</b>، وتستخدم للتحقق من هوية الداخل سواء كان جسمًا غريبًا أو شخصًا، حيث تقوم هذه الأنظمة بالعمل الآتي:</p>
<div class="flow"><div class="fl">١- التقاط الصور</div><div class="fa">⬇</div><div class="fl">٢- تخزينها في قاعدة بيانات مخصصة لهذه الغاية</div><div class="fa">⬇</div><div class="fl">٣- معالجتها والتحقق من هويتها</div><div class="fa">⬇</div><div class="fl">٤- اتخاذ القرار المناسب بالسماح لها بالدخول أو إجراء ما يلزم</div></div>
<p>وفي الكتاب صورتان للأنظمة المرئية: الأولى <b>أنظمة مرئية للفضاء الخارجي</b> لمراقبة القضاء الخارجي من دخول أي من النيازك أو الأجسام غير المرغوب فيها والتدخل السريع في حال شن هجوم فضائي. أما الثانية فهي <b>صورة لصراف آلي يستخدم بصمة العين</b> للتعرف على العميل.</p></div>
<div class="card"><h3>سابعًا: الأنظمة الخبيرة (Expert System)</h3>
<p>هي <b>برامج تحاكي أداء الإنسان في مجال خبرته</b>؛ فالنظام الخبير يحتوي على كمية هائلة من المعلومات التي يمتلكها الخبير المتخصص في مجال ما من مجالات المعرفة، ويعد من أقوى فروع الذكاء الصناعي. وتمتاز النظم الخبيرة بعدة مميزات ومنها:</p>
<div class="hadith">١- سهولة الاستخدام.<br>٢- قادرة على التعلم من البشر.<br>٣- قادرة على تعليم غير المتخصصين.<br>٤- قدرتها على تفسير الحلول التي توصلت إليها مع توضيح آلية الوصول إليها.<br>٥- الاستجابة للأسئلة البسيطة والمعقدة في حدود التطبيق.</div>
<p>ولتصميم نظام خبير في أي مجال لا بد من المرور بعدة مراحل وهي:</p>
<div class="flow"><div class="fl">تعريف التطبيق: تحديد مجال النظام الخبير</div><div class="fa">⬇</div><div class="fl">تصميم النظام</div><div class="fa">⬇</div><div class="fl">برمجة النظام</div><div class="fa">⬇</div><div class="fl">اختبار النظام وتوثيقه</div></div>
<p>مكونات النظام الخبير كما في مخطط الكتاب:</p>
<table class="idx-table"><tr><th>المكوّن</th><th>دوره في المخطط</th></tr>
<tr><td>المستخدم</td><td>يرسل استعلامًا ويستلم الحل</td></tr>
<tr><td>واجهة المستخدم</td><td>تصل المستخدم بالنظام الخبير</td></tr>
<tr><td>محرك الاستدلال</td><td>يربط واجهة المستخدم بقاعدة المعرفة وذاكرة العمل</td></tr>
<tr><td>قاعدة المعرفة</td><td>تُغذّى بالمعرفة من الخبير</td></tr>

<div class="card"><h3>٢. مهام الروبوتات</h3>
<ul style="list-style:none;padding:0 4px">
<li><b>1 – المهام المتكررة</b> التي تعتبر مملة للإنسان كما في صناعة السيارات وغيرها، فيكون عمل الروبوت تثبيت برغي أو زجاج سيارة، فيؤدي الروبوت دوره بسرعة واتقان بلا كلل أو ملل.</li>
<li><b>2 – المهام الخطرة على الإنسان</b> كاكتشاف الفضاء الخارجي أو العمل في تفقد المتفجرات والألغام أو الوصول إلى الأماكن الضيقة كالسراديب والمناجم، كما حصل بإرسال روبوت لدخول الممرات الضيقة في الأهرامات.</li>
<li><b>3 – المهام التي تحتاج إلى دقة متناهية</b> كإجراء العمليات الجراحية الدقيقة.</li>
<li><b>4 – القيام بالأعمال المنزلية</b> المختلفة.</li>
<li><b>5 – العمل في المصانع بديلًا عن الإنسان</b> حيث يستخدم في عمليات التصنيع على نطاق واسع بما في ذلك تجميع الأجزاء والاختبار ومعالجة المواد واللحام وطلاء المواد وغيرها من الأعمال. ويمتاز الروبوت بسهولة حركته وسرعة إنجازه للعمل، كما يستطيع العمل لساعات طويلة دون طلب للراحة أو أخذ استراحة للفطور أو الغداء.</li>

{ id:'g9-history-1-1', title:'الباب الأول – الدرس الأول: حالة الوطن العربي قبل مجيء العثمانيين',
  explain:`
<div class="card"><h3>حالة الوطن العربي قبل مجيء العثمانيين</h3>
<p>عاش الوطن العربي قبل مجيء العثمانيين <b>حالة من الضعف والتفكك</b>، سهلت على قوى مختلفة أن تستولي على أجزاء منه.</p></div>
<div class="card"><h3>أولًا: المشرق العربي</h3>
<p>بعد <b>سقوط بغداد عام 1258م</b> في يد المغول دخلت منطقة المشرق العربي في حالة من الفوضى، وأصبحت مقسمة بين عدة دول أهمها:</p>
<div class="hadith">١- الدولة الصفوية في بلاد الرافدين.<br>٢- الدولة المملوكية في الشام ومصر والجزيرة العربية.</div></div>
<div class="card"><h3>ثانيًا: شمال أفريقيا</h3>
<p>شهدت منطقة الشمال الأفريقي قيام عدة دول على أنقاض دولة الموحدين، وكانت دولًا مفككة ضعيفة:</p>
<table class="idx-table"><tr><th>الدولة</th><th>مكانها</th></tr>
<tr><td>الحفصيون</td><td>تونس</td></tr><tr><td>بنو زيان</td><td>المغرب الأوسط (الجزائر)</td></tr><tr><td>المرينيون</td><td>مراكش</td></tr></table>
<p>وزاد من ضعفها <b>سقوط دولة المسلمين في الأندلس بيد الأسبان عام 1492م</b>، وقيامهم بحملات على شمال أفريقيا لمطاردة المسلمين وتحطيم قواهم حتى لا يفكروا في العودة للأندلس.</p>
<div class="flow"><div class="fl">سقوط طرابلس في أيدي الأسبان عام 1510م</div><div class="fa">⬇</div><div class="fl">تسليمها لفرسان القديس يوحنا عام 1530م</div></div>
<p>كما احتل الأسبان بعض الموانئ الأخرى مثل <b>الجزائر وعنابة</b>، وهاجموا <b>تونس وجربة</b>.</p></div>
<div class="card"><h3>النتيجة</h3>
<p>يتضح أن أحوال وأوضاع المشرق العربي وشمال أفريقيا في أواخر القرن الخامس عشر وأوائل القرن السادس عشر تكاد تكون واحدة من حيث <b>التفكك والضعف في مواجهة أطماع الدول المحيطة بهم</b>.</p>
<p>وقد مهدت هذه الأوضاع لظهور قوى إسلامية ناشئة تتمتع بالقوة وترغب في مد نفوذها إلى المنطقة، تمثلت هذه القوة في <b>الدولة العثمانية</b>.</p></div>
<div class="card"><h3>العثمانيون</h3>
<p>ترجع نسبتهم إلى إحدى القبائل التركية التي كانت تسكن أواسط آسيا، ثم اضطرت للهجرة أمام زحف القبائل المغولية، واستقرت في آسيا الصغرى. وبعد أن استوطنت في المكان تحالفت مع السلاجقة في حربهم ضد الروم، وعندما انتصروا كافأهم السلطان السلجوقي علاء الدين بمنحهم مقاطعة <b>(إسكي شهر)</b>، وسرعان ما توسعت أملاكهم خاصة في عهد <b>عثمان بن أرطغرل</b> مؤسس الدولة العثمانية، والذي اتسم بشخصية قوية واتخذ من مدينة <b>بروسه</b> عاصمة له، وتمكن من صد هجمات المغول وتوطيد أركان حكمه وبسط سلطانه على الإمارات المجاورة.</p>
<p>وتمكن خلفاؤه من بعد وفاته من أن يكملوا بناء دولتهم، ومن أهمهم السلطان <b>محمد الثاني</b> الذي فتح <b>القسطنطينية</b> عاصمة الدولة البيزنطية عام <b>1453م</b>، ولقب بـ<b>محمد الفاتح</b> لأن هذه العاصمة استعصت على المسلمين من قبل، وبدخولها سقطت الدولة البيزنطية.</p>
<p>لقد تمكنت الدولة العثمانية بفضل سلاطينها الأوائل الأقوياء من التوسع في أوروبا، كما خضع معظم الوطن العربي للحكم العثماني وذلك لفترة أربعة قرون <b>(1516 – 1918م)</b> ما عدا المغرب الأقصى.</p>
<p class="note">لم يخضع المغرب الأقصى لحكم العثمانيين وإنما بقي تحت حكم الأشراف السعديين ثم العلويين من بعدهم حتى تقاسمته فرنسا وإسبانيا في أوائل القرن العشرين.</p>
<p>بدأ <b>الضعف</b> يدب في الدولة العثمانية في القرن السابع عشر الميلادي نتيجة ضعف السلاطين وانصرافهم عن شؤون الحكم، وعمّت الرشوة وانتشر الفساد وامتدت الفوضى إلى الجيش، فانحطت الكفاءة العسكرية وكثر النزاع بين العسكر، وبدأت تظهر بعض الحركات الرافضة لسياسة الولاة العثمانيين بالوطن العربي.</p></div>
<div class="card"><h3>العهد العثماني في ليبيا (مخطط ص12)</h3>
<table class="idx-table"><tr><th>العهد</th><th>الفترة</th><th>أهم الولاة في هذا العهد</th></tr>
<tr><td>العهد العثماني الأول</td><td>1551 – 1711م</td><td>مراد آغا (1551–1553م)<br>درغوث باشا (1553–1565م)</td></tr>
<tr><td>العهد القرمانلي</td><td>1711 – 1835م</td><td>أحمد القرمانلي (1711–1745م)<br>يوسف علي باشا القرمانلي (1795–1834م)</td></tr>
<tr><td>العهد العثماني الثاني</td><td>1835 – 1912م</td><td>علي رضا باشا (1867–1870م) و(1872–1874م)<br>أحمد راسم باشا (1881–1896م)<br>نامق باشا (1896–1898م)<br>المشير رجب باشا (1904–1908م)</td></tr></table></div>`,
  summary:[
    'عاش الوطن العربي قبل العثمانيين حالة من <b>الضعف والتفكك</b> سهلت على قوى مختلفة الاستيلاء على أجزاء منه.',
    'المشرق العربي بعد سقوط بغداد (1258م) في يد المغول: فوضى وانقسام بين <b>الدولة الصفوية</b> في بلاد الرافدين و<b>الدولة المملوكية</b> في الشام ومصر والجزيرة العربية.',
    'شمال أفريقيا: دول مفككة ضعيفة على أنقاض الموحدين: <b>الحفصيون</b> (تونس) و<b>بنو زيان</b> (المغرب الأوسط) و<b>المرينيون</b> (مراكش).',
    'سقطت الأندلس بيد الأسبان عام <b>1492م</b>، ثم شنّ الأسبان حملات على شمال أفريقيا.',
    'سقطت طرابلس في يد الأسبان عام <b>1510م</b>، ثم سلموها لفرسان القديس يوحنا عام <b>1530م</b>.',
    'مهدت هذه الأوضاع لظهور قوة إسلامية ناشئة هي <b>الدولة العثمانية</b>.',
    'العثمانيون ترجع نسبتهم إلى قبيلة تركية في أواسط آسيا، ومؤسس دولتهم <b>عثمان بن أرطغرل</b> وعاصمته <b>بروسه</b>.',

{ id:'g9-history-1-2', title:'الباب الأول – الدرس الثاني: مجيء العثمانيين إلى ليبيا (1551م)',
  explain:`
<div class="card"><h3>حالة ليبيا قبل مجيء العثمانيين</h3>
<p><b>أولًا: طرابلس</b></p>
<p>كانت طرابلس قبل مجيء العثمانيين تابعة <b>للحفصيين</b> الذين حكموها بواسطة وال يعين من قبلهم. لكن بعد ضعف الحفصيين خضعت طرابلس لسلطة <b>أصحاب النفوذ من الزعامات المحلية</b>، فعمت الفوضى وكثرت الثورات وأهملت الحصون والأسوار.</p>
<div class="flow"><div class="fl">ضعف الحفصيين وفوضى الزعامات المحلية</div><div class="fa">⬇</div><div class="fl">انتهاز الأسبان الفرصة ودخولهم طرابلس عام 1510م بعد صراع طويل مع أهلها</div><div class="fa">⬇</div><div class="fl">تنازل الأسبان عنها لفرسان القديس يوحنا عام 1530م</div></div>
<p>ولم يتعدَّ نفوذ الأسبان <b>أسوار مدينة طرابلس</b>، واستمر حتى عام <b>1530م</b>، إذ تنازلوا عنها لفرسان القديس يوحنا الذين استبدوا في حكمهم، بدافع تقدمهم على الإسلام والمسلمين.</p></div>
<div class="card"><h3>ثانيًا: برقة</h3>
<p>ارتبطت برقة سياسيًّا في بعض الفترات التاريخية <b>بمصر</b>، ولم تكن هذه التبعية دومًا كاملة، نظرًا لكثرة ثورات أهالي برقة واتساع الصحراء. فكانت السلطة الفعلية غالبًا في أيدي الزعماء المحليين من أهل برقة.</p></div>
<div class="card"><h3>ثالثًا: فزان</h3>
<p>نعمت منطقة فزان ببعدها عن مطامع الطامعين لتوسطها الصحراء، وتمتعت بحكم الزعماء المحليين من أهل البلاد، ومن أشهر حكامها <b>أسرة أولاد إمحمد</b> التي ظلت تحكم فزان حتى بعد ضم العثمانيين لليبيا.</p></div>
<div class="card"><h3>النتيجة</h3>
<p>يتضح مما ذكر أن البلاد <b>لم تكن لها حكومة موحدة</b>.</p></div>
<div class="card"><h3>مجيء العثمانيين إلى ليبيا</h3>
<p>عندما أمعن فرسان القديس يوحنا في ظلم أهالي طرابلس، استنجدوا بالسلطان العثماني <b>سليمان القانوني</b> الذي سارع إلى إرسال قوة عثمانية بقيادة <b>مراد آغا</b> الذي عسكر بتاجوراء، واتخذها مركزًا لمهاجمة حامية المدينة التي كان يحتمي بها فرسان القديس يوحنا.</p>
<p>وعلى الرغم من محاولاته المتكررة لدخول المدينة، فإنه قد فشل وطلب المدد من السلطان العثماني الذي أرسل <b>أسطولًا بقيادة سنان باشا ومساعده درغوث</b>، اللذين كانا يحاصران جزيرة مالطا. فاتجها بأسطول بحري ضخم بعد تركهما حصار مالطا إلى طرابلس.</p>
<div class="flow"><div class="fl">استنجاد أهالي طرابلس بالسلطان سليمان القانوني</div><div class="fa">⬇</div><div class="fl">قوة عثمانية بقيادة مراد آغا تعسكر بتاجوراء، وتفشل في دخول المدينة</div><div class="fa">⬇</div><div class="fl">طلب المدد، فيصل أسطول سنان باشا ودرغوث بعد تركهما حصار مالطا</div><div class="fa">⬇</div><div class="fl">حصار طويل يجبر فرسان القديس يوحنا على تسليم المدينة</div><div class="fa">⬇</div><div class="fl">تسليم طرابلس في أغسطس عام 1551م</div></div></div>
<div class="card"><h3>مراد آغا والحكم العثماني</h3>
<p>أصبح <b>مراد آغا واليًا</b> على طرابلس التي غدت مركزًا مهمًّا من مراكز العثمانيين على سواحل البحر الأبيض المتوسط، ومنها بسطوا حكمهم على باقي إقليم طرابلس، وإن لم يستقر لهم الحال في بعض المناطق، كما في <b>فزان</b>.</p></div>
<div class="card"><h3>برقة والعثمانيون</h3>
<p>تأخر وصول النفوذ العثماني إلى برقة <b>بعشرات السنين</b>، مما أتاح لبعض جماعات المهاجرين الأندلسيين من بقايا المسلمين الفارين من الاضطهاد الديني في أسبانيا أن يستغلوا هذا الفراغ السياسي في إقليم برقة من جهة، وقرب الجبل الأخضر من بيئتهم الأندلسية من جهة أخرى، فاستوطنوا <b>مدينة درنة</b> وأعادوا تعميرها.</p>
<p>وتمكن العثمانيون في طرابلس في أواسط القرن <b>السابع عشر الميلادي</b> من بسط نفوذهم على <b>بنغازي</b> وما حولها وعلى <b>واحة أوجلة</b> أيضًا في جنوب برقة.</p></div>`,

<p>دخلت ليبيا منذ عام <b>1551م</b> عهدًا جديدًا يعرف <b>بالعهد العثماني الأول</b>، وقد تميز هذا العهد بسماته الخاصة؛ إذ بدأت تتشكل في البلاد، مع غيرها من الأقطار المجاورة، وضعية جديدة ربطتها بدولة إسلامية فتية كبرى تقاسمت الصراع والنفوذ مع أكبر الدول الغربية في حوض البحر المتوسط، في مطلع العصر الحديث.</p>

{ id:'g9-history-1-4', title:'الباب الأول – الدرس الرابع: تطور نظام الحكم في العهد العثماني الأول',
  explain:`
<div class="card"><h3>تقسيم العهد العثماني الأول</h3>
<p>ينقسم العهد العثماني الأول في إيالة طرابلس إلى <b>مرحلتين</b>، تعود أولاهما إلى بداية العهد.</p>
<table class="idx-table"><tr><th>المرحلة</th><th>الفترة</th></tr><tr><td>المرحلة الأولى</td><td>1551 – 1610م</td></tr><tr><td>المرحلة الثانية</td><td>1610 – 1711م</td></tr></table></div>
<div class="card"><h3>المرحلة الأولى (1551 – 1610م)</h3>
<p>ارتبطت بسيطرة <b>النظام المركزي القوي</b> على كيان الدولة العثمانية، ومن هنا كان <b>الولاة الأوائل يعينون ويرسلون من العاصمة (الأستانة)</b>، ويعرف الوالي بلقب <b>(أمير الأمراء – باشا)</b> وهو يضطلع بالشؤون الإدارية والعسكرية للإيالة، وقد استمر ذلك غالبًا طيلة النصف الثاني من القرن <b>السادس عشر الميلادي</b> الذي بدأ بالوجود العثماني في هذه الإيالة كما تقدم.</p></div>
<div class="card"><h3>المرحلة الثانية (1610 – 1711م)</h3>
<p>بدأت بوادرها تظهر إلى الوجود في أوائل القرن التالي <b>السابع عشر الميلادي</b>، وتعود إلى <b>ضعف النظام المركزي</b>، وبداية بروز <b>النفوذ المحلي لضباط الإنكشارية</b>.</p>
<div class="hadith"><b>الإنكشارية:</b> يرجعون إلى الجيش العثماني القديم الذي عُرف بهذا الاسم ويعني: <b>الجيش الجديد</b>.</div>
<p>وقد بدأ تكوينه منذ بداية الدولة العثمانية، وكان أفراده يُجمعون صغارًا من ضريبة الغلمان التي تُفرض على بعض شعوب الدولة العثمانية في أوروبا الشرقية، وتعنى الدولة بتربيتهم في مدارس خاصة على الإسلام، والولاء للسلطان، وإكسابهم بعض المهارات الإدارية والتقاليد العسكرية. ومن هنا ظهر منهم كبار المسؤولين، فضلًا عن العديد من الفرق العسكرية ورجال الجيش العثماني.</p>
<p>وفي طرابلس زاد نفوذ الانكشاريين في <b>ديوان الإيالة</b>، فزاحموا الولاة في سلطتهم، وأخذوا يستأثرون بها شيئًا فشيئًا إلى أن غلبوا على أمرها، وسيطروا غالبًا على الولاة القادمين من الآستانة الذين أصبح نفوذهم ضعيفًا. وقد عُرف هؤلاء الحُكام أو الولاة المحليون بلقب <b>الدايات</b> في طرابلس. وشهد هذا العهد الأول بعض الثورات وحركات التمرد من بعض سكان الإيالة، وصراعًا على السلطة بين ضباط الجيش والبحرية.</p></div>
<div class="card"><h3>ومن أهم ولاة هذا العهد</h3>
<p><b>محمد باشا الساقزلي (1633 – 1649م):</b> كان بحارًا، التحق بنشاط البحرية في الجزائر، وقَدِمَ إلى طرابلس وتولى حكمها محليًّا. ثم حصل على أمر تعيينه من السلطان العثماني، ومُنح لقب باشا. وفي عهده امتدت حدود الإيالة إلى بنغازي وواحة أوجلة، وبعد موته خلفه تابعه <b>عثمان باشا الساقزلي</b>، صاحب المدرسة المعروفة باسمه، وهي من أبرز المدارس القديمة في طرابلس.</p>
<p><b>محمد باشا الإمام (1687 – 1701م):</b> لقب بشايب العين، وكان خيّرًا تقيًّا نزيهًا، وقد شهدت البلاد في عهده بعض الإصلاحات الاقتصادية. بنى <b>الجامع الكبير</b> المعروف باسمه، وجدد بناء السوقين المتصلين بجامعه – وهما من أهم أسواق المدينة – <b>سوق الترك وسوق الحرير</b>.</p>
<table class="idx-table"><tr><th>الوالي</th><th>مدة ولايته</th><th>أهم أعماله</th></tr>
<tr><td>محمد باشا الساقزلي</td><td>1633 – 1649م</td><td>امتدت في عهده حدود الإيالة إلى بنغازي وواحة أوجلة</td></tr>
<tr><td>عثمان باشا الساقزلي</td><td>خلف محمد باشا</td><td>صاحب مدرسة عثمان باشا الساقزلي</td></tr>
<tr><td>محمد باشا الإمام (شايب العين)</td><td>1687 – 1701م</td><td>بنى الجامع الكبير (جامع شايب العين) وجدد سوق الترك وسوق الحرير</td></tr></table></div>
<div class="card"><h3>أهم ملامح هذا العهد</h3>
<div class="hadith">١- قصر مدة الولاة بسبب تخوف السلطة في الأستانة من انفصالهم عن الدولة العثمانية إذا طالت مدة ولايتهم.<br>٢- بعد الإيالة عن الدولة العثمانية جعلها لا تأخذ نصيبها من الاهتمام.<br>٣- سيطرة الدولة العثمانية على السواحل نتيجة اتساع رقعة الدولة وقلة السكان وضعف المواصلات.<br>٤- ضعف النفوذ العثماني في الدواخل، وهو ما أدى إلى بقاء مقاليد الأمور غالبًا في أيدي شيوخ القبائل.</div></div>`,
  summary:[
    'ينقسم العهد العثماني الأول إلى مرحلتين: الأولى <b>(1551–1610م)</b> والثانية <b>(1610–1711م)</b>.',
    'المرحلة الأولى: سيطرة النظام المركزي القوي، والولاة يعينون ويرسلون من <b>الأستانة</b> ويلقب الوالي <b>(أمير الأمراء – باشا)</b> ويتولى الشؤون الإدارية والعسكرية.',
    'المرحلة الثانية: ضعف النظام المركزي وبروز النفوذ المحلي لضباط <b>الإنكشارية</b> (الجيش الجديد).',
    'كان الإنكشاريون يُجمعون صغارًا من <b>ضريبة الغلمان</b> في أوروبا الشرقية، ويُربّون على الإسلام والولاء للسلطان ويُكسبون المهارات الإدارية والعسكرية.',
    'زاد نفوذ الإنكشاريين في <b>ديوان الإيالة</b> حتى غلبوا الولاة القادمين من الآستانة، وعُرف الحكام المحليون بلقب <b>الدايات</b>.',
    'شهد العهد ثورات وحركات تمرد وصراعًا على السلطة بين ضباط الجيش والبحرية.',
    '<b>محمد باشا الساقزلي</b> (1633–1649م): بحار، امتدت في عهده حدود الإيالة إلى بنغازي وأوجلة، وخلفه <b>عثمان باشا الساقزلي</b> صاحب المدرسة المعروفة باسمه.',
    '<b>محمد باشا الإمام</b> (1687–1701م) لقب بشايب العين: بنى الجامع الكبير وجدد <b>سوق الترك وسوق الحرير</b>.',
    'من ملامح العهد: قصر مدة الولاة، وبُعد الإيالة عن الدولة، وسيطرة العثمانيين على السواحل، وضعف نفوذهم في الدواخل حيث بقيت الأمور بيد شيوخ القبائل.'
  ],

{ id:'g9-history-1-5', title:'الباب الأول – الدرس الخامس: الدولة القرمانلية (1711م – 1835م)',
  explain:`
<div class="card"><h3>مدخل: الإنكشارية وقيام الدولة القرمانلية</h3>
<p>مع استقرار جنود الإنكشارية القادمين إلى الإيالة في بداية العهد العثماني، اختلط الكثيرون منهم مع الأهالي بالمصاهرة. وقد تركز وجودهم في المدن الساحلية مثل: <b>طرابلس والزاوية وجنزور وسوق الجمعة وتاجوراء ومسلاته وزليتن ومصراتة وبنغازي ودرنة</b>.</p>
<p>وفي أواخر فترة حكم الدّايات، أُتيح لهؤلاء الجند الذين كانوا عنصرًا مؤثرًا في الجيش، وفئة قريبة من الأهالي، أن يشاركوا في الصراع على السلطة، وأن يبرز نفوذهم شيئًا فشيئًا إلى أن تمكن أحدُ ضباطهم وهو <b>أحمد القرمانلي</b> من الوصول إلى حكم الإيالة وتأسيس <b>الدولة القرمانلية</b>، التي أصبحت <b>وراثية شبه مستقلة</b>، في إطار الدولة العثمانية. وعنيت بالشأن المحلي والعلاقات الدولية، وترسيخ وحدة الإيالة الإدارية والسياسية.</p></div>
<div class="card"><h3>أحمد باشا القرمانلي (1711م – 1745م)</h3>
<p>يعود أصل القرمانليين إلى أسرةٍ عثمانية تنسب إلى <b>إقليم قرمان في الأناضول</b>، وهو القسم الآسيوي الذي بدأ فيه ظهور الدولة العثمانية. وقد استوطنت هذه الأسرة مدينة طرابلس في مطلع العهد العثماني.</p>
<h3>وصوله إلى الحكم</h3>
<p>خلال الصراع الدائر على السلطة في السنوات الأخيرة من العهد العثماني الأول بين كبار الضباط وطوائف الجيش في الإيالة، تمكن أحمد باشا بمساعدة أعوانه وجموع من الأهالي سنة <b>1711م</b> من أن يصل إلى الحكم، وأن يمسك بزمام الأمور شيئًا فشيئًا، ويقضي على الفتن التي واجهته.</p>
<div class="flow">
<div class="fl">صراع على السلطة بين كبار الضباط وطوائف الجيش</div><div class="fa">⬇</div>
<div class="fl">1711م: أحمد القرمانلي يصل إلى الحكم بمساعدة أعوانه وجموع من الأهالي</div><div class="fa">⬇</div>
<div class="fl">السلطان لا يوافق، ويرسل خليل باشا واليًا بفرمان سلطاني على رأس قوة حربية</div><div class="fa">⬇</div>
<div class="fl">سكان الإيالة يلتفون حول أحمد القرمانلي، فينزح خليل باشا غربًا ويفشل ويُقتل</div><div class="fa">⬇</div>
<div class="fl">أحمد القرمانلي يرسل وفدًا بهدايا كثيرة للسلطان وحاشيته يطلب إقرار ولايته</div><div class="fa">⬇</div>
<div class="fl">السلطان يرسل محمد باشا، فيُحاط بحفاوة بالغة مع مراقبة صارمة، ثم يعود إلى الآستانة محملًا بالهدايا</div><div class="fa">⬇</div>
<div class="fl">1714م: فرمان الولاية لأحمد القرمانلي ومنحه لقب (باشا)</div>
</div>
<p>فقد أرسل السلطان العثماني خليل باشا واليًا من طرفه مؤيدًا بفرمان سلطاني على رأس قوةٍ حربية، لكن سكان الإيالة التفوا حول أحمد القرمانلي، ممَّا اضطر خليل باشا إلى النزوح غربًا، والنزول هناك للاستعانة ببعض الأهالي، غير أن محاولته باءت بالفشل وقُتل.</p>
<p>وقد تمكن أحمد القرمانلي من استرضاء السلطان العثماني بواسطة وفد أرسله، يطلب إقرار ولايته، ويحمل معه الكثير من الهدايا للسلطان وحاشيته. فأرسل السلطان شخصًا يُدعى محمد باشا، فأحاطه أحمد القرمانلي بحفاوةٍ بالغة، مع المراقبة الصارمة، وعاد إلى (الآستانة) محملًا بالهدايا. وأصدر السلطان فرمان الولاية لأحمد القرمانلي، ومنحه لقب (باشا) سنة <b>1714م</b>.</p></div>
<div class="card"><h3>أهم أعمال أحمد باشا القرمانلي</h3>
<div class="hadith"><b>١- توحيد ليبيا:</b> عمل على توحيد البلاد سياسيًّا وإداريًّا، أي كل أطراف الإيالة التي تضمها ليبيا اليوم.<br>
<b>٢- وضع نواة البحرية الليبية:</b> جدد تأسيس الأسطول البحري الذي تعود بدايات نشاطه إلى العهد العثماني الأول، فأسس دارًا لصناعة السفن، وجدد الأسطول وأضاف إليه قطعًا جديدة، حتى تكامل وحمى به السواحل من خطر السفن الأوروبية المعادية.<br>
<b>٣-</b> عني بتأمين طرق قوافل التجارة، بين سواحل الإيالة وما وراء الصحراء ومدن وسط قارة إفريقيا.<br>
<b>٤-</b> بنى جامعًا وألحق به مدرسة، وأوقف عليه بعض المباني للقيام بشؤونه. ويُرْوَى أنه بُني بموضع الجامع الذي أنشأه عمرو بن العاص – رضي الله عنه – عندما فتح طرابلس، ولا يزال يعرف <b>بجامع أحمد باشا</b> إلى اليوم، وهو أجمل أثرٍ معماري للعهد القرمانلي بمدينة طرابلس.<br>
<b>٥-</b> اهتم برعاية العلماء وإكرامهم، وبرز في عهده العالم <b>محمد بن خليل بن غلبون</b>، وهو فقيه ومؤرخٌ ليبي، درس بالأزهر وكانت له مكانةٌ عالية لدى أحمد باشا القرمانلي، وقد دعاه إلى وضع كتابه التاريخي المعروف بعنوان: <b>(التذكار فيمن ملك طرابلس ومن كان بها من الأخيار)</b>، وهو يُعَدّ من أهم المصادر التاريخية إلى اليوم في المكتبة الليبية.</div></div>
<div class="card"><h3>وفاته</h3>
<p>استمر أحمد باشا في الحكم نحو <b>(34)</b> سنة، قام خلالها بأعمالٍ جليلة، وسعى إلى أن يكون الحكم من بعده وراثيًا، فاستصدر من السلطان العثماني أمرًا بتولية أكبر أبنائه الحكم من بعده، وتوفي عام <b>1745م</b> ودفن بجامعه في طرابلس.</p></div>
<div class="card"><h3>أبرز حكام الدولة القرمانلية (مخطط ص21)</h3>
<p>يعرض المخطط أبرز الحكام وأهم ما يرتبط بكل منهم:</p>
<table class="idx-table"><tr><th>الحاكم</th><th>مدة حكمه</th><th>أهم ما يرتبط به في المخطط</th></tr>
<tr><td>أحمد باشا القرمانلي</td><td>1711 – 1745م</td><td>توحيد ليبيا، ووضع نواة البحرية الليبية، وتأمين طرق قوافل التجارة، ورعاية العلماء وإكرامهم، وبناء جامع أحمد باشا ومدرسته</td></tr>
<tr><td>محمد باشا القرمانلي</td><td>1745 – 1754م</td><td>العناية بالأسطول البحري وصناعة السفن، وجعل إيالة طرابلس كيانًا دوليًّا مستقلًّا</td></tr>
<tr><td>علي باشا القرمانلي</td><td>1754 – 1793م</td><td>التوسع في عقد المعاهدات الدولية</td></tr>
<tr><td>يوسف باشا القرمانلي</td><td>1795 – 1834م</td><td>(فروع المخطط الخاصة به تتصل بالدرس القادم)</td></tr></table></div>
<div class="card"><h3>محمد باشا القرمانلي (1745م – 1754م)</h3>
<p>هو محمد بن أحمد باشا القرمانلي، تولى الحكم سنة <b>1745م</b>. وقد كان للجهود التي بذلها والده أثر طيب في استقرار البلاد في عهده، فلم تشهد أية ثورات أو فتنٍ داخلية، ولقد سار على نهج أبيه فوجه عنايته إلى الأسطول البحري، فزاد من صناعة السفن حتى بلغت البحرية في عهده قوة لم يسبق لها مثيل، مما اضطر بعض الدول إلى السعي في عقد المعاهدات والاتفاقيات مع إيالة طرابلس رأسًا، ودفع الأتاوى السنوية، لضمان سلامة سفنها وتجارتها.</p>
<p>فعقدت <b>إنجلترا</b> – على سبيل المثال – مع محمد باشا القرمانلي، سنة <b>1751م</b>، معاهدة تحتوي على ثمانٍ وعشرين بنداً من أهمها:</p>
<div class="hadith">١- منح السفن الليبية حق تفتيش السفن الإنجليزية في عرض البحر.<br>٢- منح السفن الإنجليزية الإذن بالمتاجرة مع الموانئ الليبية.<br>٣- لا تتعرض سفن إنجلترا وطرابلس لبعضها إذا ما التقت في البحر، بل يتبادلان طلقات المدفعية للتحية.</div>
<p>وقد منح عقد هذه المعاهدات مع الدول الغربية إيالة طرابلس <b>كيانًا دوليًّا مستقلًّا</b>، وجنت منها مكاسب سياسية.</p>
<p>توفي محمد باشا القرمانلي سنة <b>1754م</b> بعد أن عهد بالحكم لابنه علي.</p></div>
<div class="card"><h3>علي باشا القرمانلي (1754م – 1793م)</h3>
<p>حكم قرابة <b>(39)</b> عامًا، وشهد عهده ظاهرتان أساسيتان هما:</p>
<h3>الأولى: التوسع في عقد المعاهدات الدولية</h3>
<p>استمر الأسطول الليبي في نشاطه في عهد علي باشا، الذي واصل فرض الأتاوى على السفن الأوروبية، وتوسع في عقد المعاهدات. كما أعاد التصديق على المعاهدة التي عقدها والده مع إنجلترا، وعقد معاهدة مع <b>جمهورية البندقية الإيطالية</b>(1) عام <b>1756م</b>، تحتوي على ثلاثٍ وعشرين بنداً، ومن أهم بنودها:</p>
<div class="hadith">١- توقف السفن الليبية عن اعتراض سفن البندقية في البحر المتوسط.<br>٢- حرية تبادل التجارة بين البلدين.</div>
<div class="note">(1) هي إحدى المدن الإيطالية.</div>
<h3>الثانية: الصراع على السلطة واستيلاء علي برغل على طرابلس</h3>
<p>في أواخر أيام حكم علي باشا ساءت حالته الصحية وعجز عن القيام بمهام الدولة وضبط أمورها، فكثرت الفتن والثورات الداخلية، واجتاح البلاد مرض <b>الطاعون</b> الذي فتك بالكثير من السكان، وظهر الخلاف بين أبناء علي باشا، فقتل <b>يوسف</b> أخاه الأكبر <b>حسن</b> القرمانلي. فاغتنم <b>علي برغل</b>، أحد رجالات الإدارة في الجزائر، هذا الوضع، ودخل طرابلس وتولى حكم البلاد عام <b>1793م</b>.</p>

<div class="fl">علي برغل يرسل حملة تستولي على جزيرة جربة بدعوى تبعيتها لطرابلس</div><div class="fa">⬇</div>

<div class="fl">هزيمة علي برغل وفراره عبر البحر، واستعادة القرمانليين حكم طرابلس</div>
</div>

<div class="card"><h3>مدخل: وصول يوسف إلى الحكم</h3>
<p>بعد فرار علي برغل من طرابلس وعودة الأسرة القرمانلية للحكم، رغب <b>علي باشا</b> في تولية ابنه <b>أحمد</b> حكم الولاية، إلا أن تطلعات أخيه <b>يوسف</b> ونفوذه حالت دون ذلك، وأجبرت أحمد على الفرار إلى <b>مالطا</b> عام <b>1795م</b>.</p>
<p>اعتلى يوسف سدة الحكم، وأقرّ السلطان العثماني ولايته بفرمان مع منحه رتبة <b>الباشوية</b>.</p>
<div class="flow">
<div class="fl">فرار علي برغل من طرابلس وعودة الأسرة القرمانلية للحكم</div><div class="fa">⬇</div>
<div class="fl">علي باشا يرغب في تولية ابنه أحمد الحكم</div><div class="fa">⬇</div>
<div class="fl">تطلعات يوسف ونفوذه تحول دون ذلك</div><div class="fa">⬇</div>
<div class="fl">1795م: أحمد يُجبر على الفرار إلى مالطا</div><div class="fa">⬇</div>
<div class="fl">يوسف يعتلي سدة الحكم، والسلطان يقرّ ولايته بفرمان ويمنحه رتبة الباشوية</div>
</div></div>
<div class="card"><h3>أهم أعمال يوسف باشا</h3>
<div class="hadith"><b>١-</b> القضاء على الفتن التي انتشرت في البلاد، وإعادة الهدوء والسكينة إلى طرابلس.<br>
<b>٢-</b> تحصين السواحل ومنافذ البلاد، وذلك من خلال إصلاح سور العاصمة وبناء الكثير من الأبراج فيه.<br>
<b>٣-</b> الاهتمام بتجارة القوافل والعمل على تنشيطها مع وسط أفريقيا والسودان، لأنها تعتبر من مصادر دخل الإيالة.<br>
<b>٤-</b> الاعتناء بالبحرية حتى بلغت درجة كبيرة من القوة، وأصبح الأسطول الليبي من أقوى الأساطيل في البحر المتوسط.<br>
<b>٥-</b> دخوله في حروب ونزاعات عديدة مع دول غربية انتصر في معظمها، مثل: الحرب الليبية الأمريكية، ونزاعه مع السويد، وحروبه مع بعض الجمهوريات الإيطالية.</div></div>
<div class="card"><h3>أ – الحرب الليبية الأمريكية</h3>
<p>امتنعت الولايات المتحدة الأمريكية عن دفع الأتاوة كباقي الدول سنة <b>1800م</b>، فهدد يوسف باشا الحكومة الأمريكية بالحرب. وحاولت أمريكا الدخول في مفاوضات تجنبًا للحرب، وبعد أن فشلت أعلن يوسف باشا الحرب عليها في <b>14 مايو 1801م</b>، واستمرت حتى <b>1804م</b>، حيث استطاعت البحرية الليبية الاستيلاء على السفينة الأمريكية <b>فيلادلفيا</b> وأسر طاقمها الذي يبلغ <b>ثلاثمائة رجل</b>.</p>
<p>فحاولت أمريكا استرجاع السفينة الراسية في ميناء طرابلس، إلا أنّ محاولاتها الدبلوماسية باءت بالفشل، فقامت بإشعال النار فيها. كما لجأت إلى بث الدسائس وإثارة الفتن، فاتصلوا بأحمد القرمانلي شقيق يوسف باشا، وأوهموه بأنه أحق بالإيالة من أخيه وأنهم يعملون على نصرته وإعادة الحكم إليه. فأخذوه من مالطا ثم أتوا به إلى درنة، فتحركت قوات يوسف باشا إلى المنطقة، وسرعان ما استطاعت القضاء على هذه الفتنة بمساعدة الأهالي.</p>

<h3>أهم بنود معاهدة 4 يونيو 1805م</h3>
<div class="hadith">١- جلاء القوات الأمريكية عن الأرض الليبية.<br>٢- تبادل الأسرى بين الطرفين، وتدفع أمريكا تعويضًا مقداره ستون ألف دولار لحكومة طرابلس.</div></div>
<div class="card"><h3>ب – نزاعه مع السويد</h3>
<p>طلب يوسف باشا من القنصل السويدي في طرابلس أن يرفع الإتاوة التي تدفعها بلاده، وقيمتها <b>ثمانية آلاف فرنك سويدي سنويًّا</b>، مع دفع غرامة مقدارها <b>مائة ألف فرنك</b>، غير أن القنصل رفض ذلك. فقامت بحرية الإيالة بأسر <b>سبع سفن سويدية</b>، فلجأت السويد إلى <b>نابليون بونابرت</b> صديق يوسف باشا للتوسط بين الطرفين، وتم الصلح على أن تدفع السويد إلى الإيالة غرامة قدرها <b>ثمانين ألف فرنك</b>، وثمانية آلاف فرنك ضريبة سنوية.</p></div>
<div class="card"><h3>جـ – حروبه مع الجمهوريات الإيطالية</h3>
<p>دخل يوسف باشا في حروب مع بعض الجمهوريات الإيطالية في الفترة من <b>1821م إلى 1827م</b>، وقد انتهت بعقد صلح بشروط مرضية.</p>

<div class="card"><h3>ضعف الدولة القرمانلية</h3>
<p>دام حكم الدولة القرمانلية لليبيا ما يقرب من <b>124 عامًا</b>، شهدت البلاد خلالها العديد من المحن، لكن القرمانليين استطاعوا الخروج من أكثرها بسلام. وأحرزت ليبيا في عهدهم مكانة مرموقة بين الدول، ولكن اجتمعت عليها عدة عوامل أدت إلى ضعفها وانهيارها.</p>
<h3>أسباب سقوط الدولة القرمانلية</h3>
<div class="hadith"><b>١- ضعف الأسطول البحري:</b> كان الأسطول البحري الليبي مرهوبًا، وقد شكل أحد أهم مصادر الدخل في الدولة القرمانلية. لكن الحروب التي خاضها أضعفته وأنهكت قواه، وانتهى دوره عندما تحالفت الدول الأوروبية للقضاء عليه، فضعفت الدولة القرمانلية اقتصاديًّا وسياسيًّا.<br>
<b>٢- تحول طرق تجارة القوافل:</b> التي تمر عبر الإيالة إلى البحر، بسبب سعي الدول الأوروبية إلى التحكم في أسواق الإنتاج.<br>
<b>٣- احتلال الجزائر:</b> هاجمت فرنسا الجزائر واحتلتها عام <b>1830م</b>، فتحكمت في التجارة وطرقها في أفريقيا، ونافست الدولة القرمانلية في ذلك، وعملت على إضعاف التجارة الليبية عبر بلاد السودان بتحويل معظمها إلى الجزائر.<br>
<b>٤- إسراف يوسف باشا وأسرته وحاشيته:</b> شهد أواخر عهد يوسف باشا ضعفًا كبيرًا، وتدهورت حالة البلاد السياسية والاقتصادية. فمع تعود الأمراء على حياة الترف والإسراف، باع يوسف باشا بعض القطع البحرية، وترك أمور البلاد إلى أبنائه وأصهاره، وقسّم الإيالة بينهم. واستخف هؤلاء بالأمر وأرسلوا نوابًا بدلًا عنهم، فساءت سيرتهم، وحمّلوا الأهالي فوق ما يطيقون.<br>
<b>٥- تدخل قناصل الدول الأجنبية في أمور البلاد:</b> نتيجة لإسراف يوسف باشا اضطر إلى الاستدانة من الأجانب، ولما عجز عن الوفاء بالديون في مواعيدها استعان أصحاب الديون بدولهم، وكان أكثرهم من الفرنسيين. استغلت فرنسا الفرصة وأرسلت أسطولها إلى طرابلس، غير أن يوسف باشا تمكن من الخروج من هذه الأزمة بمساعدة أعيان البلاد وتجارها.<br>
<b>٦- تذمر الأهالي:</b> مع اشتداد الأزمة المالية أخذ يوسف باشا يفرض الضرائب المتعددة على الأهالي، الذين عجزوا عن الدفع وامتنعوا عن التسديد. وتطور موقفهم إلى ثورات متعددة، حاول يوسف باشا القضاء عليها ولكنه لم يفلح في الأمر.</div></div>
<div class="card"><h3>نهاية الدولة القرمانلية</h3>
<p>دام حكم يوسف باشا نحو <b>40 عامًا</b>، وفي أواخر عهده وبسبب سياسته الاقتصادية السيئة دخلت البلاد في حرب أهلية. فخلال سنة <b>1832م</b> تنازل يوسف باشا عن الحكم لابنه <b>علي</b> مجبرًا. وانقسم الجند وأهالي الإيالة إلى فريقين متنازعين:</p>

    {t:'open',q:'كيف وصل يوسف إلى حكم الإيالة؟',a:'بعد فرار علي برغل وعودة الأسرة القرمانلية للحكم رغب علي باشا في تولية ابنه أحمد، إلا أن تطلعات أخيه يوسف ونفوذه حالت دون ذلك، وأجبرت أحمد على الفرار إلى مالطا عام 1795م. فاعتلى يوسف سدة الحكم، وأقر السلطان العثماني ولايته بفرمان مع منحه رتبة الباشوية.'},
    {t:'open',q:'اذكر أهم أعمال يوسف باشا القرمانلي.',a:'١- القضاء على الفتن وإعادة الهدوء والسكينة إلى طرابلس. ٢- تحصين السواحل ومنافذ البلاد بإصلاح سور العاصمة وبناء الكثير من الأبراج فيه. ٣- الاهتمام بتجارة القوافل وتنشيطها مع وسط أفريقيا والسودان لأنها من مصادر دخل الإيالة. ٤- الاعتناء بالبحرية حتى أصبح الأسطول الليبي من أقوى الأساطيل في البحر المتوسط. ٥- دخوله في حروب ونزاعات مع دول غربية انتصر في معظمها.'},
    {t:'open',q:'اشرح الحرب الليبية الأمريكية: أسبابها ومجرياتها.',a:'امتنعت أمريكا سنة 1800م عن دفع الأتاوة كباقي الدول، فهدد يوسف باشا بالحرب، وحاولت أمريكا التفاوض فلم تنجح، فأعلن الحرب عليها في 14 مايو 1801م، واستمرت حتى 1804م حيث استولت البحرية الليبية على السفينة فيلادلفيا وأسرت طاقمها البالغ ثلاثمائة رجل.'},
    {t:'open',q:'ماذا فعلت أمريكا بعد فشل محاولاتها الدبلوماسية لاسترجاع السفينة فيلادلفيا؟ وما نتيجة ذلك؟',a:'أشعلت النار في السفينة، ولجأت إلى بث الدسائس وإثارة الفتن، فاتصلت بأحمد القرمانلي شقيق يوسف باشا وأوهمته بأنه أحق بالإيالة من أخيه، وأخذته من مالطا إلى درنة. فتحركت قوات يوسف باشا وقضت على هذه الفتنة بسرعة بمساعدة الأهالي.'},
    {t:'open',q:'اذكر أهم بنود المعاهدة التي عُقدت بين أمريكا وإيالة طرابلس في 4 يونيو 1805م.',a:'١- جلاء القوات الأمريكية عن الأرض الليبية. ٢- تبادل الأسرى بين الطرفين، وتدفع أمريكا تعويضًا مقداره ستون ألف دولار لحكومة طرابلس.'},
    {t:'open',q:'تحدث عن نزاع يوسف باشا مع السويد وكيف انتهى.',a:'طلب يوسف باشا من القنصل السويدي أن يرفع الإتاوة السنوية (ثمانية آلاف فرنك سويدي) مع دفع غرامة مائة ألف فرنك، فرفض القنصل، فأسرت بحرية الإيالة سبع سفن سويدية. فلجأت السويد إلى نابليون بونابرت صديق يوسف باشا للتوسط، وتم الصلح على أن تدفع السويد غرامة ثمانين ألف فرنك وثمانية آلاف فرنك ضريبة سنوية.'},
    {t:'open',q:'اذكر أسباب سقوط الدولة القرمانلية.',a:'١- ضعف الأسطول البحري. ٢- تحول طرق تجارة القوافل إلى البحر. ٣- احتلال فرنسا الجزائر عام 1830م ومنافستها في التجارة. ٤- إسراف يوسف باشا وأسرته وحاشيته. ٥- تدخل قناصل الدول الأجنبية في أمور البلاد. ٦- تذمر الأهالي من الضرائب وثوراتهم.'},
    {t:'open',q:'كيف أضعف الأسطول البحري الدولة القرمانلية؟',a:'كان الأسطول الليبي مرهوبًا وأحد أهم مصادر الدخل، لكن الحروب التي خاضها أضعفته وأنهكت قواه، وانتهى دوره عندما تحالفت الدول الأوروبية للقضاء عليه، فضعفت الدولة القرمانلية اقتصاديًّا وسياسيًّا.'},
    {t:'open',q:'وضح كيف أدى إسراف يوسف باشا إلى تدخل قناصل الدول الأجنبية وتذمر الأهالي.',a:'مع تعوّد الأمراء على الترف والإسراف باع يوسف باشا بعض القطع البحرية، وترك أمور البلاد لأبنائه وأصهاره وقسّم الإيالة بينهم فساءت سيرتهم وحُمّل الأهالي فوق ما يطيقون. واضطر إلى الاستدانة من الأجانب، فلما عجز عن الوفاء استعان أصحاب الديون (أكثرهم فرنسيون) بدولهم، فاستغلت فرنسا الفرصة وأرسلت أسطولها إلى طرابلس، لكن يوسف باشا خرج من الأزمة بمساعدة أعيان البلاد وتجارها. ومع اشتداد الأزمة فرض ضرائب متعددة عجز الأهالي عن دفعها فثاروا ولم يفلح في القضاء على ثوراتهم.'},
    {t:'open',q:'اشرح كيف انتهت الدولة القرمانلية (1832م – 1838م).',a:'دخلت البلاد في حرب أهلية بسبب سياسة يوسف باشا الاقتصادية السيئة، فتنازل عن الحكم لابنه علي مجبرًا سنة 1832م، وانقسم الجند والأهالي بين أنصار علي داخل المدينة المحاصرة والثوار بقيادة أبناء أخيه محمد في المنشية والساحل. واستمر النزاع حتى وصل الأسطول العثماني بقيادة مصطفى نجيب باشا سنة 1835م فأعاد الإيالة إلى الحكم العثماني المباشر، وأُخذ علي باشا إلى الآستانة وبقي بها حتى وفاته، وتُرك يوسف باشا في طرابلس لسنه وعجزه حتى توفي بها سنة 1838م.'}
  ]

,{ id:'g9-history-1-7', title:'الدرس السابع: العهد العثماني الثاني (1835م – 1912م)',
explain:`<div class="card"><h3>مقدمة: فترتان مختلفتان</h3><p>ينقسم العهد العثماني الثاني في ليبيا إلى فترتين مختلفتين نسبيًّا لما بينهما من التفاوت في الاستقرار والتطور الإداري والاجتماعي، وهما: <b>فترة الإيالة</b> و<b>فترة الولاية</b>.</p></div>
<div class="card"><h3>فترة الإيالة (1835م – 1865م)</h3><p>كانت الإيالة المستوى الإداري الأعلى في التقسيم الإداري العثماني بين القرنين السادس عشر والتاسع عشر، وكان يرأسها <b>بيكلربكي</b>، وظل نظام الإيالات ساريًا إلى أن استُبدل بنظام الولايات.</p><p>شهدت هذه الفترة <b>عودة الحكم العثماني المباشر</b> برغبة جديدة في توحيد الإيالات المنفصلة وضمّها ثانية إلى كيان الدولة الموحد، ومنها إيالة طرابلس الغرب التي ازدادت الأخطار الدولية المحدقة بها، وخاصة بعد الاحتلال الفرنسي للجزائر 1830م.</p><div class="hadith"><b>مشكلات هذه العودة:</b><br>• اصطدمت بالقوى والزعامات القبلية التي اكتسبت في مناطقها الداخلية قدرًا من السلطة المحلية والنفوذ الاجتماعي خلال العهد القرمانلي.<br>• الشكوى من فساد بعض الولاة ودفع الضرائب في العهد الجديد.</div></div>
<div class="card"><h3>أبرز الانتفاضات</h3><table class="idx-table"><tr><th>الانتفاضة</th><th>مكانها وخبرها</th><th>نهايتها</th></tr><tr><td>عبد الجليل سيف النصر</td><td>بدأت أواخر العهد القرمانلي شرقي طرابلس بين المنطقة الوسطى وجنوب الإيالة، وظلت مناوئة لولاة العهد الثاني</td><td>القضاء عليها سنة 1842م</td></tr><tr><td>غومة المحمودي</td><td>انطلقت في مطلع العهد الثاني في الجبل الغربي الذي تمتع سابقًا ببعض النفوذ الجهوي، وقاوم مع جموع القبائل في مواقع ومعارك ضارية تخللتها هدنة ومصالحة ونفي وعودة إلى القتال</td><td>القضاء عليها سنة 1858م</td></tr></table></div>
<div class="card"><h3>النظام الإداري في فترة الإيالة</h3><p>تولى حكم الإيالة اثنا عشر واليًا: أولهم <b>مصطفى نجيب باشا</b> (1835م)، وآخرهم <b>محمود نديم باشا</b> الذي تم في عهده التحول إلى نظام الولاية.</p><p>ظل التقسيم الإداري المعمول به في العهد القرمانلي سائدًا في جل هذه الفترة، وفي السنوات الأخيرة بدأت تظهر بعض المصطلحات الإدارية الجديدة لكنها لم ترسخ إلا بعد التحول إلى نظام الولاية.</p></div>
<div class="card"><h3>فترة الولاية (1865م – 1911م)</h3><p>رأت الدولة العثمانية خلال هذه الفترة تنظيم إيالاتها العديدة في القارات الثلاث على أسس إدارية قانونية جديدة، وأصدرت لذلك <b>قانون الولايات</b> الذي ينظم سير الأمور في مرافقها، وجاء في مقدمته التقسيم الإداري الجديد.</p><p><b>مركز الولاية</b> قُسمت إلى <b>خمسة سناجق</b> (وحدات إدارية): <b>طرابلس المركز، الجبل الغربي، الخمس، فزان، بنغازي</b>. وبنغازي شهدت بصفة خاصة بعض التحولات الإدارية في وضعيتها وتبعيتها، فكانت أحيانًا تتبع مركز الولاية كبقية السناجق، وتُفصل أحيانًا بصفة <b>متصرفية</b> تتبع الآستانة رأسًا، وتُجعل أحيانًا ولاية مستقلة. وتضم الولاية عددًا من كبار الموظفين.</p><div class="flow"><div class="fl">الوالي (يرأس مركز الولاية)</div><div class="fa">⬇</div><div class="fl">السنجق ← يرأسه المتصرف (نائب الوالي)</div><div class="fa">⬇</div><div class="fl">القضاء ← يرأسه القائم مقام (نائب المتصرف)</div><div class="fa">⬇</div><div class="fl">الناحية ← يرأسها المدير</div></div></div>
<div class="card"><h3>مجلس إدارة الولاية (مركز الولاية)</h3><p>يتكوّن من:</p><table class="idx-table"><tr><th>الأعضاء الطبيعيون</th><th>الأعضاء المنتخبون</th></tr><tr><td>الدفتردار (المسؤول المالي)، المكتوبجي (رئيس القلم)، محاسب الأوقاف، متصرف المركز، المفتي، القاضي</td><td>بضعة رجال من الأهالي</td></tr></table></div>
<div class="card"><h3>مشاركة الأهالي والتمثيل الشعبي</h3><p>إلى جانب مجلس الإدارة الذي كانت له تشكيلات أدنى في بقية المواقع، ظهرت في هذه الفترة مؤسسات أُتيح فيها لأهالي الولاية بعض المشاركة في تسيير الشؤون العامة:</p><table class="idx-table"><tr><th>المؤسسة</th><th>ما يتعلق بها</th></tr><tr><td>مجلس المبعوثان</td><td>يضم عددًا من النواب المنتخبين عن كل ولاية، ويُعقد بالعاصمة الآستانة</td></tr><tr><td>البلدية</td><td>تطورت عن وظيفة شيخ البلد؛ تأسست عام 1286هـ / 1870م؛ تضم رئيسًا وعددًا من أعضاء المجلس البلدي؛ تتولى الإشراف على خدمات المدينة ومراقبة الأسواق</td></tr><tr><td>مجلس العموم</td><td>عقد أولى دوراته 1286هـ / 1869م؛ يجتمع مرة في السنة؛ لا تزيد اجتماعاته عن 40 يومًا؛ يضم بضعة أعضاء مختارين عن كل سنجق</td></tr></table></div>
<div class="card"><h3>الطباعة والصحافة</h3><p>عرفت ولاية طرابلس في بداية فترة الولاية دخول فن الطباعة وصدور أول صحيفة رسمية <b>«طرابلس غرب»</b> مزدوجة باللغتين التركية العثمانية والعربية، وبدأ صدورها سنة <b>1866م</b> واستمرت إلى نهاية العهد العثماني. وصدرت معها مطبوعة سنوية رسمية تعرف باسم <b>«السالنامة»</b> أي الحولية أو الكتاب السنوي، تضم معلومات قيمة عن مختلف شؤون الولاية، وصدر عددها الأول سنة <b>1869م</b>.</p><table class="idx-table"><tr><th>الإصدار</th><th>صاحبه</th><th>التاريخ وما يميزه</th></tr><tr><td>الترقي</td><td>الشيخ محمد البوصيري</td><td>1897م، أسبوعية، أول صحيفة شعبية أهلية</td></tr><tr><td>مجلة الفنون</td><td>محمد داود أفندي</td><td>1898م، أول مجلة ليبية</td></tr><tr><td>المنهل العذب في تاريخ طرابلس الغرب</td><td>أحمد النائب الأنصاري</td><td>طُبع بالآستانة 1899م، أول كتاب تاريخي يطبع في المكتبة الليبية</td></tr></table><p>ثم توالى صدور الصحف الأهلية الخاصة في السنوات الأخيرة من العهد العثماني، منها: <b>الكشاف</b> لمحمد النائب الأنصاري، و<b>العصر الجديد</b> لمحمد علي البارودي، و<b>المرصاد</b> لأحمد الفساطوي في طرابلس، و<b>الأسد الإسلامي</b> لسليمان الباروني في القاهرة، و<b>دار الخلافة</b> لعبد الوهاب عبد الصمد في الآستانة. لكن الغزو الإيطالي للبلاد سنة 1911م أوقف هذا النشاط الثقافي الحيوي الجديد.</p><div class="note">هامش: كانت اللغة التركية العثمانية تكتب بالحروف العربية، ولكنها تحولت إلى الحروف الغربية في أول العهد الجمهوري، بينما لا تزال الفارسية في إيران والأوردية في باكستان تكتبان بالحروف العربية.</div></div>
<div class="card"><h3>المؤسسات التعليمية والثقافية</h3><p>ظلت المؤسسات التعليمية القديمة قائمة بدورها: <b>الكتاتيب القرآنية والزوايا والمدارس الدينية</b> المنتشرة في المناطق والمدن، وتقوم بتدريس اللغة العربية والعلوم الإسلامية، ومنها:</p><ul><li>زاوية الزروق بمصراتة، والأسمرية بزليتن، والدوكالي بمسلاتة، وأبوراوي بتاجوراء، وميزران بطرابلس، وعمورة بجنزور، والأبشات بالزاوية الغربية، والحضيري بسبها.</li><li>في الجبل الغربي: الطواهرية، والعالم، وأبوماضي، والزوايا الإباضية، والسني.</li><li>الزوايا السنوسية: ومنها <b>البيضاء وهي أول زاوية سنوسية في ليبيا</b>، وفي درنة وشحات وبنغازي والمرج ومرزق وأم الرزم وأوجلة والجوف بالكفرة والمرازيق بالقبة والجغبوب.</li></ul><p>وكانت بعض الزوايا العلمية الكبرى تضم مجموعات من المخطوطات العربية والكتب المطبوعة يستعين بها الشيوخ والطلاب، ومن أهم المكتبات القديمة: <b>مكتبة الزاوية السنوسية في الجغبوب، ومكتبة زاوية أبي ماضي في ككلة، ومكتبة الأوقاف العامة بطرابلس</b> التي أُنشئت في أواخر القرن التاسع عشر.</p><p>وظهرت في العهد الثاني أيضًا <b>مؤسسات تعليمية حديثة</b>: المدارس الابتدائية والمدارس الرشدية، ومدرسة الزراعة، ومدرسة العرفان الخاصة، ومدرسة الفنون والصنائع؛ ويتلقى التلاميذ فيها مواد متنوعة وفق مراحلها وتخصصاتها.</p></div>
<div class="card"><h3>الحركة السنوسية</h3><p>من أبرز الحركات الإصلاحية التي ظهرت في العالم الإسلامي في تاريخه الحديث والمعاصر. ولد مؤسسها <b>الشيخ الإمام محمد بن علي السنوسي</b> بمدينة مستغانم غربي الجزائر سنة <b>1787م</b>، ورحل إلى فاس بالمغرب ثم اتجه شرقًا إلى الحجاز وأسس زاوية في جبل أبي قبيس بمكة المكرمة، ثم رحل إلى برقة سنة <b>1839م</b> وأقام بالجبل الأخضر وبنى الزاوية البيضاء، ثم تحول إلى واحة الجغبوب وأسس زاويته المعروفة وتوفي بها سنة <b>1859م</b>، وترك مؤلفات ومكتبة زاخرة بالمخطوطات.</p><div class="flow"><div class="fl">مستغانم 1787م</div><div class="fa">⬇</div><div class="fl">فاس بالمغرب</div><div class="fa">⬇</div><div class="fl">الحجاز: زاوية جبل أبي قبيس بمكة</div><div class="fa">⬇</div><div class="fl">برقة 1839م: الزاوية البيضاء بالجبل الأخضر</div><div class="fa">⬇</div><div class="fl">الجغبوب: وفاته 1859م</div></div></div>
<div class="card"><h3>دور محمد المهدي السنوسي</h3><p>خلف والده في رئاسة الطريقة ابنه محمد المهدي (ولد 1844م)، وازدادت الطريقة قوة في عهده وانتشرت زواياها في عديد البلدان وأكثرها في الصحراء الكبرى وشمال أفريقيا. وكانت الزوايا السنوسية تجمع بين التعليم والاشتغال بالزراعة وما يرتبط بها من نشاط اقتصادي حرصًا على تحقيق الاكتفاء الذاتي. انتقل من الجغبوب إلى واحة الكفرة ومنها إلى وادي (تشاد) فتوفي بها سنة <b>1902م</b>، ونقل جثمانه إلى الكفرة حيث دُفن.</p></div>
<div class="card"><h3>دور أحمد الشريف السنوسي</h3><p>من أكبر رجال الحركة ابن أخي المهدي الشيخ <b>أحمد الشريف السنوسي</b> الذي ولد بالجغبوب سنة <b>1873م</b>. شاركت الحركة في الجهاد ضد الفرنسيين في الصحراء الجنوبية وضد الغزو الإيطالي في الجهات الشرقية من ليبيا. واضطر إلى الهجرة فأقام باستانبول ومرسين بتركيا، ثم رحل إلى الحجاز فأقام بمكة المكرمة والمدينة المنورة إلى وفاته هناك سنة <b>1933م</b>. له مؤلفات في التصوف ورحلة مدونة من الجغبوب إلى الكفرة بعنوان <b>«السراج الوهاج بالرحلة المنيرة من الجغبوب إلى التاج»</b>. وبرز بعده في قيادة الجهاد بالجبل الأخضر <b>الشيخ عمر المختار</b> الذي كان من أبرز شيوخ الزوايا السنوسية.</p><table class="idx-table"><tr><th>من الأسرة السنوسية (المخطط)</th><th>الميلاد (هـ / م)</th></tr><tr><td>محمد بن علي السنوسي</td><td>1202هـ / 1787م</td></tr><tr><td>محمد المهدي السنوسي</td><td>1260هـ / 1844م</td></tr><tr><td>محمد الشريف السنوسي</td><td>1262هـ / 1846م</td></tr><tr><td>أحمد الشريف السنوسي</td><td>1284هـ / 1873م</td></tr><tr><td>صفي الدين الشريف</td><td>1312هـ / 1895م</td></tr><tr><td>محمد إدريس السنوسي</td><td>1307هـ / 1890م</td></tr></table></div>`,
summary:['ينقسم العهد العثماني الثاني إلى <b>فترة الإيالة (1835–1865م)</b> و<b>فترة الولاية (1865–1911م)</b>.','في الإيالة عاد الحكم العثماني المباشر بقيادة <b>مصطفى نجيب باشا</b> سنة 1835م، وتولى الإيالة 12 واليًا آخرهم <b>محمود نديم باشا</b>.','واجهت العودة انتفاضة <b>عبد الجليل سيف النصر</b> (القضاء عليها 1842م) و<b>غومة المحمودي</b> (1858م).','في فترة الولاية صدر <b>قانون الولايات</b>، وقُسم مركز الولاية إلى <b>5 سناجق</b>: طرابلس المركز والجبل الغربي والخمس وفزان وبنغازي.','التسلسل الإداري: الوالي ← المتصرف (السنجق) ← القائم مقام (القضاء) ← المدير (الناحية).','مشاركة الأهالي: مجلس المبعوثان (الآستانة)، البلدية (1870م)، مجلس العموم (1869م).','الصحافة: «طرابلس غرب» 1866م، السالنامة 1869م، «الترقي» 1897م (أول صحيفة شعبية)، «الفنون» 1898م (أول مجلة)، «المنهل العذب» 1899م (أول كتاب تاريخي).','التعليم: كتاتيب وزوايا ومدارس دينية، ومدارس حديثة (ابتدائية، رشدية، الزراعة، العرفان، الفنون والصنائع).','<b>الحركة السنوسية</b>: أسسها محمد بن علي السنوسي (1787–1859م) ثم خلفه المهدي (1844–1902م)، ثم أحمد الشريف (1873–1933م) وبرز بعده عمر المختار.'],

,{ id:'g9-history-1-8', title:'الدرس الثامن: مظاهر من الحياة العامة في العهد العثماني الثاني',
explain:`<div class="card"><h3>الحياة الاقتصادية: الضرائب</h3><p>عُرف العهد العثماني الثاني بكثرة الضرائب التي مثّلت دخلًا للدولة العثمانية، واستُخدمت القوة في كثير من الأحيان لتحصيلها. ومن أهمها:</p><table class="idx-table"><tr><th>الضريبة</th><th>على من / على ماذا</th></tr><tr><td>الويركو</td><td>تؤخذ على كل شخص بالغ وعلى الحيوانات والأشجار والآبار الصالحة للري</td></tr><tr><td>العُشر</td><td>تؤخذ على المنتجات الزراعية، وخاصة الشعير والقمح وزيت الزيتون والحلفا</td></tr><tr><td>الدخل</td><td>فُرضت على أصحاب الحرف الصناعية والتجارية ومُلّاك الدكاكين الصغيرة</td></tr><tr><td>الضرائب الجمركية</td><td>كانت تُرسل مباشرة إلى الآستانة</td></tr></table><div class="hadith"><b>أثر الضرائب:</b> شكلت عبئًا ثقيلًا أدى إلى هجرة بعض الليبيين من مناطقهم، وتذمّر الأهالي، وسبّبت اضطرابات سياسية في بعض المناطق.</div></div>
<div class="card"><h3>النشاط الاقتصادي</h3><p>رغم ذلك شهدت ليبيا نشاطًا اقتصاديًّا، نجمله في:</p><ul><li>استمرار تجارة القوافل مع العديد من أقطار القارة الأفريقية المجاورة.</li><li>تطور التجارة البحرية من السفن الشراعية إلى السفن البخارية.</li><li>ظهور نبات <b>الحلفا</b> والعناية به وبروز أهميته الاقتصادية لدخوله في صناعة العملة الورقية وغيرها من الصناعات.</li><li>صيد <b>الإسفنج</b> الذي عُرفت به الشواطئ الليبية.</li><li>تأسيس <b>مرسى طبرق</b> في عهد <b>علي رضا باشا</b> في أقصى أطراف الولاية الشرقية استعدادًا لافتتاح قناة السويس وما تتطلبه من خدمات في حوض البحر المتوسط.</li><li>تأسيس <b>مدرسة الفنون والصنائع</b> التي ساهمت في تطوير النشاط الاقتصادي.</li><li>استمرار تجارة المواشي بين الجبل الأخضر ومصر ومالطا وبعض الموانئ الأوروبية.</li></ul></div>
<div class="card"><h3>الزراعة</h3><p>كان النمط الزراعي السائد هو <b>الزراعة البعلية أو الموسمية</b> والزراعة المروية، ويزيد الإنتاج ويقل وفقًا لسقوط الأمطار. ومن أهم المحاصيل: <b>القمح والشعير</b>، ثم <b>التمور</b> لكثرة أشجار النخيل خاصة في الواحات، ثم <b>الزيتون</b> وأهم مناطق انتشاره الجبل الغربي وسهل الجفارة.</p></div>
<div class="card"><h3>ملكية الأرض</h3><p>كانت الملكية الفردية والعقارية غير معروفة في ليبيا إلا في المدن والمناطق القريبة منها، أما بقية الأراضي فهي <b>مشاع</b> لكل أفراد القبيلة ينتفع بها عدد من الأسر، أو وقف على مسجد أو زاوية، ولم تكن الحدود معروفة في الغالب، ونتج عن ذلك منازعات كثيرة.</p><p>وصدر سنة <b>1858م</b> قانون عثماني ينظم ملكية الأرض بمختلف أنواعها:</p><table class="idx-table"><tr><th>النوع</th><th>المعنى</th></tr><tr><td>الأراضي الملك</td><td>الأراضي المملوكة ملكية فردية</td></tr><tr><td>الأراضي الميري (المُشاعة)</td><td>الأراضي العامة المملوكة للدولة، وتكون ملكيتها للجميع مع إعطاء الحق للأفراد للتصرف بها دون أن يكون لهم الحق في ملكيتها</td></tr><tr><td>أراضي الوقف</td><td>حبس المال للانتفاع به في وجوه البر، ويعتبر صدقة جارية ما بقي أصله</td></tr><tr><td>الأراضي المتروكة</td><td>أراضٍ ذكرها القانون ضمن الأنواع</td></tr><tr><td>الأراضي الموات</td><td>الأراضي الصالحة للزراعة ولكنها مهملة لا يُستفاد منها</td></tr></table><p>ونتيجة لهذا القانون أُنشئت مصلحة أشبه بدائرة العقارات تعرف <b>(بالطابو)</b> لتسجيل الأراضي، وكانت تُصدر للمالك وثيقة رسمية تشبه الشهادة العقارية، وتثبت ملكية العقار لشخص أو عدة أشخاص، وتنص على حدود المِلْك وعلاماته المميزة.</p></div>
<div class="card"><h3>القضاء</h3><p>مع استمرار نظام المحاكم الشرعية السائد في مجمل البلاد الإسلامية، شهدت ولاية طرابلس ومتصرفية بنغازي في العهد العثماني الثاني بداية ظهور <b>المحاكم الحديثة</b>، ومنها:</p><table class="idx-table"><tr><th>المحكمة</th><th>اختصاصها</th></tr><tr><td>1 – محكمة الصلح</td><td>تتكون من بعض أعيان البلد يعيّنهم الوالي، وتنظر في القضايا المدنية البسيطة</td></tr><tr><td>2 – المحكمة الابتدائية</td><td>تنظر في الدعاوى المدنية والمالية، وتتفرع منها محكمة الإجراءات التي تتولى تنفيذ الأحكام</td></tr><tr><td>3 – محكمة الجنايات</td><td>تنظر في القضايا الجنائية المختلفة</td></tr><tr><td>4 – محكمة الاستئناف</td><td>تستأنف أمامها قضايا المحكمتين الابتدائية والجنائية</td></tr><tr><td>5 – محكمة التمييز</td><td>مقرها في آخر أيام الدولة العثمانية في العاصمة استانبول (الآستانة)</td></tr><tr><td>6 – المحكمة القنصلية</td><td>تتولى الفصل في القضايا بين رعايا الدول الأجنبية</td></tr><tr><td>7 – محكمة الربيين</td><td>تختص بالنظر في القضايا التي تنشأ بين اليهود</td></tr></table><p>وإلى جانب هذه المحاكم كانت هناك المحاكم الشرعية ومجالس الصلح القبلية.</p></div>
<div class="card"><h3>الحياة الاجتماعية</h3><p>تعددت مظاهر الحياة الاجتماعية في المدن والقرى والأرياف والبوادي، وكان لكل هذه البيئات آثارها على حياة السكان الذين شكلوا نسيجًا اجتماعيًّا متنوعًا من الأعراق، وضمت إلى جانب المواطنين بعض <b>الجاليات الأجنبية</b> المقيمة في المدن الكبرى على وجه الخصوص. ومن أبرز المظاهر:</p><ul><li>نظام <b>الأسرة الكبيرة</b> الجامعة بين عدة أجيال (الجد والأبناء والأحفاد).</li><li><b>سكان المدن</b> وهم الذين يسكنون الحواضر مثل طرابلس وبنغازي ودرنة والخمس ومصراتة والزاوية وغيرها، وهم مستقرون ويمارسون التجارة وبعض الحرف ومنهم الموظفون في الدولة.</li><li>تقطن المدن <b>الجاليات الأجنبية</b> مثل: الإنجليز والفرنسيين واليونانيين والمالطيين، وقد تمتعت بالحماية لأفرادها وممتلكاتهم.</li><li><b>سكان القرى والأرياف والبوادي</b> وينقسمون إلى <b>رُحَّل ومستقرين وشبه مستقرين</b>، وظل <b>نظام القبيلة</b> هو النمط السائد بينهم والمنظم لمختلف شؤون الحياة السياسية والاجتماعية والاقتصادية.</li><li>تميز المجتمع الليبي بتقاليده الخاصة المرتبطة بمناسباته المختلفة كالأفراح والحج والوفاة، وما يتعلق بها من مظاهر احتفالية أو طقوس خاصة.</li><li>تميز بطابع خاص به في الملابس والطعام ونمط البناء والحلي والزينة والمقتنيات اليومية.</li></ul></div>
<div class="card"><h3>العمارة والفنون</h3><p>تعددت أنماط العمارة والفنون بتعدد التأثيرات في العهد العثماني الثاني، فجمعت المدن الكبرى – على وجه الخصوص – بين السمات المعمارية التقليدية المحلية والتأثيرات العثمانية الوافدة، وما طرأ عليها في أواخر هذا العهد من أنماط حديثة، وخروج المدن عن أسوارها التقليدية ونشأة الأحياء الجديدة. ومن أشكال العمارة التقليدية:</p><table class="idx-table"><tr><th>النمط</th><th>وصفه</th></tr><tr><td>قصور التخزين</td><td>مبانٍ معدة لتخزين الحبوب والغلال والزيوت، مثل <b>قصر نالوت</b> الذي يتكون من عدة طوابق ويضم نحو (400) غرفة صغيرة، وكل غرفة مقسمة من الداخل إلى أجزاء، وكل جزء مخصص لنوع من الحبوب والغلال كالشعير والقمح والذرة والتين المجفف (الكرموس) والتمور الجافة. وفي مقدمة الغرفة جرار كبيرة لتخزين الزيت، ويتم الدخول إلى الغرف العلوية بالتسلق على أوتاد خشبية مثبتة على جدران القصر، وتنقل المواد بالحبال والبكرة الخشبية، وخُصصت في مدخل القصر غرفة للحارس (العساس) الذي تتلخص مهمته في حراسة القصر ومحتوياته</td></tr><tr><td>بيوت الحفر في غريان وغيرها</td><td>بيوت منحوتة في الجبال، وتتكون عادة من ثلاث غرف فأكثر</td></tr><tr><td>الشوارع المسقوفة</td><td>الممتدة في مدينة غدامس الصحراوية القديمة</td></tr><tr><td>الحوش الليبي التقليدي</td><td>المفتوح غير المسقوف الذي تطل نوافذه على الداخل، وتتقدمه السقيفة</td></tr></table><p>ويرتبط بكل هذه الأنماط أشكال فنية مصاحبة، والأثاث وأدوات المعيشة، كما كانت تنتشر في البوادي والنجوع <b>الخيام</b> المتنقلة بأنواعها الشتوية والصيفية.</p><div class="note">ص44 صور فقط (جوامع: بونس بغدامس، درنة الكبير، العتيق ببنغازي، الباشا بالخمس، تنومايت بنفوسة، مصطفى قرجي، أحمد باشا، الحسيني بأوباري، مدينة مرزق القديمة، برج الساعة، سوق الرباع المسقوف بطرابلس).</div></div>`,
summary:['<b>الضرائب</b>: الويركو (على البالغين والحيوانات والأشجار والآبار) والعُشر (على المنتجات الزراعية) والدخل (على الحرفيين وأصحاب الدكاكين) والجمركية (إلى الآستانة)؛ وأدت إلى هجرة وتذمر واضطرابات.','من مظاهر النشاط الاقتصادي: تجارة القوافل، السفن البخارية، الحلفا، الإسفنج، مرسى طبرق (علي رضا باشا)، مدرسة الفنون والصنائع، تجارة المواشي.','الزراعة بعلية أو مروية؛ أهم المحاصيل القمح والشعير ثم التمور ثم الزيتون (الجبل الغربي وسهل الجفارة).','قانون 1858م نظّم ملكية الأرض: الملك، الميري (المشاعة)، الوقف، المتروكة، الموات؛ وأُنشئ <b>الطابو</b> لتسجيل الأراضي.','المحاكم الحديثة: الصلح، الابتدائية، الجنايات، الاستئناف، التمييز (الآستانة)، القنصلية، الربيين؛ إلى جانب المحاكم الشرعية ومجالس الصلح القبلية.','الحياة الاجتماعية: الأسرة الكبيرة، سكان المدن، الجاليات الأجنبية (بالحماية)، سكان الأرياف (رحل ومستقرون وشبه مستقرين) ونظام القبيلة، وتقاليد خاصة.','العمارة: قصور التخزين (نالوت نحو 400 غرفة)، بيوت الحفر بغريان، الشوارع المسقوفة بغدامس، الحوش الليبي، والخيام.'],

{t:'open',q:'اذكر ثلاث مظاهر للنشاط الاقتصادي رغم كثرة الضرائب.',a:'استمرار تجارة القوافل، وتطور التجارة البحرية إلى السفن البخارية، وظهور الحلفا، وصيد الإسفنج، وتأسيس مرسى طبرق، ومدرسة الفنون والصنائع، وتجارة المواشي.'},
{t:'open',q:'ما أنواع الأراضي في قانون 1858م؟',a:'الأراضي الملك، والميري (المُشاعة)، وأراضي الوقف، والأراضي المتروكة، والأراضي الموات.'},
{t:'open',q:'اذكر المحاكم الحديثة التي ظهرت في العهد العثماني الثاني.',a:'الصلح، الابتدائية (ومنها محكمة الإجراءات)، الجنايات، الاستئناف، التمييز، القنصلية، الربيين.'},
{t:'open',q:'اذكر أبرز مظاهر الحياة الاجتماعية.',a:'نظام الأسرة الكبيرة، وسكان المدن، والجاليات الأجنبية، وسكان القرى والأرياف والبوادي (رحل ومستقرون وشبه مستقرين) ونظام القبيلة، والتقاليد المرتبطة بالمناسبات، والطابع الخاص في الملابس والطعام والبناء والحلي.'},
{t:'open',q:'صِف قصر نالوت كمثال على قصور التخزين.',a:'مبنى من عدة طوابق يضم نحو 400 غرفة صغيرة، كل غرفة مقسمة إلى أجزاء كل جزء لنوع من الحبوب والغلال، وفي مقدمتها جرار كبيرة لتخزين الزيت، وتُنقل المواد بالحبال والبكرة الخشبية، وله حارس (العساس).'},
{t:'open',q:'من أمثلة العمارة التقليدية في ليبيا إلى جانب قصور التخزين؟',a:'بيوت الحفر في غريان، والشوارع المسقوفة في غدامس، والحوش الليبي التقليدي، والخيام المتنقلة في البوادي.'},
{t:'open',q:'(ص45 – س1 أ) من هو الذي جدد بناء سوق الترك وسوق الحرير بطرابلس؟',a:'محمد باشا الإمام (شايب العين) (1687–1701م) — من جدول ولاة العهد العثماني الأول في الدرس 4.'},
{t:'open',q:'(ص45 – س1 ب) من هو الذي منح القبائل التركية مقاطعة (إسكي شهر)؟',a:'السلطان السلجوقي علاء الدين (الدرس 2). وفي الكتاب كتبت «آسكي شهر».'},
{t:'open',q:'(ص45 – س1 ج، د، هـ، و) من هو: ج) أسس زاوية أبي قبيس بمكة، د) اتخذ من تاجوراء مركزًا لمهاجمة فرسان القديس يوحنا، هـ) ألّف السراج الوهاج، و) شارك في الجهاد ضد الفرنسيين في الصحراء الجنوبية؟',a:'ج) محمد بن علي السنوسي. د) مراد آغا. هـ) أحمد الشريف السنوسي. و) أحمد الشريف السنوسي.'},
{t:'open',q:'(ص45 – س2) أكمل: أ) كتاب (التذكار فيمن ملك طرابلس ومن كان بها من الأخيار) للفقيه المؤرخ ...... ب) مُنحت السفن الليبية حق تفتيش السفن الإنجليزية في عرض البحر في عهد ...... ج) تنازل الأسبان عن طرابلس سنة 1530م وسلموها إلى ...... د) تقع الزاوية الأسمرية في مدينة ...... هـ) مؤسس الحركة السنوسية هو الشيخ الإمام ......',a:'أ) محمد بن خليل بن غلبون. ب) محمد باشا القرمانلي (معاهدة 1751م مع إنجلترا). ج) فرسان القديس يوحنا. د) زليتن. هـ) محمد بن علي السنوسي.'},
{t:'open',q:'(ص46 – س3) ما المقصود بـ: أ) قانون الولايات ب) مجلس المبعوثان ج) الطابو؟',a:'أ) قانون أصدرته الدولة العثمانية لتنظيم إيالاتها على أسس إدارية جديدة وينظم سير الأمور في مرافقها. ب) مجلس يضم نوابًا منتخبين عن كل ولاية ويُعقد بالعاصمة الآستانة. ج) مصلحة لتسجيل الأراضي تصدر وثيقة رسمية تثبت ملكية العقار وحدوده وعلاماته.'},
{t:'open',q:'(ص46 – س4) قارن بين انتفاضتي عبد الجليل سيف النصر وغومة المحمودي ضد العثمانيين.',a:'الأولى: بدأت أواخر العهد القرمانلي شرقي طرابلس بين المنطقة الوسطى وجنوب الإيالة، وقُضي عليها سنة 1842م. الثانية: انطلقت مطلع العهد العثماني الثاني في الجبل الغربي، وتخللتها هدنة ومصالحة ونفي وعودة إلى القتال، وقُضي عليها سنة 1858م. وتتفقان في مقاومة الحكم المركزي الجديد والنفوذ القبلي.'},
{t:'open',q:'(ص46 – س5) «استطاع أحمد القرماني الوصول إلى الحكم بمساعدة أعوانه، وإلتفاف سكان إيالة طرابلس حوله». أ) ما موقف السلطان العثماني من توليه الحكم؟ ب) اذكر ثلاث نقاط لأهم أعماله.',a:'أ) لم يوافق السلطان أولًا وأرسل خليل باشا بفرمان وقوة حربية، فالتف الأهالي حول أحمد وفشل خليل وقُتل، ثم أُقرّت ولايته وصدر فرمان الولاية ولقب «باشا» سنة 1714م. ب) توحيد ليبيا، ووضع نواة البحرية الليبية، وتأمين طرق قوافل التجارة (وبناء جامع أحمد باشا ورعاية العلماء).'},
{t:'open',q:'(ص46 – س6) كيف ساهمت الأزمة المالية في عهد يوسف باشا في سقوط الدولة القرمانلية؟',a:'مع اشتداد الأزمة المالية فرض يوسف باشا ضرائب متعددة على الأهالي فعجزوا عن الدفع وامتنعوا، وتطور موقفهم إلى ثورات متعددة لم يفلح في القضاء عليها؛ واستغل ذلك تنازع الأسرة وتدخل الدولة العثمانية حتى عاد الحكم المباشر سنة 1835م (الدرس 6).'},
{t:'open',q:'(ص46 – س7) اكتب الكلمة الدالة على المعنى: مكتبة أُنشئت في القرن 19 في طرابلس / صحيفة لسليمان الباروني في القاهرة / ينقسمون إلى رحل وشبه رحل ومستقرين / يتكون من أعيان البلد وينظر في القضايا المدنية البسيطة / الحولية أو الكتاب السنوي / تنظر في الدعاوى المدنية والمالية / نبات له أهمية اقتصادية ودخل في صناعة العملة الورقية.',a:'مكتبة الأوقاف العامة / الأسد الإسلامي / سكان القرى والأرياف والبوادي / محكمة الصلح / السالنامة / المحكمة الابتدائية / الحلفا.'},
{t:'open',q:'(ص47 – س8) لمن كان السبق في: أ) أول صحيفة شعبية أهلية ب) أول زاوية سنوسية في ليبيا ج) أول مجلة ليبية د) أول صحيفة رسمية تُكتب باللغتين (التركية والعربية) هـ) أول من وضع نواة البحرية الليبية؟',a:'أ) «الترقي» للشيخ محمد البوصيري (1897م). ب) محمد بن علي السنوسي (الزاوية البيضاء). ج) «الفنون» لمحمد داود أفندي (1898م). د) صحيفة «طرابلس غرب» (1866م). هـ) أحمد باشا القرمانلي.'},
{t:'open',q:'(ص47 – س9) صمم خريطة ذهنية تحوي أهم أنماط العمارة التقليدية في ليبيا.',a:'المركز: العمارة التقليدية؛ الفروع: قصور التخزين (نالوت، كاباو، مرزق)، بيوت الحفر (غريان)، الشوارع المسقوفة (غدامس)، الحوش الليبي المفتوح بسقيفته، الخيام المتنقلة. (الرسم يتعدد بحسب الطالب).'}
]
}

Edu.subject('g9-history').notes=[
 {l:'g9-history-0',p:'ص9',k:'يحتاج مراجعة',t:'عنوان الفقرة «العصور الحديثة والمعاصرة» تنتهي بالاحتلال الإيطالي 1911م، ثم تعرّف الصفحة «التاريخ المعاصر» على أنه ما تلاه، فيبدو العنوان والتعريف متداخلين.',r:'نُقل نص الكتاب كما هو.'},
 {l:'g9-history-1-1',p:'ص12',k:'نقص',t:'مخطط العهد العثماني يذكر أهم الولاة فقط (فترات 1565–1711 و1745–1795 و1834–1835 بلا أسماء).',r:'نُسخ ما في المخطط فقط بلا إضافة من خارج الكتاب.'},
 {l:'g9-history-1-1',p:'ص10',k:'يحتاج مراجعة',t:'«الدولة الصفوية في بلاد الرافدين» بعد سقوط بغداد 1258م: تاريخيًّا قامت الدولة الصفوية في القرن 16م، لا بعد 1258م مباشرة.',r:'نُقل نص الكتاب كما هو وأُبقيت المعلومة.'},
 {l:'g9-history-1-2',p:'ص13',k:'يحتاج مراجعة',t:'«في عام 1510م... ولم يتعدَّ نفوذهم أسوار مدينة طرابلس، واستمر حتى عام 1530م»: العبارة توحي أن نفوذ الأسبان وحده استمر حتى 1530م مع أنهم تنازلوا عنها لفرسان القديس يوحنا.',r:'نُقل نص الكتاب كما هو.'},
 {l:'g9-history-1-2',p:'ص14',k:'يحتاج مراجعة',t:'ذُكر أن مراد آغا حاصر طرابلس وفشل، ثم جاء سنان باشا ودرغوث، وفي ص15 يعدّ مراد آغا «أول والٍ عثماني»؛ والكتاب لا يذكر من تولى الحصار الأخير ولا مصير قوة مراد آغا.',r:'أُخذ كما ورد بلا إضافة من خارج الكتاب.'},
 {l:'g9-history-1-2',p:'ص13',k:'نقص',t:'لم تُنسخ صورة الواجهة البحرية في أعلى ص13 ولوحة «مدينة طرابلس»؛ والدرس لا يتضمن تمرينات.',r:'أُضيفت الأسئلة كلها من صياغة Claude من نص الدرس.'},
 {l:'g9-history-1-3',p:'ص15',k:'يحتاج مراجعة',t:'الدرس صفحة واحدة ولا يذكر من ولاة العهد (1551–1711م) إلا مراد آغا ودرغوث؛ أما بقية الولاة فيرد بعضهم في الدرس 4 (ص17).',r:'نُقل ما في الصفحة فقط.'},
 {l:'g9-history-1-3',p:'ص15',k:'نقص',t:'لم تُنسخ صور المشهدين القديمين لجامع مراد آغا وصورة جامع درغوث باشا والصورة العلوية؛ ولا توجد تمرينات في الصفحة.',r:'الأسئلة من صياغة Claude من نص الدرس.'},
 {l:'g9-history-1-4',p:'ص16',k:'يحتاج مراجعة',t:'تُعرَّف المرحلة الأولى بأنها 1551–1610م، لكن النص يقول إن النظام المركزي استمر «طيلة النصف الثاني من القرن السادس عشر»، فيبقى أول القرن السابع عشر (1600–1610م) غير مفسَّر.',r:'نُقل نص الكتاب كما هو.'},
 {l:'g9-history-1-4',p:'ص17',k:'يحتاج مراجعة',t:'فقرة «ومن أهم ولاة هذا العهد» (الساقزلي والإمام) وردت في أول ص17 بعد المرحلة الثانية، فأُلحقت بالدرس الرابع (فهرس الكتاب يجعل الدرس الخامس من ص18)؛ وعبارة «خلفه تابعه عثمان باشا الساقزلي» معناها تابعه/مولاه.',r:'نُقلت كما طُبعت.'},
 {l:'g9-history-1-4',p:'ص17',k:'يحتاج مراجعة',t:'بند «أهم ملامح هذا العهد» رقم 3 «سيطرة الدولة العثمانية على السواحل» ورقم 4 «ضعف النفوذ في الدواخل» لا يوضحان هل المقصود المرحلتان معًا.',r:'نُقل نص الكتاب كما هو.'},
 {l:'g9-history-1-4',p:'ص16–17',k:'نقص',t:'لا توجد تمرينات في صفحات الدرس؛ ولم تُنسخ صور مدرسة عثمان باشا ومشهدا الداخل والخارج وصورة جامع شايب العين. وترتيب الصور عند الرفع كان: ص17، ص14، ص15، ص13، ص16 وأُعيد ترتيبها.',r:'الأسئلة من صياغة Claude من نص الدرس.'},
 {l:'g9-history-1-5',p:'ص21',k:'يحتاج مراجعة',t:'مخطط «أبرز حكام الدولة القرمانلية» (ص21) مطبوع مقلوبًا بخط صغير؛ فروع أحمد ومحمد وعلي قُرئت بوضوح، أما فروع يوسف باشا (القضاء على الفتن، الاستناد/الاعتماد على البحرية، الدخول في حروب ومعارك، الاهتمام بحماية القوافل) فكلماتها غير واضحة في الصورة.',r:'رُسم المخطط جدولًا، وتُرك صف يوسف باشا بلا تفاصيل (تأتي في الدرس السادس)؛ فراجع المخطط في الكتاب.'},
 {l:'g9-history-1-5',p:'ص19',k:'يحتاج مراجعة',t:'ورد «محمد باشا» مرسولًا من السلطان إلى أحمد القرمانلي، ويتشابه اسمه مع محمد باشا بن أحمد (ص22)؛ والوالي الذي أُرسل أولًا وقُتل هو «خليل باشا».',r:'نُقل كما طُبع، وميّزت الأسئلة بين الشخصين.'},
 {l:'g9-history-1-5',p:'ص23',k:'يحتاج مراجعة',t:'لم يذكر الكتاب تاريخ عودة القرمانليين إلى الحكم ولا مدة حكم علي برغل بالتحديد (1793م تاريخ دخوله طرابلس).',r:'نُقل نص الكتاب كما هو بلا إضافة من خارجه.'},
 {l:'g9-history-1-5',p:'ص18–23',k:'نقص',t:'لا توجد تمرينات في الصفحات؛ ولم تُنسخ الصور (الميناء والمدينة ص18، جامع أحمد باشا ص20، صور الحكام في المخطط ص21).',r:'الأسئلة كلها من صياغة Claude من نص الدرس (47 سؤالًا). وترتيب الصور عند الرفع كان: ص20، ص19، ص21، ص22، ص18، ص23 وأُعيد ترتيبها (الصفحات 18–23 كاملة).'},
 {l:'g9-history-1-6',p:'ص24',k:'يحتاج مراجعة',t:'عنوان الدرس (1795م – 1834م) لا يطابق نص الصفحات: التنازل عن الحكم سنة 1832م، ووصول الأسطول العثماني وعودة الحكم المباشر سنة 1835م، ووفاة يوسف باشا سنة 1838م.',r:'نُقل العنوان كما هو، وأُخذت التواريخ من النص.'},
 {l:'g9-history-1-6',p:'ص24–25',k:'يحتاج مراجعة',t:'كُتب اسم السفينة «فيلادلفيا» في ص24 و«فلادلفيا» في ص25؛ ويقول الكتاب إن الأمريكيين أشعلوا فيها النار بعد فشل محاولاتهم الدبلوماسية دون تفصيل أكثر.',r:'وُحّدت الكتابة «فيلادلفيا» في الموقع، ونُقل المعنى كما ورد.'},
 {l:'g9-history-1-6',p:'ص25',k:'يحتاج مراجعة',t:'في نزاع السويد ذُكر أن الإتاوة ثمانية آلاف فرنك سنويًّا، ثم في الصلح «ثمانية آلاف فرنك ضريبة سنوية» بلا توضيح هل هي نفس الإتاوة السابقة. وحروب الجمهوريات الإيطالية (1821–1827م) لا يسمّيها الكتاب ولا يذكر أسبابها.',r:'نُقل نص الكتاب كما هو بلا إضافة من خارجه.'},
 {l:'g9-history-1-6',p:'ص26',k:'نقص',t:'سبب «تحالف الدول الأوروبية للقضاء على الأسطول الليبي» ورد بلا ذكر معركة أو تاريخ.',r:'نُقل كما ورد.'},
 {l:'g9-history-1-6',p:'ص27',k:'يحتاج مراجعة',t:'«علي باشا القرمانلي» الذي تنازل له يوسف سنة 1832م هو ابن يوسف، ويتشابه اسمه مع علي باشا بن محمد (الدرس الخامس)؛ و«أبناء أخيه محمد» هم أبناء محمد بن يوسف. والكتاب يقول إن يوسف حكم «نحو 40 عامًا» (1795–1832م نحو 37).',r:'نُقل نص الكتاب كما هو، وميّزت الأسئلة بين الشخصين.'},
 {l:'g9-history-1-6',p:'ص24–26',k:'يحتاج مراجعة',t:'فروع يوسف باشا الأربعة في مخطط ص21 (القضاء على الفتن، الاعتماد على البحرية، الدخول في حروب، حماية القوافل) توافق البنود 1 و4 و5 و3 من أعماله في ص24؛ أما البند 2 (تحصين السواحل وإصلاح السور) فلم يظهر في قراءة المخطط.',r:'لم يُعدَّل جدول الدرس الخامس؛ راجع المخطط في الكتاب.'},
 {l:'g9-history-1-6',p:'ص24–27',k:'نقص',t:'لا توجد تمرينات في الصفحات؛ ولم تُنسخ الصور (مشهد المدينة ص24، صورة حرق السفينة فيلادلفيا ص25).',r:'الأسئلة كلها من صياغة Claude من نص الدرس (57 سؤالًا: 28 اختيارًا و12 صح/خطأ و7 إكمال و10 مقالي). وترتيب الصور عند الرفع كان صحيحًا: ص24، ص25، ص26، ص27.'},
{l:'g9-history-1-7',p:'ص28–37',k:'نقص',t:'لا تمرينات في الصفحات؛ ولم تُنسخ الصور (برج الساعة ص28، الصحف والكتب ص33، زوايا ومدارس ص34–35، صور السنوسيين ص36–37).',r:'الأسئلة كلها من صياغة Claude من نص الدرس. وترتيب الصور عند الرفع كان مبعثرًا فرُتبت بحسب الأرقام (28 إلى 37) وكانت الصفحات العشر كاملة.'},
 {l:'g9-history-1-7',p:'ص28–30',k:'يحتاج مراجعة',t:'عنوان الدرس ينتهي 1912م بينما عنوان فترة الولاية في ص30 «1865–1911م»؛ وصفحة 29 تقول «اثنا عشر واليًا» دون تسمية غير أولهم وآخرهم.',r:'نُقل كما هو.'},
 {l:'g9-history-1-7',p:'ص30',k:'خطأ مطبعي',t:'كُتب «القرارات الثلاث» والمقصود غالبًا «القارات الثلاث».',r:'صُحّحت في الشرح إلى «القارات».'},
 {l:'g9-history-1-7',p:'ص30',k:'يحتاج مراجعة',t:'المخطط يربط «الوالي» و«مجلس الإدارة» بكلمتي «يرأسه» و«يعينه» واتجاه الأسهم غير واضح؛ والتسلسل السنجق/القضاء/الناحية (المتصرف/القائم مقام/المدير) رُسم من المخطط، وكذلك الأعضاء الطبيعيون والمنتخبون.',r:'رُسم جدولًا وسلسلة؛ راجع المخطط في الكتاب.'},
 {l:'g9-history-1-7',p:'ص31',k:'يحتاج مراجعة',t:'تاريخ تأسيس البلدية ومجلس العموم 1286هـ مقابل 1870م و1869م (السنة الهجرية تغطي العامين).',r:'نُقلت التواريخ كما في المخطط.'},
 {l:'g9-history-1-7',p:'ص32–33',k:'يحتاج مراجعة',t:'ص33 تتمة لفقرة ص32 (عبد الوهاب عبد الصمد بالآستانة)، والتعليق على صورة «طرابلس غرب» (القسم العربي بتحرير أحمد بن شتوان) لم يُدرج في النص. وصور ص33 توافق المذكور.',r:'أُضيف الهامش (1) في الشرح.'},
 {l:'g9-history-1-7',p:'ص34–35',k:'نص كما طُبع',t:'«بزليتن» (زليتن) كما طُبعت، وفي ص35 «مدرسة العرفان الخاصة» أُدرجت كما وردت.',r:'أُبقيت كما في الكتاب.'},
 {l:'g9-history-1-7',p:'ص36–37',k:'يحتاج مراجعة',t:'مخطط «الأسرة السنوسية» ص37: علاقة محمد الشريف (1846م) بأحمد الشريف وصفي الدين، وعلاقة المهدي بإدريس مأخوذتان من الخطوط؛ ولم يُنص في النص على أن محمد الشريف أخو المهدي. وصياغة «وقد كانت له كجده بعض المؤلفات» نُقلت بمعنى «له مؤلفات في التصوف»؛ واسم الرحلة كما طُبع «من الجغبوب إلى التاج» وهي رحلة من الجغبوب إلى الكفرة بحسب النص.',r:'اعرض الجدول كما في المخطط دون إضافة؛ وراجع الصياغة.'},
{l:'g9-history-1-8',p:'ص38–47',k:'يحتاج مراجعة',t:'وصلت الصور مبعثرة (38، 41، 40، 39، 42، 44، 45، 46، 43، 47) فرُتبت 38→47. ص44 صور فقط. ص45–47 هي «أسئلة الباب الأول» وقد أُدرجت في آخر أسئلة الدرس الثامن (لا درس مستقل لها) بإجابات من الدروس 1–8.',r:'إن أردت درسًا مستقلًّا لها أخبرني.'},
 {l:'g9-history-1-8',p:'ص45–46',k:'يحتاج مراجعة',t:'إجابات أسئلة الباب (س1 أ وب ود، س5، س6، س7، س8) استُخرجت من نص الدروس السابقة: جدد السوقين محمد باشا الإمام، إسكي شهر منحها علاء الدين السلجوقي، مراد آغا اتخذ تاجوراء، صياغة س6 من الدرس 6؛ وراجعها مع دليل المعلم.',r:'«أحمد القرماني» و«إلتفاف» و«آسكي شهر» أخطاء كتابية في السؤال أُبقيت كما طُبعت.'},
 {l:'g9-history-1-8',p:'ص39',k:'يحتاج مراجعة',t:'«الأراضي المتروكة» لم يُعرَّف في هامش الكتاب (الهوامش عرّفت الميري والوقف والموات فقط)، وكُتب «المشاعة» بين قوسين بعد «الميري».',r:'كتبت في الجدول «أراضٍ ذكرها القانون ضمن الأنواع» دون تعريف من عندي.'},
 {l:'g9-history-1-8',p:'ص38–39',k:'نقص',t:'لا تمرينات في صفحات الدرس (ص38–44)؛ الأسئلة من صياغة Claude عدا ما أُدرج من أسئلة الباب؛ ولم تُنسخ الصور (تجارة ريش النعام، دار القاضي، قصور نالوت وكاباو ومرزق، الجوامع).',r:'(47 سؤالًا من صياغتي + 11 من أسئلة الباب = 58).'}
];
</script>

<script>
/* ════════════════════════════════════════════════════════

const CONFIG = {

     {t:'fill',q:'..', a:'الإجابة'}              إكمال

const GRADE_NAMES = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر'];

/* تجميع المواد المسجَّلة من ملفات data-*.js */
Edu.subs.forEach(([gid,sub])=>{const g=DEFAULT_DB.grades.find(x=>x.id===gid);if(g)g.subjects.push(sub)});
