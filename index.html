<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنظومة التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#0f5c4a;--g2:#0a3d32;--gold:#c9a24b;--bg:#f6f4ee;--card:#fff;--tx:#1f2a27;--mut:#6b7772;--ok:#1b8a4b;--bad:#c0392b;--bd:#e3dfd3}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);line-height:1.9}
button,input,select,textarea{font-family:inherit;font-size:1rem}
/* ===== الهيدر ===== */
header{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;display:flex;align-items:center;gap:16px;padding:12px 20px;position:sticky;top:0;z-index:20}
.logo{width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;flex:none}
header h1{margin:0;font-size:1.25rem;font-weight:900}
header p{margin:0;font-size:.85rem;opacity:.85}
.hbtns{margin-inline-start:auto;display:flex;gap:8px}
.hb{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;cursor:pointer}
.hb:hover{background:var(--gold);color:#222}
#menuBtn{display:none}
/* ===== التخطيط ===== */
.wrap{display:flex;min-height:calc(100vh - 88px)}
aside{width:290px;background:var(--card);border-inline-end:1px solid var(--bd);padding:14px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;height:calc(100vh - var(--hh,88px));height:calc(100dvh - var(--hh,88px));position:sticky;top:var(--hh,88px);flex:none}
#shade{display:none}
main{flex:1;padding:22px;max-width:960px}
details{margin-bottom:6px}
summary{cursor:pointer;font-weight:700;padding:8px 10px;border-radius:8px;background:#f1efe6}
summary:hover{background:#e8e4d3}
.sub{margin:4px 14px 6px 0;font-weight:600;color:var(--g);padding:4px 6px}
.sd{margin:4px 0 4px 10px}.subs{background:#e4efea;color:var(--g);font-weight:700}
.flow{display:flex;flex-direction:column;align-items:center;gap:2px}
.fl{border:2px solid #1a3fa0;border-radius:12px;padding:8px 18px;min-width:70%;max-width:100%;text-align:center;font-weight:700;background:#f3f6ff}
.fa{color:var(--bad);font-weight:900;font-size:1.1rem}
.sh{display:inline-block;padding:6px 14px;border:2px solid #333;font-weight:700;text-align:center;min-width:70px;line-height:1.5}
.sh i{display:block;font-style:normal;transform:skew(20deg)}
.sh-oval{border-radius:50px;background:#f7e6f0;border-color:#4a9a4a}
.sh-io{transform:skew(-20deg);background:#d9f2d9;border-color:#2e8b2e}
.sh-proc{background:#bfe4fb;border-color:#2a7fc0}
.sh-dec{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#f6e05a;border:none;padding:22px 40px}
.sh-con{border-radius:50%;width:44px;height:44px;min-width:0;padding:0;background:#fff;border-color:#2a7fc0}
.les{display:block;width:100%;text-align:right;background:none;border:0;padding:6px 18px;border-radius:6px;cursor:pointer;color:var(--tx)}
.les:hover{background:#eef5f2}.les.on{background:var(--g);color:#fff}
.soon{color:var(--mut);font-size:.85rem;padding:4px 14px}
/* ===== المحتوى ===== */
.crumb{color:var(--mut);font-size:.9rem}
h2.t{font-size:1.7rem;font-weight:900;color:var(--g2);margin:4px 0 14px;border-inline-start:6px solid var(--gold);padding-inline-start:12px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{flex:1;min-width:110px;padding:10px;border:2px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer;font-weight:700}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 22px;margin-bottom:14px}
.card h3{margin:0 0 6px;color:var(--g);font-size:1.15rem}
.hadith{background:#f0f7f4;border:2px solid var(--g);border-radius:12px;padding:14px 18px;font-weight:600;font-size:1.1rem}
.ayah{color:#1a3fa0;font-weight:700;font-size:1.15rem;text-align:center;background:#f3f6ff;border-radius:10px;padding:10px}
.sum li{margin-bottom:6px}
.sum li::marker{color:var(--gold);font-weight:900}
.home{text-align:center;padding:30px 10px}
.home img{width:190px;height:190px;border-radius:50%;border:6px solid var(--gold);object-fit:cover;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.home h2{font-size:2rem;font-weight:900;color:var(--g2);margin:14px 0 4px}
/* ===== الأسئلة ===== */
.q{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.q.right{border-color:var(--ok);background:#f1faf4}.q.wrong{border-color:var(--bad);background:#fdf2f0}
.q b.n{color:var(--gold)}
.opt{display:block;padding:7px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer;background:#fff}
.opt:hover{background:#f4f1e4}
.opt.c{background:#d8f1e1;border-color:var(--ok)}.opt.x{background:#f9d9d4;border-color:var(--bad)}
.q input[type=text]{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px}
.ans{margin-top:8px;font-weight:700;color:var(--ok)}
.note{background:#fff3cd;border:1px solid #e0b84a;border-radius:8px;padding:8px 12px;margin-top:8px;font-weight:600}
.timer{position:sticky;top:var(--hh,88px);z-index:9;background:#fff8e1;border:2px solid var(--gold);border-radius:10px;padding:6px 14px;margin:8px 0;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.timer.low{background:#fdecea;border-color:var(--bad);color:var(--bad)}.timer b{font-size:1.25rem;letter-spacing:1px}
.score input.nm{width:92%;max-width:380px;text-align:center;background:rgba(255,255,255,.15);border:0;border-bottom:2px solid #fff;color:#fff;font-size:1.2rem;font-weight:700;margin-bottom:8px;padding:4px}
.score input.nm::placeholder{color:#e6e6e6}.score small b{color:#ffe08a}
.paper{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:22px;margin-bottom:16px;color:#000}
.paper h2{text-align:center;margin:6px 0;font-size:1.3rem}.paper h3.sec{margin:16px 0 4px;font-size:1.05rem;border-bottom:1.5px solid #333;padding-bottom:2px}
.paper input.pi{border:0;border-bottom:1px dashed #888;width:100%;text-align:center;font-size:1.15rem;font-weight:700;background:none;font-family:inherit}
.pmeta{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin:12px 0;font-weight:600}
.bl{display:inline-block;min-width:110px;border-bottom:1.5px solid #333;height:1em;vertical-align:baseline}
.pq{margin:7px 0;line-height:1.9}.popts{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:0 22px}
.lines{height:84px;background:repeating-linear-gradient(transparent,transparent 27px,#888 28px);margin:4px 22px 8px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px 10px}
.pctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:14px}
.pctl select{padding:6px;border:1px solid var(--bd);border-radius:8px}
.grp{margin:22px 0 8px;color:var(--g2);border-bottom:2px solid var(--gold);padding-bottom:4px;font-size:1.15rem}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:14px 0}
.mode{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--g);background:#f1f8f5}.mode b{font-size:1.1rem;color:var(--g2)}.mode span{color:var(--mut);font-size:.9rem}.mode em{font-style:normal;font-weight:700;color:var(--g)}
.meter{height:10px;background:#e6e3d6;border-radius:6px;overflow:hidden;min-width:90px}.meter i{display:block;height:100%;background:var(--ok)}.meter.low i{background:var(--bad)}
.idx-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
.idx-table th{background:var(--g);color:#fff;padding:8px;text-align:right}
.idx-table td{border-bottom:1px solid var(--bd);padding:8px}
.idx-table tr.off td{color:var(--mut);background:#f4f2ea}
.idx-table tr:not(.off):hover td{background:#eef5f2}
.bdg{display:inline-block;padding:2px 12px;border-radius:20px;font-weight:700;font-size:.9rem;background:#eee;color:var(--tx)}
.bdg.ok{background:#d8f1e1;color:#146c3a}.bdg.no{background:#e6e6e6;color:#666}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ans.model{background:#fff8e1;border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;color:var(--tx);font-weight:600}
.q textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;min-height:80px}
.btn{background:var(--g);color:#fff;border:0;padding:10px 22px;border-radius:10px;cursor:pointer;font-weight:700}
.btn.gold{background:var(--gold);color:#222}.btn.red{background:var(--bad)}
.btn:hover{filter:brightness(1.1)}
.score{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:14px;padding:16px;text-align:center;font-size:1.3rem;font-weight:900;margin-top:12px}
.score small{display:block;font-weight:400;font-size:.95rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
/* ===== الإدارة ===== */
.hint{font-size:.82rem;color:var(--mut);background:#faf8f0;padding:6px 10px;border-radius:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 22px;border-radius:30px;display:none;z-index:99}
/* ===== جوال ===== */
@media(max-width:800px){
 #menuBtn{display:block}
 aside{position:fixed;top:calc(var(--hh,88px) + 10px);bottom:0;height:auto;padding-top:22px;padding-bottom:120px;right:0;z-index:15;transform:translateX(100%);transition:.25s;box-shadow:-4px 0 20px rgba(0,0,0,.2);width:280px}
 aside.open{transform:none}
 #shade.on{display:block;position:fixed;inset:0;top:var(--hh,88px);background:rgba(0,0,0,.4);z-index:14}
 main{padding:14px}.hbtns .hb span{display:none}
}
/* ===== طباعة ===== */
@media print{
 header,aside,.tabs,.bar,#toast,.noprint,.timer{display:none!important}
 @page{margin:14mm}
 .tabpane.xtra{display:none!important}
 .paper{border:0;padding:0;font-size:13pt}.pq,.keyrow{break-inside:avoid}
 #paperKey{break-before:page}
 body[data-print=q] #paperKey{display:none!important}
 body[data-print=k] #paperQ{display:none!important}
 body[data-print=k] #paperKey{break-before:auto}
 body{background:#fff}.wrap{display:block}main{max-width:none;padding:0}
 .card,.q{break-inside:avoid;border:1px solid #999}.tabpane{display:block!important}
}
.nt-les{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0 8px;padding:8px 12px;background:#e8eef9;border-radius:10px}.nt-les b{font-size:1rem}.nt{border:1px solid #dcdcdc;border-right:4px solid #c0392b;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}.nt .top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.nt p{margin:4px 0;line-height:1.8}.nt .rs{color:#555;font-size:.93rem}
</style>
</head>

    <button class="hb" id="menuBtn">☰</button>

</header>

<div class="wrap">
  <aside id="side"></aside>
  <div id="shade" onclick="App.closeMenu()"></div>

</div>

<div id="toast"></div>

<!-- ملفات المواد: أضف سطرًا لكل مادة جديدة، وارفع رقم v عند تعديل الملف ليتحدث عند الطلاب -->
<script>
/* ═══════════════════════════════════════════════════════
   بيانات مادة: التربية الإسلامية — الصف التاسع
   كل مادة في ملف مستقل. يُحمَّل من index.html قبل السكربت الرئيسي.

Edu.add('g9',{
  id:'g9-islamic', name:'التربية الإسلامية', lessons:[{
    id:'g9-islamic-1', title:'الحديث الأول: أكبر الكبائر',
    explain:`
<div class="card"><h3>تعريف</h3>
<p>يوجّه الرسول ﷺ أصحابه ومن بعدهم أمّته إلى طلب العلم، باتّباع أساليب تعليمية لها أثرها في المتلقّي، ومن بينها <b>طرح الأسئلة</b> بقصد تشويق السامعين وشدّ انتباههم، ثم يجيبهم عنها بما يحقق الأهداف المطلوبة، وهي ترسيخ مبادئ الدين في الأذهان، وتطبيق أوامر الله واجتناب نواهيه وفي مقدمتها الكبائر.</p></div>

<div class="card"><h3>نص الحديث</h3>
<div class="hadith">عن عبد الرحمن بن أبي بكرة -رضي الله عنه- قال: قال النبي ﷺ: «ألا أنبّئكم بأكبر الكبائر؟» ثلاثًا. قالوا: بلى يا رسول الله، قال: «الإشراك بالله، وعقوق الوالدين» وجلس وكان متكئًا، فقال: «ألا وقول الزور» فمازال يكررها حتى قلنا: ليته سكت. <small>(رواه البخاري)</small></div></div>

<div class="card"><h3>معاني المفردات</h3><ul>
<li><b>أنبّئكم:</b> أخبركم وأعلمكم.</li>
<li><b>أكبر الكبائر:</b> أعظم الذنوب التي تجلب غضب الله وتوجب عقوبته.</li>
<li><b>الإشراك بالله:</b> أن تجعل لله ندًّا أو شريكًا.</li>
<li><b>عقوق الوالدين:</b> عصيانهما والإساءة إليهما.</li>
<li><b>الزور:</b> الكذب.</li></ul></div>

<div class="card"><h3>المعنى الإجمالي</h3>
<p><b>١. التوحيد أساس العبادة:</b> جاء الإسلام لتخليص العقول من براثن الشرك والجاهلية، فقد كان الإنسان يعبد الأصنام والأحجار والكواكب. وهذا الاعتقاد أعظم الذنوب، لا يغفره الله، ويوجب عقوبته ويحبط عمل صاحبه.</p>
<div class="ayah">﴿ إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ ﴾ [النساء: 116]</div>
<p><b>٢. بر الوالدين وطاعتهما من طاعة الله، وعصيانهما من أكبر الآثام:</b> فهما أقرب الناس إلى العبد، وطاعتهما يُثاب عليها وينال بها رضا الله وسعادة الدنيا والآخرة، أما عصيانهما والإساءة إليهما ولو بأقل تصرّف فهو جريرة عظيمة تجلب غضب الله وعقوبته. وقد سُئل النبي ﷺ: من أحق الناس بحسن صحابتي؟ فقال: «أمك» ثلاثًا، ثم قال: «ثم أبوك» (متفق عليه).</p>
<div class="ayah">﴿ وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا ﴾ [الإسراء: 23]</div>
<p><b>٣. قول الحق والبعد عن الكذب من أهم صفات المؤمنين:</b> الكذب والبهتان يهدمان شخصية الإنسان ويضيّعان الحقوق، خصوصًا شهادة الزور في قاعات المحاكم، والمسلم شجاع لا يقول إلا الحق ولا يخشى في الله لومة لائم. ولذلك كرّر الرسول ﷺ التحذير منها حتى تمنّى الصحابة سكوته شفقةً عليه.</p>
<div class="ayah">﴿ فَاجْتَنِبُوا الرِّجْسَ مِنَ الْأَوْثَانِ وَاجْتَنِبُوا قَوْلَ الزُّورِ ﴾ [الحج: 28]</div></div>

<div class="card"><h3>ما يرشد إليه الحديث من توجيهات</h3><ol>
<li>حرص الرسول ﷺ على تعليم الصحابة أمور دينهم.</li>
<li>استعداد الصحابة وسرعة استجابتهم دليل على قوة إيمانهم.</li>
<li>على المسلم تجنّب كل مظاهر الشرك في القول والعمل.</li>
<li>بر الوالدين وطاعتهما واجب ديني وعمل أخلاقي.</li>
<li>حقوق المسلم لا يجوز المساس بها أو تضييعها.</li>
<li>شفقة الصحابة واحترامهم للنبي ﷺ درس لطالب العلم في احترام أصحاب العلم والفضل.</li></ol></div>
`,
    extra:`
<div class="card"><h3>من الأذكار النبوية: عند الكرب أو الشدة</h3>
<div class="hadith">لا إله إلا الله العظيم الحليم، لا إله إلا الله رب العرش العظيم، لا إله إلا الله رب السموات ورب الأرض رب العرش الكريم. <small>(صحيح البخاري 6345، ومسلم 2730)</small></div></div>`,
    summary:[
      'الحديث يرويه <b>عبد الرحمن بن أبي بكرة</b> رضي الله عنه، ورواه <b>البخاري</b>.',

      {t:'mcq',q:'من راوي الحديث؟',o:['أبو هريرة','أنس بن مالك','عبد الرحمن بن أبي بكرة','ابن عمر'],a:2},

    id:'g9-islamic-2', title:'من دروس العقيدة: صفة العلم',
    explain:`
<div class="card"><h3>من صفات الله تعالى</h3>
<p>الله تعالى متّصف بصفات يجب الإيمان بها، والاعتراف بأنه وصف نفسه سبحانه، والتصديق بأنه منفرد بها لا يشبهه أحد من خلقه في صفة من صفاته، فهو سبحانه متصف بكل صفات الكمال، ومنزّه عن كل صفات النقص.</p></div>

<div class="card"><h3>مدخل الموضوع</h3>
<p>من صفات الكمال الواجبة لله تعالى <b>صفة العلم</b>، وعلم الله لا يساويه علم؛ فهو علم <b>إحاطة وإدراك</b> لجميع ما في الكون الفسيح: صغيره وكبيره، ظاهره وباطنه، دقيقه وعظيمه، قريبه وبعيده. فهو سبحانه يعلم ما حدث وما يحدث وما سيحدث. وعلم الله قديم كامل شامل للجزئيات والكليّات، لا نهاية له، ولا يحدّه زمان ولا مكان.</p>
<div class="ayah">﴿ وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ وَيَعْلَمُ مَا فِي الْبَرِّ وَالْبَحْرِ وَمَا تَسْقُطُ مِن وَرَقَةٍ إِلَّا يَعْلَمُهَا وَلَا حَبَّةٍ فِي ظُلُمَاتِ الْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِي كِتَابٍ مُّبِينٍ ﴾ [الأنعام: 60]</div></div>

<div class="card"><h3>دلائل اتصافه تعالى بصفة العلم</h3>
<p>إذا نظرنا إلى هذا الكون الفسيح وما فيه من مخلوقات، وما اشتمل عليه من صنع عجيب، ونظام بديع، وترتيب دقيق، فلا اختلال ولا اضطراب فيه، أيقنّا أن خالقه عالم بكل أسراره، مطّلع على كل خفاياه، محيط بأدق تفاصيله، عالم بجميع جوانبه الكلية والجزئية، وهذا العلم والاطلاع والإحاطة قديم شامل كامل مستمر.</p>
<div class="ayah">﴿ وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا ﴾ [الطلاق: 12]</div><br>
<div class="ayah">﴿ لَا يَعْزُبُ عَنْهُ مِثْقَالُ ذَرَّةٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ وَلَا أَصْغَرُ مِن ذَٰلِكَ وَلَا أَكْبَرُ إِلَّا فِي كِتَابٍ مُّبِينٍ ﴾ [سبأ: 3]</div></div>

<div class="card"><h3>ثمرة الإيمان بعلم الله: المحاسبة</h3>
<p>ويوم القيامة سيحاسب الله تعالى الناس على أعمالهم في الدنيا ويجازيهم عليها، إن كانت خيرًا فخير، وإن كانت شرًّا فشر. وهذا يؤكد أن الله تعالى عالم بها، ومحيط بكل تفاصيلها، ومطّلع على صغيرها وكبيرها.</p>
<div class="ayah">﴿ فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ۞ وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ ﴾ [الزلزلة: 8-9]</div></div>

<div class="card"><h3>واجبنا نحو الله العليم</h3>
<p>يجب علينا أن نؤمن إيمانًا لا شك فيه بأن الله تعالى متّصف بصفة العلم، ونصدّق بأن علمه علم إحاطة وتقدير لكل الموجودات، وكامل شامل للكليّات والجزئيات، وأنه قديم لا يحدّه مكان ولا زمان، ولا يلحقه نقص، ولا يغيب عن علمه شيء في الأرض ولا في السماء.</p></div>

    id:'g9-islamic-3', title:'من دروس العبادات: سجود السهو في صلاة الفرض',
    explain:`
<div class="card"><h3>تعريفه</h3>
<p>هما <b>سجدتان</b> يسجدهما الساهي في صلاته لجبر نقص، أو زيادة، أو كليهما معًا، بكيفية مخصوصة.</p>
<p><b>حكمه:</b> سنّة مؤكدة، سواء كان قبليًا أو بعديًا.</p>
<p><b>أنواعه:</b> سجود السهو نوعان: <b>قبلي</b> ويؤدّى قبل السلام، و<b>بعدي</b> ويؤدّى بعد السلام.</p>
<p>ويجبر سجود السهو نقصان <b>السنن</b>، ولا يجبر نقصان فرض من فرائض الصلاة.</p></div>

<div class="card"><h3>النوع الأول: السجود القبلي</h3>
<p><b>صورته:</b> أن يسجد المصلّي بعد التشهد الأخير وقبل السلام سجدتين، يكبّر عند السجود والرفع منه، ثم يقرأ نصف التشهد ويسلّم.</p>
<h3>ما يُسجد له قبل السلام</h3><ol>
<li>ترك قراءة ما زاد على الفاتحة فيما يسنّ فيه ذلك.</li>
<li>ترك الجهر فيما يجهر فيه.</li>
<li>ترك تكبيرتين أو أكثر عدا تكبيرة الإحرام.</li>
<li>ترك تسميعتين أو أكثر.</li>
<li>ترك التشهد الأول والجلوس له.</li></ol></div>

<div class="card"><h3>النوع الثاني: السجود البعدي</h3>
<p><b>صورته:</b> أن يسجد المصلّي بعد السلام سجدتين يكبّر عند السجود والرفع منه، ثم يقرأ نصف التشهد، ويسلّم مرة أخرى.</p>
<h3>ما يُسجد له بعد السلام</h3><ol>
<li>القراءة جهرًا فيما يسرّ فيه.</li>
<li>زيادة ركعة أو سجدة أو سلام في غير موضعه سهوًا.</li>
<li>زيادة أقلّ من مثل عدد ركعات الصلاة سهوًا، مثل أن يصلّي الظهر سبعًا، فإن زاد مثل عدد ركعات الصلاة بطلت صلاته.</li>
<li>إذا تكلّم المصلّي في الصلاة لغير إصلاحها سهوًا.</li>
<li>تكرار الفاتحة في ركعة واحدة سهوًا، فإن كرّرها عمدًا أثم ولا سجود عليه ولا تبطل صلاته.</li>
<li>شكّ المصلّي في عدد ما صلّى من ركعات الصلاة، أثلاثًا أم أربعًا مثلًا في الرباعية، فإنه يبني على الأقل ويسجد بعد السلام ما لم يلازمه الشك، وإلا فإنه يبني على الأكثر ويسجد بعد السلام.</li></ol></div>

<div class="card"><h3>أحكام أخرى</h3><ol>
<li>إذا تكرّر السهو أكثر من مرة في الصلاة من نوع واحد أو أكثر مما ذُكر، فليس عليه إلا <b>سجود واحد قبلي</b> فقط.</li>
<li>ترك شيء مما سبق وزيادة فعل من أفعال الصلاة سهوًا، مثل أن يترك المصلّي التشهد الأول ويجلس للتشهد بعد الركعة الثالثة في الصلاة الرباعية.</li></ol>
<div class="hadith"><b>قاعدة:</b> إذا اجتمع للمصلّي نقصان في السنن المؤكدة السابقة الذكر وزيادة في فعل من أفعال الصلاة، غلّب جانب النقص على الزيادة، وسجد <b>قبل السلام</b>.</div></div>

<div class="card"><h3>حكم تقديم السجود البعدي، وتأخير السجود القبلي عمدًا</h3>
<p>إن قدّم المصلّي السجود البعدي صحّت صلاته مع الإثم، وأما إن أخّر السجود القبلي صحّت صلاته كذلك مع الكراهة.</p></div>

<div class="card"><h3>سهو المأموم مع الإمام</h3>
<p>لو سها المأموم عن سنن الصلاة فإن <b>الإمام يحملها عنه</b>، ولا سجود على المأموم.</p></div>

<div class="card"><h3>المسبوق في حال سهو الإمام في الصلاة</h3>
<p>من أدرك ركعة مع الإمام فأكثر لزمه كل سجود ترتّب على الإمام، ولو لم يحضر سهوه أو لم يقع منه سهو معه.</p>
<ul><li>إن كان السجود <b>قبليًا</b>: سجده مع الإمام قبل قيامه لقضاء ما فاته.</li>
<li>إن كان <b>بعديًا</b>: لم يسجد مع إمامه، بل يقوم بعد سلام الإمام للإتيان بما فاته من الركعات، ثم يسجد وحده بعد سلامه من الصلاة.</li></ul></div>

    id:'g9-islamic-4', title:'من دروس السيرة: المربّي الحكيم ﷺ',
    explain:`
<div class="card"><h3>التمهيد</h3>
<p>أعدّ الله سبحانه وتعالى محمدًا ﷺ ليكون حامل رسالة وداعيًا إلى الله بإذنه وسراجًا منيرًا، وهيّأه لأن يكون مربّيًا حكيمًا ومعلّمًا فاضلًا، يدعو إلى سبيل ربه بالحكمة والموعظة الحسنة، ومنحه الخبرة بالنفوس والبصر بأدوائها والقدرة على علاجها.</p>
<p>وشهد بذلك <b>صفوان بن أمية</b> الذي أسلم عقب غزوة حنين، عندما قال: «إن الله علّمه كيف يداوي القلوب المريضة».</p>
<p>فقد داوى النبي ﷺ قلوب الصحابة، فطهّرها من أدران الشرك، وغسلها بنور الإيمان، ورسم لهم المنهج السليم الذي تلقّاه عن ربه، وأعدّهم لتحمّل أعباء الدعوة، فشهد لهم التاريخ بأعظم التضحيات وأندر البطولات، وكان ﷺ لهم القدوة الحسنة والأسوة الخيّرة.</p></div>

<div class="card"><h3>١. في أسرته</h3>
<p>كان ﷺ مثالًا للمربّي الفاضل في أسرته: يتفقّد شؤون أهله ويرعاهم، ويعطف على أولاده، ويعمل على تنشئتهم التنشئة السليمة، ويغمرهم بعطفه وحنانه.</p>
<div class="hadith">عن أنس رضي الله عنه قال: دخلنا مع رسول الله ﷺ على أبي سيف القين، وكان ظئرًا لإبراهيم، فأخذ رسول الله ﷺ إبراهيم فقبّله وشمّه... فجعلت عينا رسول الله ﷺ تذرفان، فقال له عبد الرحمن بن عوف: وأنت يا رسول الله! فقال: «يا ابن عوف إنها رحمة»، ثم أتبعها بأخرى فقال: «إن العين تدمع والقلب يحزن، ولا نقول إلا ما يرضي ربنا، وإنا بفراقك يا إبراهيم لمحزونون». <small>(أخرجه البخاري)</small></div><br>
<div class="hadith">وعن عبد الله بن شدّاد عن أبيه قال: خرج علينا رسول الله ﷺ في إحدى صلاتي العشيّ (الظهر أو العصر) وهو حامل حسنًا أو حسينًا، فوضعه ثم كبّر للصلاة فصلّى، فسجد بين ظهراني صلاته سجدة أطالها... فلما قضى صلاته قال الناس: إنك سجدت سجدة أطلتها حتى ظننا أنه قد حدث أمر! فقال: «كل ذلك لم يكن، ولكن ابني ارتحلني فكرهت أن أعجّله حتى يقضي حاجته». <small>(رواه النسائي)</small></div><br>
<div class="hadith">وعن أبي هريرة رضي الله عنه قال: قبّل رسول الله ﷺ الحسن بن علي، فقال الأقرع بن حابس: إن لي عشرة من الولد ما قبّلت منهم أحدًا، فقال النبي ﷺ: «من لا يرحم لا يُرحم». <small>(أخرجه البخاري)</small></div>
<p>وقد جعل ﷺ مسؤولية الأسرة منوطة بربّ الأسرة عندما قال: «كلكم راعٍ وكلكم مسؤول عن رعيّته» (أخرجه البخاري)، ومن المسؤولية: العطف والحنان والرحمة.</p>
<p>لكن مع كل مظاهر الرحمة كان ﷺ يحثّ على <b>التوسّط في الأمور</b>، ومنها التربية، فلا إفراط في المحبة حتى ينشأ الفرد مدلّلًا ضعيفًا، ولا تفريط حتى لا يرى الفرد غير القسوة والشدة، بل رحمة وحنان وشفقة وبرّ وتعليم وتوجيه وتربية وإرشاد، فإذا تطلّب الموقف بعض الشدة في غير عنف كان كذلك، وإلا فالتوجيه والإرشاد.</p>
<div class="hadith">عن عمر بن أبي سلمة ربيب رسول الله ﷺ قال: كنت غلامًا في حجر رسول الله ﷺ وكانت يدي تطيش في الصحفة، فقال لي رسول الله ﷺ: «يا غلام سمِّ الله تعالى، وكُل بيمينك، وكُل مما يليك»، فما زالت تلك طعمتي بعد. <small>(أخرجه البخاري)</small></div></div>

<div class="card"><h3>٢. تربيته ﷺ لجميع الأمة</h3>
<p>كان رسول الله ﷺ يعدّ المسلمين جميعًا أسرته الكبرى، فما يقدّمه من نصح إنما هو موجّه للمسلمين جميعًا، وما يقوم به من فعل إنما هو ليتأسّى به المسلمون جميعًا؛ لذلك كان الصحابة يحرصون أشدّ الحرص على مجالسة الرسول ﷺ ومشاهدة ما يقوم به من عمل، وسماع كل كلمة تنبس بها شفتاه الشريفتان، ثم يطبّقون ذلك في حياتهم الخاصة والعامة.</p>
<div class="hadith">عن أنس بن مالك رضي الله عنه أنه كان يقول: «ما صلّيت وراء إمام قط أخفّ صلاة ولا أتمّ من النبي ﷺ، وإن كان ليسمع بكاء الصبي فيخفّف مخافة أن تُفتَن أمه». <small>(أخرجه البخاري)</small></div><br>
<div class="hadith">وعن عبد الله بن عامر قال: دخل رسول الله ﷺ على أمي وأنا غلام، فأدبرتُ خارجًا، فنادتني أمي: يا عبد الله تعال، هاك. فقال لها النبي ﷺ: «ما تعطيه؟» قالت: أعطيه تمرًا. قال: «أما إنك لو لم تفعلي كُتبت عليك كذبة». <small>(رواه أبو داود)</small></div>
<p>وفي مسند الإمام أحمد عن أبي هريرة رضي الله عنه عن رسول الله ﷺ أنه قال: «من قال لصبي تعال، هاك، ثم لم يعطه فهي كذبة».</p>
<p>هكذا كان رسول الله ﷺ مربّيًا حكيمًا في خاصة بيته وعموم المسلمين، يفيض قلبه عطفًا ورحمة، فينعكس ذلك على أفعاله، ويتوجّه بأقواله الصادقة إلى المسلمين كافة، فيجدون فيها أصول التربية السليمة التي ترتكز على القدوة في السلوك، وعلى الصدق في القول، حيث لا إفراط ولا تفريط.</p></div>

<div class="card"><h3>معاني المفردات</h3><ul>
<li><b>القَين:</b> الحدّاد.</li>
<li><b>الظِّئر:</b> المرأة التي تعطف على ولد غيرها أو ترضعه، ويطلق على زوج المرأة التي ترضع غير ولدها.</li>
<li><b>يجود بنفسه:</b> تخرج روحه عند الموت.</li>
<li><b>تطيش:</b> تلوح هنا وهناك.</li>
<li><b>الصحفة:</b> إناء الأكل.</li></ul></div>

    id:'g9-islamic-5', title:'من دروس التهذيب والأخلاق: الإسلام يحارب السلوك السيّئ (الجزء الأول)',
    explain:`
<div class="card"><h3>تمهيد</h3>
<p>بعث الله رسوله محمدًا ﷺ برسالة الإسلام الخالدة، فجاءت تعاليمها شاملة لكل ما من شأنه السموّ بالإنسان في جميع جوانب حياته. وكان أول مهام تلك الرسالة <b>تحرير الإنسان</b> من أسر العبودية لغير الله، وتحرير فكره وعقله لينظر في مشاهد الكون ويتدبّر آيات الله فيه. ثم كانت مهمة <b>إصلاح المجتمع</b>، حيث عمل الإسلام على محاربة البدع والضلالات، ونفّر من خرافات الجاهلية وأباطيلها وعاداتها التي تعود على الفرد والمجتمع بالضرر.</p>
<p>والضرر قد يكون <b>جسميًّا</b> يضعف البدن ويؤدي إلى التهلكة، وقد يكون <b>ماليًّا</b> يؤدي إلى ارتكاب جرائم أخرى كالسرقة والاختلاس، وقد يكون جسميًّا وماليًّا معًا، مما يجعل الإنسان ضعيفًا لا يقوى على أداء واجبه تجاه ربه وأسرته ومجتمعه. والإسلام لا يرضى أن يكون أبناؤه ضعفاء تنخر الأمراض أجسادهم، وتفرغ الآفات جيوبهم، فيعيشون عالة على غيرهم أو يموتون بأمراض فتّاكة. ومن بين تلك الأمراض ما يكون نتيجة للتدخين وتناول المخدرات والمسكرات، لذلك نجد الإسلام ينفّر منها ويحرّمها.</p></div>

<div class="card"><h3>أولًا: التدخين</h3>
<p>يظن بعض الناس أن التدخين وسيلة من وسائل الترفيه عن النفس، وتناسوا أنهم يُدخلون إلى أجسامهم سمومًا لا تؤثّر في الجهاز التنفسي فقط، وإنما على كل أجهزة الجسم؛ لأن مادة الدخان مركّبة من عدة عناصر كيميائية وطبيعية لها تأثيرات خطيرة، من بينها:</p>
<ol>
<li>تخدير الدماغ وتعطيل وظيفته.</li>
<li>الإصابة بعدة سرطانات في الرئتين والحنجرة والقصبة الهوائية.</li>
<li>أمراض الأوعية الدموية والقلب.</li>
<li>زيادة الإصابة بالذبحة الصدرية التي تؤدي إلى الموت المفاجئ.</li>
<li>تصلّب الشرايين الذي يعدّ أحد أسباب السكتة الدماغية القاتلة.</li></ol>
<p>مضافًا إلى ذلك الأموال التي تُصرف فيه، والتي تعدّ من <b>الإسراف والتبذير</b> اللذين ينهى عنهما الإسلام.</p>
<div class="ayah">﴿ يَا بَنِي آدَمَ خُذُوا زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٍ وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا إِنَّهُ لَا يُحِبُّ الْمُسْرِفِينَ ﴾ [الأعراف: 29]</div><br>
<div class="ayah">﴿ إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا ﴾ [الإسراء: 27]</div><br>
<div class="ayah">﴿ إِنَّ اللَّهَ لَا يَهْدِي مَنْ هُوَ مُسْرِفٌ كَذَّابٌ ﴾ [غافر: 28]</div>
<p>زد على ذلك أن المدخّن يصير ذا رائحة كريهة تنفّر منه الآخرين، وكثيرًا ما يُضطر إلى الجلوس وحيدًا لأنه يدرك أن التدخين يؤذي الجالسين. ومن أجل ذلك نجد الإسلام يحارب عادة التدخين لما فيها من ضرر بالبدن والمال؛ إذ ليس من الحكمة والعقل أن يجلب الإنسان لنفسه الخسارة والأمراض. وقد تفطّن لذلك كثير من المدخّنين فأقلعوا عنه وتخلّصوا منه بكل سهولة ويسر.</p></div>

<div class="card"><h3>ثانيًا: المخدّرات</h3>
<p>نوع آخر من الآفات الضارّة بجسم الإنسان وماله، لا يُقبل عليها صاحب عقل، ولا يتعاطاها إلا من أراد الانتحار؛ ذلك أن المخدرات تسبّب:</p>
<ol>
<li><b>تخدير الدماغ وتعطيل وظائفه</b>، وذلك بوصولها إلى الجهاز العصبي.</li>
<li><b>الإدمان</b> بحيث يعتادها الجسم، فإذا لم يتحصّل عليها في أوقاتها أصبح المتعاطي في حالة تشبه الجنون مما يؤدّي به إلى ارتكاب جرائم القتل والسرقة وغيرها، بالإضافة إلى حالات الحزن والاكتئاب التي تسيطر عليه.</li>
<li><b>انتقال الأمراض المعدية</b> التي تنتج عن المخالطة بين متعاطي المخدرات، مثل: مرض نقص المناعة المكتسبة (الإيدز)، والتهابات الكبد الفيروسية، والتهابات أجهزة التنفس، وغير ذلك مما هو ثابت في الطب.</li>
<li><b>الحالة السيئة</b> التي يصل إليها متعاطي المخدرات من إهمال العناية بالنظافة، والغذاء الجيد مما يؤدي إلى الضعف والهزال والتعرّض لكل الأمراض.</li>
<li><b>خسائر مالية</b>؛ وكان الأولى أن ينفقها الإنسان على نفسه، يبني بها بيتًا، أو يكوّن بها أسرة، أو ينفقها على مشروع تجاري يستفيد منه.</li></ol>
<p>من أجل هذا حاربها الإسلام محاربة عنيفة، وشدّد النهي عن الاتجار بها لأن ثمنها يُعدّ مالًا حرامًا، وعن تعاطيها لأن المتعاطي يلقي بنفسه إلى هاوية الهلاك، والله تعالى يقول:</p>
<div class="ayah">﴿ وَلَا تَقْتُلُوا أَنفُسَكُمْ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا ﴾ [النساء: 29]</div>
<p>وقد أدركت الدول خطر المخدرات فسنّت لها قوانين صارمة تصل عقوبتها إلى <b>الإعدام</b>، حفاظًا على صحة أبنائها واقتصادها.</p></div>

<div class="card"><h3>ثالثًا: الخمر</h3>
<p>من الآفات الضارة التي حاربها الإسلام شرب الخمر، ذلك لأن الخمر يذهب العقل، فلا يميّز شاربها بين الخير والشر، وبين النافع والضار. وكثيرًا ما تؤدي الخمر بصاحبها إلى ارتكاب المآثم والجرائم، ولذلك أُطلق على الخمر: <b>أمّ الخبائث</b>. وإلى جانب ذلك فيها إتلاف للمال وإسراف في غير محلّه. وتتلخّص مضارّ شرب الخمر في الآتي:</p>
<ol>
<li><b>الضرر البدني</b> المتمثل في ذهاب العقل وتعطيل وظيفة الدماغ.</li>
<li>الإصابة ببعض الأمراض المتعلقة بأجهزة التنفس.</li>
<li>ارتكاب الجرائم والأخطاء التي قد تكون قاتلة، كالشجار وحوادث السيارات.</li>
<li>تشتيت الأسر وترك الأبناء مشرّدين.</li>
<li>الإسراف وتبذير المال، وهو ما ينهى عنه الإسلام.</li></ol>
<p>من أجل ذلك حرّم الإسلام الخمر <b>بيعًا وشراءً وصناعةً وتعاطيًا</b>. قال تعالى:</p>
<div class="ayah">﴿ يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّمَا الْخَمْرُ وَالْمَيْسِرُ وَالْأَنصَابُ وَالْأَزْلَامُ رِجْسٌ مِّنْ عَمَلِ الشَّيْطَانِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَ ﴾ [المائدة: 92]</div>
<div class="hadith">وقال ﷺ: «مدمن الخمر إن مات لقي الله كعابد وثن». <small>(رواه أحمد)</small></div><br>
<div class="hadith">وقال ﷺ: «كل مسكر حرام، إن على الله عهدًا لمن يشرب المسكر أن يسقيه من طينة الخبال». قالوا: يا رسول الله، وما طينة الخبال؟ قال: «عرق أهل النار أو عصارة أهل النار» (يعني قيحهم وصديدهم). <small>(صحيح مسلم، كتاب الأشربة)</small></div></div>

<div class="card"><h3>مدخل الموضوع</h3>
<p>إن الله تعالى <b>واحد في ذاته</b>، فلا شريك له ولا مثيل له ولا شبيه، <b>ومنفرد في صفاته</b>، فلا يشبهه أحد من خلقه في صفة من صفاته. يقول سبحانه وتعالى:</p>
<div class="ayah">﴿ لَيْسَ كَمِثْلِهِ شَيْءٌ وَهُوَ السَّمِيعُ الْبَصِيرُ ﴾ [الشورى: 9]</div>
<p>فهو سبحانه متّصف بكل صفات الكمال، ومنزّه عن كل صفات النقصان، وكل ما يخطر على بال الإنسان فالله مخالف له؛ فعلمه ليس كعلم غيره من المخلوقات، وسمعه ليس كسمعهم، وبصره ليس كبصرهم. وكل ما ثبت في الكتاب والسنة من الصفات الواجب إثبات معناها على الوجه اللائق به، مع <b>تفويض العلم بكيفيتها</b> إلى الله تعالى.</p></div>

<div class="card"><h3>دلائل تؤكد أن الله تعالى ليس كمثله شيء</h3>
<p>١. إذا علم الإنسان سرًّا من أسرار هذا الكون فالله هو الذي وفّقه لذلك؛ لأن الله تعالى خلق الكون ويعلم كل أسراره منذ خلقه. فعلم الإنسان <b>متجدد حادث، محدود بالزمان والمكان، مسبوق بجهل</b>، أما علم الله تعالى فهو علم <b>كامل شامل قديم</b>، لا يحدّه زمان ولا مكان، ولا يسبقه جهل، ولا يلحقه نقص.</p>
<p>٢. وإذا سمع الإنسان خبرًا كان غائبًا عنه فالله هو الذي أراد ذلك؛ لأن الله تعالى يعلمه قديمًا قبل وقوعه. وإذا رأى الإنسان شيئًا لم يعهده ولم تكن له دراية به، فالله هو الذي مكّنه من ذلك؛ لأنه تعالى هو من أوجده وخلقه.</p>
<p>٣. إن الله تعالى هو الذي أوجد وخلق كل المخلوقات، ويملك أمرها، ويعلم أسرارها، ويتصرّف فيها ويدبّر شأنها، وهذه المخلوقات هي التي تحتاج إليه ولا تستطيع الاستغناء عنه:</p>
<ul><li>هي <b>المخلوقة</b> وهو <b>الخالق</b>.</li><li>هي <b>الضعيفة</b> وهو <b>القوي</b>.</li><li>هي <b>المحتاجة</b> وهو <b>الغني</b>.</li><li>هي <b>الزائلة</b> وهو <b>الباقي</b>.</li><li>هي <b>الذليلة</b> وهو <b>العزيز</b>.</li></ul>
<p>فالله سبحانه وتعالى مخالف لها ومغاير لها، لا تشبهه ولا تماثله في شيء. يقول تعالى:</p>
<div class="ayah">﴿ قُلْ هُوَ اللَّهُ أَحَدٌ ۞ اللَّهُ الصَّمَدُ ۞ لَمْ يَلِدْ وَلَمْ يُولَدْ ۞ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴾ [الإخلاص: 1-4]</div></div>

<div class="card"><h3>واجبنا نحو الله تعالى الذي ليس كمثله شيء</h3>
<p>يجب علينا أن نؤمن إيمانًا لا شك فيه بأن الله تعالى <b>واحد في ذاته</b>، فلا شريك له ولا مثيل ولا شبيه، و<b>منفرد في صفاته</b>، فلا يشبهه أحد من خلقه في صفة من صفاته، وبأنه متّصف بكل صفات الكمال ومنزّه عن كل صفات النقصان.</p></div>

    id:'g9-islamic-7', title:'من دروس السيرة: القائد الرشيد ﷺ',
    explain:`
<div class="card"><h3>١. رسم الخطط والاستعداد للقتال</h3>
<p>هيّأ الله سبحانه وتعالى رسوله محمدًا ﷺ لقيادة البشرية كلّها، ووهبه من رجاحة العقل وحصافة الرأي ما جعله قائدًا رشيدًا، حازمًا في مواقف الحزم، حكيمًا عندما يستدعي الموقف ذلك. يُعدّ للأمر عدّته، ويرسم خطط القتال، ويهيّئ جيشه <b>ماديًّا ومعنويًّا</b>.</p>
<p>وكان ﷺ يبثّ العيون ليرصد تحرّكات الأعداء ومعرفة عددهم وعدّتهم، ومن حكمته أنه كان لا يكشف وجهته التي يقصدها حتى لا يتسرّب خبره إلى العدو، فيستعدّ لملاقاته، حتى إذا التقى بهم فاجأهم فلم يعرفوا من أمره شيئًا.</p>
<p>وكان ﷺ ينظّم صفوف جنده استعدادًا للزحف ويتفقّدهم فردًا فردًا، فإذا وجد فيهم مريضًا أو ضعيفًا أو صغيرًا لا يقوى على مواقف الطعان ردّه ردًّا كريمًا. وكان يباشر القتال بنفسه، فيزداد جيشه حماسًا وعزيمة على الجهاد؛ لإعلاء كلمة الله، وقد شهدت له المعارك التي خاضها بأعظم مواقف البطولة والثبات عندما يشتدّ البأس، ويحمى <b>وطيس القتال</b>.</p></div>

<div class="card"><h3>٢. طلب النصح والمشورة</h3>
<p>مع أن الله -تبارك وتعالى- وهب رسوله ﷺ العقل الراجح إلا أنه كان لا يستبدّ برأي، ولا يقطع أمرًا دون طلب النصح والمشورة من أصحابه. فعندما عسكر بجنده في غزوة <b>بدر</b>، ونزل بمكان ليس في مصلحة جيش المسلمين النزول فيه، تقدّم إليه <b>الحُباب بن المنذر</b> رضي الله عنه وقال: يا رسول الله، أرأيت هذا المنزل؟ أمنزلًا أنزلكه الله ليس لنا أن نتقدّمه ولا نتأخّر عنه، أم هو الرأي والحرب والمكيدة؟ قال: «بل هو الرأي والحرب والمكيدة». قال: يا رسول الله، فإن هذا ليس بمنزل، فانهض بالناس حتى نأتي أدنى ماء من القوم فننزله، ثم <b>نغوّر</b> ما وراءه من <b>القُلُب</b>، ثم نبني عليه حوضًا فنملؤه ماء ثم نقاتل القوم فنشرب ولا يشربون. فقال رسول الله ﷺ: «لقد أشرتَ بالرأي»، ونفّذ تلك الخطة، فكانت عاملًا مهمًّا من عوامل انتصار جيش المسلمين في تلك الغزوة.</p>
<p>نعم، إن أهمّ الروابط التي تربط القائد بجيشه أن يستنصحه ويطلب مشورته، حتى إذا ظهر له وجه الحقّ وقف عنده راضيًا ومضى عليه مطمئنًّا، وصدق الله العظيم حيث قال تعالى:</p>
<div class="ayah">﴿ فَاعْفُ عَنْهُمْ وَاسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ ﴾ [من الآية 159 - آل عمران]</div></div>

<div class="card"><h3>٣. تفقّد أسر الشهداء</h3>
<p>وما إن تنتهي المعارك حتى يقوم الرسول القائد ﷺ بتفقّد جيشه، فيأمر بمداواة الجرحى ودفن الشهداء، ويترحّم عليهم، وتعهّد أسرهم بالرعاية.</p>
<p>فعندما استشهد <b>جعفر بن أبي طالب</b> رضي الله عنه في غزوة <b>مؤتة</b>، وبلغ الخبر الرسول الكريم ﷺ ذهب إلى بيته ودخل على زوجته <b>أسماء بنت عميس</b>، فوجدها تصنع طعامًا لأطفالها، فلمّا نظرت إليه لمحت الدموع تترقرق في عينيه الشريفتين، فقالت: ما يبكيك يا رسول الله؟ أقُتل جعفر؟ إنا لله وإنا إليه راجعون! وانهمرت عيناها بالدموع. فأخذ الرسول القائد ﷺ يضمّ أبناء الشهيد جعفر إلى صدره الحنون، ويمسح على رؤوسهم، ويدعو لهم بالخير، ويقول: «أنا وليّهم في الدنيا والآخرة»، ثم رجع إلى أهله وقال لهم: «اصنعوا لآل جعفر طعامًا، فإنهم قد شُغلوا بأمر صاحبهم».</p></div>

<div class="card"><h3>أُسُس القيادة الرشيدة</h3>
<p>وبهذا رسم رسول الله ﷺ أسس القيادة الرشيدة المتمثّلة في:</p>
<ol><li>رسم الخطط، والاستعداد لملاقاة العدو استعدادًا كاملًا.</li>
<li>الأخذ بمبدأ المشورة والنصح، لأن رأي الجماعة أكثر سدادًا.</li>
<li>رعاية أسر الشهداء، وتحمّل المجتمع مسؤولية ذلك.</li></ol></div>

<div class="card"><h3>معاني المفردات</h3><ul>
<li><b>وطيس القتال:</b> شدّة المعركة.</li>
<li><b>نغوّر:</b> نردم ونهدم.</li>
<li><b>القُلُب:</b> (بضم القاف واللام) جمع قليب، وهو البئر.</li></ul></div>

<div class="card"><h3>أولًا: السرقة</h3>
<p>السرقة هي أخذ شيء ذي قيمة من الأموال وغيرها بغير وجه حق، فهي <b>اعتداء على ممتلكات الغير الخاصة والعامة</b>. ولهذا فإن السرقة من الصفات الذميمة المخلّة بالمروءة والشرف، وأثرها بالغ الخطورة؛ لأنها تسبّب في خلل بأمن المجتمع واستقراره، والسارق مهما تستّر بفعله لا بدّ أن يفضحه الله تعالى في الدنيا، ويعاقبه على جريمته في الآخرة عقابًا شديدًا.</p>
<p>السرقة من <b>كبائر الذنوب</b> التي حرّمها الله تعالى، وجعل لها الشرع الكريم حدًّا يقام على مرتكبها؛ ليكون ذلك رادعًا له ولغيره، حتى ينعم المجتمع بالأمن والاستقرار، وذلك الحدّ هو <b>قطع يد السارق</b>، إن سرق من حِرز (أي: من مكان آمن).</p>
<div class="ayah">﴿ وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءً بِمَا كَسَبَا نَكَالًا مِّنَ اللَّهِ وَاللَّهُ عَزِيزٌ حَكِيمٌ ﴾ [المائدة: 40]</div>
<p>والرسول ﷺ جعل السرقة صفة تتنافى مع الإيمان الكامل، فهما لا يجتمعان في إنسان مؤمن إيمانًا كاملًا، يقول ﷺ:</p>
<div class="hadith">«لا يسرق السارق حين يسرق وهو مؤمن». <small>(متفق عليه)</small></div>
<p>فالمؤمن السويّ لا يقوم بهذا العمل الشنيع الذي يأباه الإسلام؛ فالمؤمن عندما يتغلّب على جانب الشر ويحافظ على أموال الناس وممتلكاتهم وعلى المال العام يعدّ ذلك منه حماية للحرمات. ومن أجل ذلك نجد الرسول ﷺ قد غضب غضبًا شديدًا حينما كلّمه <b>أسامة بن زيد</b> في شأن المرأة المخزومية التي سرقت، وقال:</p>
<div class="hadith">«والذي نفسي بيده لو أن فاطمة بنت محمد سرقت لقطعتُ يدها». <small>(متفق عليه)</small></div></div>

<div class="card"><h3>ثانيًا: الغش</h3>
<div class="hadith">قال ﷺ: «من غشّنا فليس منّا، والمكر والخداع في النار». <small>(رواه ابن حبان)</small></div>
<p>فالغش ظاهرة خطيرة وسلوك مشين، فلا يكون الغشّاش حين يغشّ مؤمنًا. ومن أسباب الغش <b>ضعف الإيمان</b>؛ فإن القلوب إذا ملئت بالإيمان بالله لا يمكن أن يقدم صاحبها على الغش وهو يعلم أن ذلك يغضب الله، فلا يمكن للقلوب التي امتلأت بحب الله أن تقدم على هذا العمل الذي يسخط الله ورسوله.</p>
<p>والغش <b>مرض مقيت</b>، إذا تخلّل جسم المجتمع تآكلت أطرافه، وتصدّع بنيانه وكان عاقبة أمره خسرًا، فالغش لا ينتشر إلا في مجتمع أصابه اختلال في الضمير وضمور في الإيمان، وحقيق بمن هذا فعله أن يُطرد من صفوف المؤمنين: «من غشّنا فليس منّا» (رواه مسلم).</p>
<p>إن هذا الحديث إعلان حرب على الضمائر الفاسدة والنفوس العفنة التي لا تراقب ربّها سرًّا وعلانية، إنه تحذير لكل من تسوّل له نفسه الخبيثة غشّ المسلمين وخداعهم وأكل أموالهم بالباطل. قال الله تعالى:</p>
<div class="ayah">﴿ أَلَا يَظُنُّ أُولَٰئِكَ أَنَّهُم مَّبْعُوثُونَ ۞ لِيَوْمٍ عَظِيمٍ ۞ يَوْمَ يَقُومُ النَّاسُ لِرَبِّ الْعَالَمِينَ ﴾ [المطففين: 4-6]</div></div>

<div class="card"><h3>أنواع الغش</h3>
<ol><li><b>غشّ الراعي لرعيّته:</b> وهو من أخطر أنواع الغش.</li>
<li><b>غشّ الأب لأسرته:</b> بعدم نصحهم والاهتمام بهم.</li>
<li><b>غشّ العامل والحِرفي</b> الذي يعمل للناس ويصلح لهم أشياءهم أو يصنع لهم ما يريدون، وقد أمّنوه على أموالهم.</li>
<li><b>الغش في الامتحانات:</b> وهو الذي انتشر انتشار النار في الهشيم، وأصبح يشكو منه كثير من المدرّسين والتربويين فأفسد التعليم في المؤسسات التعليمية.</li></ol></div>

<div class="card"><h3>الغش في الامتحانات</h3>
<p>إن ظاهرة الغش بدأت تأخذ في الانتشار ليس على مستوى التعليم الأساسي فقط، بل تجاوزتها إلى المراحل الثانوية والجامعية؛ فكم من طالب قدّم بحثًا ليس له فيه إلا الاسم على الغلاف، وكم من طالب قدّم مشروعًا ولا يعرف ما بداخله، وأصبح التلاميذ يرمون الذين لا يغشّون بأنهم متخلّفون وجاحدون، وربما تمادى أحدهم بأن يصف الطالب الذي لا يساعد على الغش بأنه لا يعرف معنى الأخوة ولا التعاون. وكثير منهم يحاول الغش في الامتحان وقد قرأ حديث «من غشّنا فليس منّا» بل ربما يراه على ورقة الأسئلة ولكنه لا يتأثّر به؛ لأنه قد استقرّ في ذهنه أنه لا علاقة بين العلم الذي يتعلّمه وبين العمل الذي يجب أن يأتي به بعد هذا العلم.</p>
<p>إن الغش من أهمّ أسباب <b>تأخّر الشعوب</b> وعدم تقدّمها ورقيّها، لأن الشعوب لا تتقدّم إلا بالعلم وبالشباب المتعلّم، فإذا كان شبابها لا يحصلون على الشهادة العلمية إلا بالغش فكيف يرقى الوطن بهؤلاء الشباب الغشّاشين؟ فما الهمّ الذي يحمله هذا الشاب؟ إنه لا همّ له إلا الحصول على الشهادة التي يتحصّل بها على وظيفة يرتزق منها هو وأسرته، إنها <b>الشهادة المزوّرة</b> التي يكون مرتّبها حرامًا؛ لأن ما بني على باطل فهو باطل، فالإقدام على تزوير الشهائد والتعيين بها في الوظائف لا يجوز شرعًا لأن الغش حرام والتزوير حرام.</p>
<p>وقد سُئل أحد العلماء: ما حكم الطلاب الذين يحاولون الغش أثناء الامتحانات؟ وهل يجوز للملاحظين أن يساعدوهم بحجة صعوبة الامتحان؟</p>
<p><b>فأجاب:</b> من المقرّر أن الغش في أي شيء حرام، والحديث واضح في ذلك: «من غشّنا فليس منّا» (رواه مسلم)، وهو حكم عام لكل شيء فيه مخالفة الحقيقة. فالذي يغشّ ارتكب معصية، والذي يساعده شريك له في الإثم، ولا يصحّ أن تكون صعوبة الامتحان مبررًا للغش، فقد جعل الامتحان لتمييز المجتهدين عن غيرهم، وينبغي عدم التسوية بين المجتهد وغيره. قال تعالى:</p>
<div class="ayah">﴿ أَمْ نَجْعَلُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَالْمُفْسِدِينَ فِي الْأَرْضِ أَمْ نَجْعَلُ الْمُتَّقِينَ كَالْفُجَّارِ ﴾ [ص: 27]</div><br>
<div class="ayah">﴿ قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ ﴾ [من الآية 10 - الزمر]</div>
<p>وانتشار الغش في الامتحانات وغيرها <b>رذيلة من أخطر الرذائل</b> على المجتمع، حيث يسود فيه الباطل وينحصر الحق، ويعيش المجتمع بانقلاب الموازين التي تُسنَد فيها الأمور إلى غير أهلها، فهو ضياع للأمانة، وهذا من علامات الساعة. والذي تولّى عملًا يحتاج إلى مؤهّل يشهد بكفاءته وقد نال الشهادة بالغش فيحرم عليه ما كسب من مال وراء ذلك، قال ﷺ:</p>
<div class="hadith">«كل لحم نبت من سُحت فالنار أولى به». <small>(المعجم الأوسط للطبراني)</small></div>
<p>وقد يصدق عليه قول الله تعالى:</p>
<div class="ayah">﴿ لَا تَحْسَبَنَّ الَّذِينَ يَفْرَحُونَ بِمَا أَتَوا وَيُحِبُّونَ أَن يُحْمَدُوا بِمَا لَمْ يَفْعَلُوا فَلَا تَحْسَبَنَّهُم بِمَفَازَةٍ مِّنَ الْعَذَابِ وَلَهُمْ عَذَابٌ أَلِيمٌ ﴾ [آل عمران: 188]</div></div>

    explain:`
<div class="card"><h3>من خصائص الدين الإسلامي</h3>
<p>إن الدين الإسلامي الذي جاء به رسولنا الكريم محمد ﷺ وارتضاه الله لنا، وكان آخر الأديان السماوية، قد جاء بتعاليم تحقّق للإنسان <b>الصلاح والسعادة في الدنيا والآخرة</b>، وتنظّم علاقته بخالقه، وترسم الطريق له في كيفية التعامل مع غيره من البشر. فهو دين <b>عام</b> لكل البشر، <b>صالح</b> لكل زمان ومكان، <b>شامل</b> للعقيدة والعمل من عبادات ومعاملات وآداب. يقول تعالى:</p>
<div class="ayah">﴿ الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا ﴾ [المائدة: 3]</div></div>

<div class="card"><h3>الإسلام دين الفطرة: مدخل الموضوع</h3>
<p>إن الإيمان بوجود الله -تعالى- الخالق، والإقرار بربوبيته <b>أمر فطري</b>، خلق الله تعالى عليه كل مخلوق أول خلقه، فلا يحتاج من الإنسان جهدًا ولا عناءً لإثباته؛ لأنه مغروس في نفسه ويشعر به في إحساسه، وفطرة الله -تعالى- عليه. إذ لو تُرك الإنسان في مكان خالٍ لا يوجد به أحد بعيدًا عن المؤثّرات الخارجية وعن كل الشوائب العقدية؛ لاستطاع بفطرته أن يعرف أن لهذا الكون خالقًا مدبّرًا متصرّفًا فيه، ثم بفطرته يتوجّه لمحبة خالقه وعبادته.</p></div>

<div class="card"><h3>المقصود بالفطرة: طبيعة الإنسان</h3>
<div class="ayah">﴿ فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا لَا تَبْدِيلَ لِخَلْقِ اللَّهِ ذَٰلِكَ الدِّينُ الْقَيِّمُ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ ﴾ [الروم: 29]</div>
<p>والمقصود بالفطرة في الآية الكريمة <b>الدين الإسلامي</b>، فالله -عز وجل- فطر الناس على دين الإسلام، ويقول رسولنا الكريم ﷺ:</p>
<div class="hadith">«ما من مولود إلا يُولد على الفطرة فأبواه يهوّدانه أو ينصّرانه أو يمجّسانه...». <small>(البخاري)</small></div></div>

<div class="card"><h3>الدليل على أن الإسلام دين الفطرة</h3>
<p>أخبر الله -تعالى- في أكثر من موضع بكتابه العزيز أن الناس إذا مسّهم الضرّ لجأوا إلى الله ودعوه مخلصين له الدين، يقول سبحانه:</p>
<div class="ayah">﴿ وَإِذَا غَشِيَهُم مَّوْجٌ كَالظُّلَلِ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ فَلَمَّا نَجَّاهُمْ إِلَى الْبَرِّ فَمِنْهُم مُّقْتَصِدٌ وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا كُلُّ خَتَّارٍ كَفُورٍ ﴾ [لقمان: 31]</div>
<p>والاعتراف بخالق الكون مسلَّم به عند جميع الناس حتى المشركين، يقول تعالى:</p>
<div class="ayah">﴿ وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ قُلِ الْحَمْدُ لِلَّهِ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ ﴾ [لقمان: 24]</div>
<p>فهم في قرارة أنفسهم يعرفون الخالق؛ لأن فطرتهم تدلّهم عليه.</p>
<p>هذه الفطرة التي فطر الله تعالى عليها عباده هي: <b>الاعتراف بوجوده، والإقرار بربوبيته، وتخصيصه بالعبادة والطاعة، والتقرّب إليه بالعمل الصالح</b>، وهذا ما جاء به الدين الإسلامي المتمثّل في رسالة سيدنا محمد ﷺ. فالدين الإسلامي دين الفطرة، وجاءت تعاليمه وشرائعه موافقة للفطرة الإنسانية.</p></div>

    explain:`
<div class="card"><h3>أحكام المسبوق</h3>
<ol>
<li>إذا وجد المأموم الإمام قد سبقه بالصلاة فإنه يكبّر قائمًا معتدلًا <b>تكبيرة الإحرام</b>، فإن وجد الإمام راكعًا أو ساجدًا كبّر تكبيرة أخرى للركوع أو السجود، وتبع الإمام في باقي الصلاة.</li>
<li>وأما إن وجده جالسًا للتشهد الأول أو الأخير أو بين السجدتين فإنه يكتفي بتكبيرة الإحرام، ولا يكبّر تكبيرة أخرى وهو يهوي للجلوس.</li>
<li>تُحسب الركعة للمسبوق إذا أدرك مع الإمام <b>الركوع</b>، أي: قبل أن يبدأ الإمام الرفع من الركوع، فإن فاته الركوع فلا تُحسب هذه الركعة.</li>
<li>يقوم المسبوق بعد سلام الإمام <b>مكبّرًا</b> إذا أدرك ركعتين أو أقل من ركعة مع الإمام، وفيما عدا ذلك يقوم بلا تكبير.</li>
<li>بعد سلام الإمام يقوم لقضاء ما عليه، فيكون <b>قاضيًا للأقوال، بانيًا للأفعال</b>، بمعنى:
<ul><li>أ. أن يجعل ما فاته من أقوال مع الإمام أول صلاته، وما أدركه معه منها آخرها.</li>
<li>ب. أن يجعل ما أدركه معه من أفعال أول صلاته، وما فاته منها آخرها.</li></ul></li></ol></div>

<div class="card"><h3>أمثلة تطبيقية</h3>
<p><b>١. إذا أدرك الإمام وهو يقرأ في الركعة الثانية -أو في الركوع- من صلاة الصبح:</b> فإنه يقوم بلا تكبير بعد سلام الإمام، ويأتي بركعة بفاتحة وسورة جهرًا ويقنت فيها؛ لأنها الأخيرة له بالنسبة لأفعال الصلاة.</p>
<p><b>٢. إذا أدرك الإمام وهو يقرأ في الركعة الثانية -أو في الركوع- من صلاة الظهر أو العصر أو العشاء:</b> فإنه يقوم بلا تكبير بعد سلام الإمام، ويأتي بركعة يقرأ فيها الفاتحة والسورة سرًّا في الظهر والعصر، وجهرًا في العشاء، ثم يتشهّد ويسلّم.</p>
<p><b>٣. إذا أدرك الإمام وهو يقرأ في الركعة الثانية -أو في الركوع- من صلاة المغرب:</b> فإنه يقوم <b>بالتكبير</b> بعد سلام الإمام؛ لأنها تعدّ الركعة الثانية له، ويأتي بركعة يقرأ فيها الفاتحة والسورة جهرًا؛ لأنه يقضي أقوال الركعة الأولى التي فاتته.</p>
<p><b>٤. إذا أدرك الإمام في الركعة الثالثة من صلاة الظهر أو العصر أو العشاء</b>، سواء كان الإمام في القراءة أو في الركوع: فإنه بعد سلام الإمام يقوم <b>مكبّرًا</b> لأنه أدرك ركعتين مع الإمام، ثم يأتي بركعتين بفاتحة وسورة سرًّا في الظهر والعصر، وجهرًا في العشاء، ثم يجلس ويتشهّد ويسلّم.</p>
<p><b>٥. إذا أدرك الإمام في الركعة الثالثة من صلاة المغرب</b>، سواء كان الإمام في القراءة أو في الركوع: فإنه بعد سلام الإمام يقوم <b>بلا تكبير</b>؛ لأنه أدرك مع الإمام ركعة واحدة فقط، ثم يأتي بركعة يقرأ فيها فاتحة وسورة جهرًا، ثم يجلس ويأتي بتشهد الوسط، ثم يقوم ويأتي بركعة ثالثة بفاتحة وسورة كذلك جهرًا، ثم يتشهّد التشهد الأخير ويسلّم.</p>
<p><b>٦. إذا أدرك الإمام في الركعة الرابعة</b>، سواء كان الإمام في القراءة أو في الركوع: فإنه بعد سلام الإمام يقوم <b>بلا تكبير</b>، لأنه أدرك مع الإمام ركعة واحدة، ويأتي بركعة بفاتحة وسورة سرًّا في الظهر والعصر وجهرًا في العشاء، ويجلس للتشهد الأول، ثم يقوم ويأتي بركعة بفاتحة وسورة سرًّا في الظهر والعصر وجهرًا في العشاء، ولا يجلس للتشهد، وإنما يقوم ويأتي بركعة بفاتحة فقط سرًّا في كل الصلوات، ثم يتشهّد ويسلّم.</p></div>

    id:'g9-islamic-11', title:'من دروس التهذيب والأخلاق: الرفق بالحيوان',
    explain:`
<div class="card"><h3>نعمة الأنعام</h3>
<p>خلق الله سائر الأنعام وسخّرها للإنسان ليركبها ويحمل عليها أثقاله، ويستعملها في أعمال الزراعة في البادية، كما أخرج الله من الأنعام منافع له، فهو يأكل لحمها ويشرب لبنها، ويصنع الملابس من صوفها وجلودها. قال تعالى:</p>
<div class="ayah">﴿ وَالْأَنْعَامَ خَلَقَهَا لَكُمْ فِيهَا دِفْءٌ وَمَنَافِعُ وَمِنْهَا تَأْكُلُونَ ۞ وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَ ۞ وَتَحْمِلُ أَثْقَالَكُمْ إِلَىٰ بَلَدٍ لَّمْ تَكُونُوا بَالِغِيهِ إِلَّا بِشِقِّ الْأَنفُسِ إِنَّ رَبَّكُمْ لَرَءُوفٌ رَّحِيمٌ ۞ وَالْخَيْلَ وَالْبِغَالَ وَالْحَمِيرَ لِتَرْكَبُوهَا وَزِينَةً وَيَخْلُقُ مَا لَا تَعْلَمُونَ ﴾ [النحل: 5-8]</div>
<p>ويستعين الإنسان بالكلاب للصيد والحراسة، وكل ذلك فضل من الله ونعمة على الإنسان. وهذه الحيوانات على اختلافها <b>أمم</b> خلقها الله في هذا الكون لحكمة بالغة. قال تعالى:</p>
<div class="ayah">﴿ وَمَا مِن دَابَّةٍ فِي الْأَرْضِ وَلَا طَائِرٍ يَطِيرُ بِجَنَاحَيْهِ إِلَّا أُمَمٌ أَمْثَالُكُم مَّا فَرَّطْنَا فِي الْكِتَابِ مِن شَيْءٍ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَ ﴾ [الأنعام: 39]</div></div>

<div class="card"><h3>معاني المفردات</h3><ul>
<li><b>الأنعام:</b> الإبل والبقر والغنم والماعز.</li>
<li><b>تسرحون:</b> تخرجونها في الغداة إلى المرعى.</li>
<li><b>تريحون:</b> تردّونها في العشي إلى المراح.</li>
<li><b>زينة:</b> تزيّنونها في أعيادكم ويعجبكم النظر إليها.</li>
<li><b>المعجمة:</b> العاجزة عن الشكوى.</li></ul></div>

<div class="card"><h3>سوء معاملة الحيوانات</h3>
<p>ولكن كثيرًا ما نشاهد في الواقع بعض الحيوانات الأليفة التي سخّرها الله للإنسان وهي تعاني من سوء المعاملة: فنجد عربة مملوءة بالبضاعة يجرّها حمار أو حصان هزيل يشبعه صاحبه ضربًا، ونجد كلبًا قد انزوى في مكان خرب مظلم بعد أن تعرّض لاعتداء الأطفال عليه، ونرى كبشًا يجرّه الجزّار من صوفه أو يقيّد أرجله الأربعة بعنف حين يريد ذبحه، أو قطة تجري مذعورة من ملاحقة الأطفال لها بالأحجار والعصي. فما حكم الإسلام في هذه المعاملات القاسية؟ وكيف يأمرنا الإسلام أن نعامل هذه المخلوقات من الدواب والأنعام كما أمرنا رسولنا الكريم ﷺ؟</p>
<div class="hadith">عن عبد الله بن عمر رضي الله عنهما أن الرسول ﷺ قال: «ما من إنسان يقتل عصفورًا فما فوقها بغير حقّها إلا يسأله الله عز وجل عنها». قيل: يا رسول الله، وما حقّها؟ قال: «أن يذبحها فيأكلها، ولا يقطع رأسها ويرمي بها». <small>(رواه النسائي والحاكم وصححه)</small></div><br>
<div class="hadith">وعن سهل بن الحنظلية رضي الله عنه قال: مرّ رسول الله ﷺ ببعير قد لحق ظهره ببطنه، فقال: «اتقوا الله في هذه البهائم المعجمة، فاركبوها صالحة واتركوها صالحة». <small>(رواه أبو داود)</small></div></div>

<div class="card"><h3>تحريم الإساءة إلى الحيوان</h3>
<p>فهذه البهائم تشعر وتحسّ، وتتألّم وتأكل وتشرب، وتتوالد وتنام، غير أنها لا تعقل ولا تفكّر، ولا تستطيع أن تعبّر عن آلامها بكلام، وإنما تصرخ وتئنّ حين تُعامل بسوء كالضرب، والحبس في القفص، والقيد من الأرجل، والحرمان من الطعام والشراب.</p>
<p>وقد حرّمت الشريعة الإسلامية <b>الإساءة إلى الحيوانات والإضرار بها</b>؛ لأن إيذاءها سيؤدّي بها إلى الانقراض والزوال من الدنيا، وسيكون مدعاة لغضب الله وعذابه في الآخرة. قال رسول الله ﷺ:</p>
<div class="hadith">«دخلت امرأة النار في هرّة حبستها، لا هي أطعمتها وسقتها، ولا هي تركتها تأكل من خشاش الأرض، حتى ماتت». <small>(متفق عليه)</small></div></div>

<div class="card"><h3>من آداب الإسلام في التعامل مع الحيوانات</h3>
<p>جعل لها <b>حقوقًا</b>، فأمر الإنسان أن يعاملها معاملة طيّبة، ويحرص على رعايتها؛ وذلك إحسان ورفق بهذه الحيوانات. قال رسول الله ﷺ:</p>
<div class="hadith">«الراحمون يرحمهم الرحمن، ارحموا أهل الأرض يرحمكم أهل السماء». <small>(رواه الترمذي)</small></div>
<p>كما يجب على المسلم أن <b>ينقذها</b> إن كانت في محنة شديدة كأن يسقيها إذا عطشت، ويضمّد جراحها إذا أصيبت، ويداويها إذا مرضت. قال ﷺ:</p>
<div class="hadith">«إن رجلًا رأى كلبًا يأكل الثرى من العطش، فأخذ الرجل خفّه، فجعل يغرف له به حتى أرواه، فشكر الله له، فأدخله الجنة». <small>(رواه البخاري)</small></div>
<p>كما أن استخدامها يكون <b>بالمعروف</b>، فلا ينبغي أن يحمّلها ما لا تطيق، وأن يضربها بعنف، أو أن يقتلها عبثًا دون الاستفادة من لحمها أو صوفها أو ريشها، ولا تُقتل -يا أبنائي- الحيوانات النافعة التي لا تؤكل كالنمل والنحل وبعض أنواع الطيور والحيوانات الأليفة كالهرّة والكلب، إلا أن الشريعة الإسلامية رخّصت في قتل الحيوانات المؤذية كالأفاعي والفأر والكلب العقور والعقرب؛ لأنها تحمل السم والأمراض، وتضرّ بالإنسان أكثر مما تنفعه.</p></div>

<div class="card"><h3>الإحسان في الذبح</h3>
<p>كذلك يجب الإحسان في الذبح حيث إن الله سخّرها للإنسان ليأكلها، فأمره أن يحسن إليها في الذبح، ونهى الرسول الكريم ﷺ عن تعذيبها، فقد مرّ رسول الله ﷺ على رجل واضع رجله على صفحة شاة، وهو يحدّ شفرته، وهي تلحظ إليه ببصرها، فقال:</p>
<div class="hadith">«أفلا قبل هذا؟! أتريد أن تميتها موتتين». <small>(رواه الطبراني)</small></div>
<p>ورأى عمر رضي الله عنه رجلًا يسحب شاة من رجلها ليذبحها، فقال له: «ويلك قدها إلى الموت قودًا جميلًا» (رواه عبد الرزاق في مصنفه).</p>
<p>وبهذه التعليمات والآداب يكون الإسلام قد ضرب أروع الأمثلة في الرفق بالحيوان، وبيّن للإنسان طرق الاستفادة منها بالحسنى حتى ينال خيرها ويفوز برضا الله في الدنيا والآخرة.</p></div>

<div class="card"><h3>التمهيد</h3>
<p>سيّدنا محمد ﷺ رجل من البشر اصطفاه الله، وكلّفه بحمل رسالة الإسلام وتبليغها إلى الناس كافة؛ حتى لا تكون لهم حجة قائمة في ترك عبادة الله الواحد. ومهام الرسالة الخالدة لم تُخرج سيدنا محمدًا ﷺ من بشريّته، كما لم تنزع عنه العواطف والأحاسيس، ولم تجرّده من وجدان الإنسان، وقد ارتبطت هذه البشرية واتصلت اتصالًا كاملًا بمقام الرسالة وهو مقام عظيم وجليل. فهو كما وصفه القرآن الكريم في قوله تعالى:</p>
<div class="ayah">﴿ وَمَا أَرْسَلْنَا مِن قَبْلِكَ إِلَّا رِجَالًا نُّوحِي إِلَيْهِمْ فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ ﴾ [النحل: 43]</div>
<p>وهو ﷺ <b>بشر</b> يتزوّج النساء، ويحبّ ويكره، ويتألّم ويمرض بالأمراض غير المعدية ولا المنفّرة، ويشعر بالعواطف البشرية كما يشعر بها أي إنسان آخر، ويجري عليه كلّ ما يجري على الآدميين من يُتم وتعب وموت وغير ذلك.</p>
<p>وكما تولّاه ربّه بالرعاية والعناية ليكون نبيّه ورسوله، فقد تولّاه وأكرمه ليكون ناجحًا في جوانب الحياة المختلفة، فكان الوحي ينزل عليه بالتوجيه، ورعاية الله وعنايته تتدخّل في كل حين، فلا عجب أن يكون <b>خلقه القرآن</b>، فقد أدّبه ربّه فأحسن تأديبه، وعصمه من الوقوع في الخطأ والزلل. ومن مظاهر ذلك الأدب:</p></div>

<div class="card"><h3>وفاؤه وإخلاصه ﷺ</h3>
<p>تزوّج رسول الله ﷺ قبل البعثة من السيدة <b>خديجة بنت خويلد</b> رضي الله عنها، فكان لها نعم الزوج البارّ المخلص، وكانت له نعمت الزوجة المخلصة العطوف، فوقفت إلى جانبه عندما اشتدّت الأحوال، وشدّت من أزره عندما تخلّى عنه الناس. فكان ﷺ يراعي ذلك لها في حياتها، وبعد وفاتها كان لا يذكرها إلا بخير، كما كان <b>يهشّ</b> لصاحباتها <b>ويصلهنّ</b> ويسعى لبرّهنّ.</p>
<p>وكان ﷺ مثلًا أعلى للزوج الوفيّ لزوجاته، يحسن عشرتهنّ ويعدل بينهنّ ويلاطفهنّ، ولا يدخل على واحدة منهنّ إلا مبتسمًا، مسلّمًا وداعيًا، وكان يقوم على شؤونهنّ، ويساعدهنّ في أعمال المنزل. فقد سُئلت السيدة عائشة رضي الله عنها: ماذا كان يصنع الرسول ﷺ في البيت؟ فقالت:</p>
<div class="hadith">«كان يخصف نعله، ويخيط ثوبه، ويعمل في بيته كما يعمل أحدكم في بيته». <small>(رواه ابن حبان)</small></div>
<p>ولا عجب فهو القائل ﷺ:</p>
<div class="hadith">«خيركم خيركم لأهله، وأنا خيركم لأهلي». <small>(رواه الترمذي وابن ماجه)</small></div></div>

<div class="card"><h3>معاني المفردات</h3><ul>
<li><b>يهشّ:</b> يُظهر البِشر عند ملاقاتهنّ.</li>
<li><b>يصلهنّ:</b> بالهدايا وغيرها.</li></ul></div>

<div class="card"><h3>الدروس المستفادة</h3>
<p>وهكذا رأيتم يا أبنائي كيف كان رسول الله ﷺ مربّيًا حكيمًا وقائدًا رشيدًا، وحاكمًا عادلًا، وزوجًا وفيًّا، فما أحوجنا إلى الاقتداء به والسير على منهاجه والتأدّب بآدابه، فنربّي أولادنا على الأخلاق الحسنة، وإذا تولّينا أمرًا من الأمور نكون <b>أمناء مخلصين</b>، ونبتعد عن الوساطة والمحسوبية، ونتخلّق بخلق الوفاء والإخلاص، فإن ذلك كلّه يرفع من شأن المجتمع، ويطهّره من مظاهر الفساد، ويحفظ له كيانه، فيعيش قويًّا.</p></div>

    id:'g9-islamic-13', title:'من دروس السنة النبوية: الحديث الثاني - الرحمة',
    explain:`
<div class="card"><h3>تمهيد</h3>
<p>الإسلام دين الرحمة، يدعو المؤمنين إلى التخلّق بهذا الخلق في كل أقوالهم وأفعالهم وتعاملهم مع غيرهم من الناس، بل ومع المخلوقات الأخرى؛ ليكونوا مثالًا في عمل البرّ والإحسان، فيشعروا بشعور الآخرين، فيتخلّصوا من داء الأنانية وحب الذات، وبذلك يعملون بهدي الرسول الكريم ﷺ الذي كان يرحم الإنسان والحيوان، والكبير والصغير.</p></div>

<div class="card"><h3>نص الحديث</h3>
<div class="hadith">عن أبي هريرة رضي الله عنه أن رسول الله ﷺ قال: «بينما رجل يمشي بطريق اشتدّ عليه العطش فوجد بئرًا، فنزل فيها فشرب، ثم خرج فإذا كلب يلهث يأكل الثرى من العطش، فقال الرجل: لقد بلغ هذا الكلب من العطش مثل الذي كان بلغ منّي، فنزل البئر فملأ خفّه ماءً، ثم أمسكه بفيه حتى رقي فسقى الكلب، فشكر الله له فغفر له». قالوا: يا رسول الله، وإن لنا في البهائم لأجرًا؟ فقال: «في كل ذات كبد رطبة أجر». <small>(متفق عليه، أي رواه البخاري ومسلم، وبهذا يكون في أعلى درجات الصحة)</small></div></div>

<div class="card"><h3>معاني المفردات</h3><ul>
<li><b>يلهث:</b> يُخرج لسانه من شدة العطش والحرّ.</li>
<li><b>الثرى:</b> التراب المبتلّ بأثر الماء.</li>
<li><b>خفّه:</b> حذاءه.</li>
<li><b>بفيه:</b> بفمه.</li>
<li><b>كبد رطبة:</b> المخلوق الذي لا زال حيًّا.</li>
<li><b>شكر الله له:</b> قبل عمله وجازاه عليه.</li></ul></div>

<div class="card"><h3>معنى الحديث</h3>
<p><b>١. البرّ والإحسان خُلق المسلم:</b> يربّي الإسلام الناس على عمل الخير وأعمال البر والإحسان؛ حتى يكون المسلم عبدًا صالحًا يرفق بالإنسان والحيوان؛ لأنه دين الرفق والرحمة. ولهذا يروي لنا الرسول الكريم ﷺ قصة هذا الرجل الذي أبت نفسه إلا أن تشعر بشعور هذا الحيوان، فيسقيه، فينال بذلك ثوابًا عظيمًا، ويكون أهلًا لمرضاة الله ولدخول جنّته. يقول الله تعالى:</p>
<div class="ayah">﴿ وَمَا تُقَدِّمُوا لِأَنفُسِكُم مِّنْ خَيْرٍ تَجِدُوهُ عِندَ اللَّهِ هُوَ خَيْرًا وَأَعْظَمَ أَجْرًا وَاسْتَغْفِرُوا اللَّهَ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ ﴾ [المزمل: 18]</div>
<div class="hadith">ويقول النبي ﷺ: «لا يؤمن أحدكم حتى يحبّ لأخيه ما يحبّ لنفسه». <small>(متفق عليه)</small></div>
<p><b>٢. مرضاة الله والجنة غاية المؤمن:</b> لا شك أن الأعمال الصالحة ولو كانت في ظاهرها يسيرة سبب في مرضاة الله ودخول جنّته، خصوصًا الرفق بالآخرين إنسانًا أو حيوانًا؛ لأن النبي الكريم ﷺ يقول:</p>
<div class="hadith">«إن الله رفيق يحبّ الرفق». <small>(متفق عليه من حديث عائشة رضي الله عنها)</small></div>
<p>وكلما أحسن العبد لعباد الله ومخلوقاته أحسن الله إليه أضعافًا مضاعفة، فالحسنة بعشرة أمثالها. يقول الله تعالى:</p>
<div class="ayah">﴿ هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ ﴾ [الرحمن: 59]</div>
<p>ويقول ﷺ: «بينما رجل يمشي بطريق وجد غصن شوك على الطريق فأخّره فشكر الله له فغفر له» (متفق عليه). ويقول ﷺ كذلك: «دخلت امرأة النار في هرّة ربطتها فلم تُطعمها ولم تدعها تأكل من خشاش الأرض» (متفق عليه، واللفظ للبخاري).</p>
<p><b>٣. ضرورة التخلّص من الأنانية وحب الذات:</b> على المسلم أن يعيش لغيره كما يعيش لنفسه، فيكون <b>الإيثار والتضحية</b> خُلقًا له، فلا يستأثر بشيء ليحرم غيره منه ولو كان حيوانًا. يقول النبي ﷺ:</p>
<div class="hadith">«ما آمن بي من بات شبعان وجاره جائع إلى جنبه وهو يعلم». <small>(رواه الطبراني والبزار بإسناد حسن)</small></div>
<p><b>٤. الإخلاص في العمل شرط لقبوله عند الله:</b> على العبد أن يعترف بفضل الله بما أعطاه من نعم ومال وصحة وعافية، فيسخّرها في طاعة الله بإعانة الآخرين، وتقديم المساعدة للمحتاجين، ولو لحيوان؛ مع إخلاص العمل لله وحده؛ لأن ذلك دليل شكر الله على نعمائه.</p>
<div class="ayah">﴿ وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ ﴾ [البينة: 5]</div><br>
<div class="ayah">﴿ فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا ﴾ [الكهف: 105]</div></div>

<div class="card"><h3>ما يرشد إليه الحديث</h3><ol>
<li>الإحسان والبرّ من أخلاق المؤمنين.</li>
<li>الرفق بالحيوان والعطف عليه دليل الإيمان.</li>
<li>إخلاص العمل لله شرط لقبوله ولحصول الأجر والثواب.</li>
<li>تقديم العون والمساعدة للآخرين مظهر من مظاهر الشكر لله على نعمه والاعتراف بفضله.</li>
<li>يجب على المسلم ألّا يحتقر من المعروف شيئًا ولو كان لحيوان.</li>
<li>ضرورة تخلّص الناس من داء الأنانية وحب الذات على حساب الآخرين.</li></ol></div>

<div class="card"><h3>من كتب السنة: صحيح البخاري</h3>
<p>مؤلّفه أبو عبد الله <b>محمد بن إسماعيل البخاري</b>، المتوفّى سنة <b>256 هـ</b>، واسم الكتاب بالكامل: <b>الجامع المسند الصحيح المختصر من أمور رسول الله ﷺ وسننه وأيامه</b>، وهو أصحّ كتاب بعد كتاب الله، شرحه كثير من العلماء حتى بلغ عدد شروحه أكثر من 300 شرح.</p></div>

<div class="card"><h3>من الأذكار النبوية: ما يُقال إذا استيقظ المسلم في الليل وأراد النوم بعده</h3>
<div class="hadith">«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، والحمد لله، وسبحان الله، ولا إله إلا الله، والله أكبر، ولا حول ولا قوة إلا بالله». ثم قال: «اللهم اغفر لي» أو دعا استُجيب له، فإن توضأ قُبلت صلاته. <small>(صحيح البخاري، ح 1154)</small></div></div>`,

    id:'g9-islamic-14', title:'من دروس العقيدة: الإسلام دين عقيدة وعمل',
    explain:`
<div class="card"><h3>مدخل الموضوع</h3>
<p>الإسلام دين ارتضاه الله تعالى لجميع البشر، وهو <b>آخر الأديان السماوية</b>؛ لذلك جاء بتعاليم وشرائع تنظّم للإنسان علاقته مع خالقه، وترتّب له حياته ومختلف شؤونه، وتوضّح له كيفية التعامل مع غيره من المخلوقات؛ ليكفل له السعادة والنجاح في دنياه، والسعادة والفوز في آخرته. يقول الله تعالى:</p>
<div class="ayah">﴿ وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ بَشِيرًا وَنَذِيرًا وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ ﴾ [سبأ: 28]</div></div>

<div class="card"><h3>العقيدة والعمل</h3>
<p><b>العقيدة الإسلامية هي:</b> التصديق الجازم بقلوبنا، والحكم المطلق الذي لا يقبل الشك بعقولنا في كل ما يتعلّق بأمور ديننا. وعلم العقيدة صار علمًا على علم الإيمان، وهو <b>أصل لبقية العلوم الدينية وأساسها</b>، فكل العلوم الدينية الأخرى مبنية عليه ومتفرّعة منه.</p>
<p>ويتناول ما يجب الإيمان به في حق الله تعالى من صفات الكمال والأسماء الحسنى، وما يستحيل في حقه عز وجل، وحق رسله عليهم الصلاة والسلام، وما يجوز، وما أخبر به رسولنا محمد ﷺ فيما يتعلّق باليوم الآخر: من البعث والحشر والحساب والميزان وصحائف الأعمال والصراط والثواب والعقاب والجنة والنار، وما يجب الإيمان به من أمور الغيب.</p>
<p><b>والعمل هو:</b> ما يقوم به المسلم من قول أو فعل، ويشمل: <b>العبادة والمعاملة والسلوك</b>.</p>
<ul>
<li><b>العبادات:</b> هي الأعمال والأقوال التي يقوم بها المسلم تقرّبًا لله تعالى وطاعةً له.</li>
<li><b>المعاملات:</b> هي ما يتبادل به المسلمون المنافع بينهم وفق الشرائع والقوانين التي جاء بها الإسلام.</li>
<li><b>الآداب:</b> هي ما دعا إليه الإسلام المسلمين من سلوكيات وأخلاق وقيم سامية.</li></ul></div>

<div class="card"><h3>العلاقة بين العقيدة والعمل</h3>
<p>العمل <b>يجسّد العقيدة</b> ويترجمها إلى أقوال وأفعال في العبادات والمعاملات والآداب، وقرنه الله تعالى في العديد من الآيات القرآنية بالإيمان، وبذلك نفهم أن الإيمان والعمل يرتبطان ببعضهما، ولا يغني أحدهما عن الآخر، والإيمان يزيد بالإكثار من الأعمال الصالحة. يقول الله تعالى:</p>
<div class="ayah">﴿ إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا ۞ خَالِدِينَ فِيهَا لَا يَبْغُونَ عَنْهَا حِوَلًا ﴾ [الكهف: 102-103]</div></div>

<div class="card"><h3>الإسلام عقيدة وعمل</h3>
<p>إن الدين الإسلامي جاء بتعاليم وشرائع تنشد للمسلم الصلاح في دنياه، وتسعده في دنياه وأخراه، وتبيّن علاقته بربه، وتنظّم علاقته بغيره من المخلوقات، وتؤكّد ما يجب أن يتخلّق به المسلم من آداب وأخلاق؛ لتكون العلاقة مبنية على أسس سليمة وقواعد متينة ترسي <b>العدل والحب والرخاء</b>، وتبعث في النفس الطمأنينة والسكينة والأمن والأمان، فهو دين شامل للعقيدة والعمل. يقول الله تعالى:</p>
<div class="ayah">﴿ وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ ﴾ [آل عمران: 84]</div></div>

    id:'g9-islamic-15', title:'من دروس العبادات: قصر الصلاة',
    explain:`
<div class="card"><h3>تعريفها</h3>
<p>هي صلاة الرباعية <b>اثنتين</b>، وهي صلاة <b>الظهر والعصر والعشاء</b>.</p>
<h3>حكمها</h3>
<p>سنّة مؤكدة في السفر المباح، سواء كان عن طريق البر أو الجو أو البحر، ويُكره لمن توفّرت فيه الشروط الإتمام.</p>
<h3>دليلها</h3>
<p>القرآن والسنة والإجماع. أما القرآن الكريم فقوله تعالى:</p>
<div class="ayah">﴿ وَإِذَا ضَرَبْتُمْ فِي الْأَرْضِ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَقْصُرُوا مِنَ الصَّلَاةِ ﴾ [من الآية 100 - النساء]</div>
<p>وأما السنة فقد قال عبد الله بن عمر رضي الله عنهما:</p>
<div class="hadith">«صحبتُ النبي ﷺ فكان لا يزيد في السفر على ركعتين، وأبو بكر وعمر وعثمان كذلك». <small>(متفق عليه)</small></div>
<p>وأما الإجماع فقد أجمعت الأمة على مشروعيتها.</p>
<h3>سببها</h3>
<p>كل سفر مباح يبلغ <b>أربعة بُرُد</b>، أي: حوالي <b>84 كيلو مترًا</b>.</p></div>

<div class="card"><h3>شروط قصر الصلاة</h3>
<ol>
<li><b>أن يكون السفر مباحًا:</b> فالعاصي بسفره يحرم عليه قصر الصلاة، فالمسافر لمعصية كالسرقة وشرب الخمر يحرم عليه قصر الصلاة، إلا إذا تاب من معصيته في ذلك السفر.</li>
<li><b>أن ينوي قطع المسافة دفعة واحدة من غير تردّد:</b> فمن كان يبحث عن شيء ضائع مثلًا فلا يقصر صلاته ولو تجاوز مسافة القصر.</li>
<li><b>أن يشرع في السفر بالفعل.</b></li>
<li><b>ألّا ينوي الإقامة أربعة أيام في محل سفره:</b> فإن نوى فلا يقصر إلا في الطريق ذهابًا وإيابًا.</li></ol></div>

<li>من نوى الإقامة أربعة أيام فأكثر في المكان الذي سافر إليه.</li></ol></div>

    id:'g9-islamic-16', title:'من دروس السيرة: صور ومواقف من حياة عمر بن الخطاب رضي الله عنه (الجزء الأول)',
    explain:`
<div class="card"><h3>١. اسمه ونسبه وأوصافه</h3>
<p>هو <b>عمر بن الخطاب بن نفيل بن عبد العزّى</b>، وأمّه سيّدة من بني مخزوم وهي من أشرف بطون قريش، فهو قرشي عزيز النسب من جهة أبيه وأمّه.</p>
<p>كان عمر بن الخطاب رضي الله عنه قويًّا شديد البأس في مواقف الشدّة، ليّنًا رقيقًا؛ يرى الحقّ فيندفع إليه يسانده ويقوّيه، ويرى الباطل فيقاومه ويقف في وجهه بكل شجاعة وقوّة. وكان إلى جانب ذلك فارسًا لا يُشَقّ له غبار، فصيحًا، راويةً للشعر، عارفًا بأنساب العرب، له قدرة فائقة على الإقناع؛ لذلك كانت قريش تبعثه سفيرًا للتشاور مع بعض القبائل المجاورة، فكان يقوم بتلك المهمة خير قيام.</p>
<p>ولتلك الصفات مجتمعة كان الرسول ﷺ <b>يدعو ربّه أن يعزّ الإسلام بعمر بن الخطاب</b>.</p></div>

<div class="card"><h3>٢. إسلامه</h3>
<p>خرج عمر بن الخطاب ذات يوم -وهو غاضب على رسول الله ﷺ الذي ينكر عبادة آلهة قريش ويصفها بالضعف والهوان- وفي الطريق التقى بالصحابي الجليل <b>نعيم بن عبد الله</b> فلمح الغضب في عينيه، وخشي على الرسول ﷺ من بأسه، فأخبره أن أخته وزوجها قد أسلما. فثارت ثائرته، واتجه مسرعًا إلى بيت أخته ليردّها وزوجها إلى عبادة الأصنام، وفي بيت أخته كان <b>خبّاب بن الأرتّ</b> يقرأ القرآن من صحيفة، وفاطمة بنت الخطاب وزوجها سعيد بن زيد يسمعان ويتدبّران.</p>
<p>سمع عمر قبل أن يدخل البيت أصواتًا لم يميّزها، وما أن طرق الباب حتى اختفى خبّاب، لأن كثيرًا من المسلمين كان يخفي إسلامه في ذلك الوقت. وأخذت أخته الصحيفة فأخفتها؛ دخل عمر الدار وأخذ يعنّف زوج أخته ويطرحه أرضًا، ولمّا قامت أخته لتمنع زوجها منه ضربها حتى سال دمها، فقالت له: «أسلمنا، وآمنّا بالله ورسوله، فاصنع ما بدا لك». نظر عمر إلى أخته فرأى الدم يسيل منها، فرقّ قلبه لها وطلب منها أن تريه الصحيفة، فأبت، وطلبت منه أن يتطهّر أولًا، ففعل، وأخذ يقرأ الصحيفة التي كان مكتوبًا فيها:</p>
<div class="ayah">﴿ طه ۞ مَا أَنزَلْنَا عَلَيْكَ الْقُرْآنَ لِتَشْقَىٰ ۞ إِلَّا تَذْكِرَةً لِّمَن يَخْشَىٰ ۞ تَنزِيلًا مِّمَّنْ خَلَقَ الْأَرْضَ وَالسَّمَاوَاتِ الْعُلَى ۞ الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ ﴾ [طه: 1-4]</div>
<p>ولمّا بلغ قوله تعالى:</p>
<div class="ayah">﴿ إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي ﴾ [طه: 13]</div>
<p>قال: «ما أحسن هذا الكلام وأكرمه!». سمع خبّاب قول عمر فاستبشر وخرج من مخبئه، وقال لعمر: «والله إنّي لأرجو أن يكون الله قد خصّك بدعوة نبيّه». قال عمر: «دلّني يا خبّاب على محمد حتى آتيه فأسلم». قال خبّاب: «هو في بيت عند الصفا، ومعه نفر من أصحابه».</p>
<p>فأخذ عمر سيفه، وذهب إلى <b>دار الأرقم بن أبي الأرقم</b> حيث يوجد رسول الله ﷺ وصحبه، فضرب عليهم الباب، فلمّا سمعوا صوته قام أحد الصحابة فنظر من <b>خلل الباب</b> فرآه متوشّحًا سيفه، فرجع وأخبر الرسول ﷺ، فأذن له بالدخول، ونهض إليه حتى لقيه فجذبه من ثوبه، وقال له:</p>
<div class="hadith">«ما جاء بك يا بن الخطاب؟ فو الله ما أرى أن تنتهي حتى ينزل الله بك <b>قارعة</b>». <small>(الحديث أخرجه أحمد بن حنبل في فضائل الصحابة)</small></div>
<p>فقال عمر: «يا رسول الله جئتك لأؤمن بالله وبرسوله وبما جاء من عند الله». فكبّر رسول الله ﷺ تكبيرة عرف من في الدار من الصحابة أن عمر بن الخطاب قد أسلم.</p>
<p>وقد تبيّن لك يا بنيّ أن عمر أسلم عن <b>قناعة ويقين</b>، فكان لإسلامه الأثر الطيّب على الإسلام والمسلمين.</p></div>

<div class="card"><h3>٣. أثر إسلام عمر على الدعوة الإسلامية</h3>
<ol><li>خرج المسلمون إلى شوارع مكة مع عمر دون أن يتعرّض لهم المشركون بالأذى، كما كانوا يفعلون من قبل.</li>
<li>منذ إسلام عمر صار الصحابة يقرؤون القرآن في الكعبة، ويصلّون فيها.</li></ol></div>

<div class="card"><h3>٤. شجاعته وجهاده في الإسلام</h3>
<p>عُرف عمر بن الخطاب رضي الله عنه بالإقدام والشجاعة في الحق، وزاد من شجاعته إيمانه القوي واعتزازه بإسلامه. ومن مواقفه الجريئة ما فعله يوم <b>هجرته</b>، فبينما كان كثير من الصحابة يهاجرون متخفّين خوفًا من بطش قريش وجبروتها، نرى عمر بن الخطاب يتوشّح سيفه ويذهب إلى الكعبة والمشركون حولها مجتمعون، فيطوف مطمئنًّا، ثم يصلّي، وبعد الصلاة يذهب نحو جماعات المشركين، ويقول بأعلى صوته:</p>
<p style="color:#c0392b;font-weight:700">«قبّح الله وجوهكم، وأذكّركم!! إنّي مهاجر الساعة، فمن أراد أن تثكله أمّه، أو ييتّم ولده أو ترمّل زوجه، فليلقني وراء هذا الوادي».</p>
<p>ثم يخرج مهاجرًا، فلم يجرؤ مشرك على منعه من ذلك.</p>
<p>وفي المدينة عاش عمر ملازمًا للرسول ﷺ، يشارك في الدعوة إلى الله بلسانه ويدافع عنها بسيفه، فلم يتخلّف عن غزوة من غزوات الرسول ﷺ، ولم يجبن، أو يتقهقر في أشدّ مواقف القتال مع أعداء الله، بل كانت له <b>صولات وجولات</b> شهدت بشجاعته وبطولته.</p></div>

<div class="card"><h3>معاني المفردات</h3><ul>
<li><b>خلل الباب:</b> شقّ الباب.</li>
<li><b>قارعة:</b> تقرع وتهلك.</li>
<li><b>تثكله أمه:</b> تفقده.</li>
<li><b>ترمّل زوجه:</b> يقال للمرأة التي فقدت زوجها: أرملة.</li></ul></div>

    id:'g9-islamic-17', title:'من دروس العقيدة: الإسلام دين يُسر وسماحة',
    explain:`
<div class="card"><h3>مدخل الموضوع</h3>
<p>الإسلام دين الفطرة السليمة، وجاءت تكاليفه موافقة للفطرة الإنسانية؛ لتلائم الناس في كل زمان ومكان، <b>يسيرة</b> لا يشقّ على الناس القيام بها؛ ليستطيعوا الالتزام بها والمداومة عليها، فهو دين <b>الوسطية والاعتدال</b> بدون تفريط ولا إفراط. يقول الله تعالى:</p>
<div class="ayah">﴿ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ﴾ [البقرة: 285]</div>
<div class="hadith">ويقول رسولنا الكريم محمد ﷺ: «إن الدين يُسر، ولن يشادّ الدين أحد إلا غلبه، فسدّدوا وقاربوا وبشّروا». <small>(رواه البخاري)</small></div></div>

<div class="card"><h3>من مظاهر يُسره للمسلمين</h3>
<p><b>١. في الوضوء:</b> أباح للمسلم التيمّم عند فقدان الماء، أو خشية الضرر من استعماله. يقول الله تعالى:</p>
<div class="ayah">﴿ فَلَمْ تَجِدُوا مَاءً فَتَيَمَّمُوا صَعِيدًا طَيِّبًا فَامْسَحُوا بِوُجُوهِكُمْ وَأَيْدِيكُم مِّنْهُ مَا يُرِيدُ اللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ ﴾ [المائدة: 7]</div>
<p><b>٢. في الصلاة:</b> أباح للمسافر سفرًا طويلًا قصر الصلاة الرباعية، كما أباح القعود للمريض العاجز عن القيام للصلاة، والإيماء لمن شقّ عليه القعود، وأعفى الحائض والنفساء من الصلاة أداءً وقضاءً.</p>
<p><b>٣. في الصيام:</b> أباح للمسافر سفر طاعة وللمريض والحائض والنفساء الفطر في رمضان، على أن يقضي المسافر بعد الرجوع، والمريض بعد الشفاء، والحائض والنفساء بعد الطهر. يقول الله تعالى:</p>
<div class="ayah">﴿ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ ﴾ [البقرة: 184]</div>
<p><b>٤. في الزكاة:</b> جعل بلوغ النصاب المعلوم شرطًا في وجوبها، فلا تجب فيما دونه، وجعل مقدارها قليلًا.</p>
<p><b>٥. في الحج:</b> فرضه مرّة واحدة في العمر، وجعل القدرة المالية والاستطاعة الصحية شرطين في وجوبه. يقول الله تعالى:</p>
<div class="ayah">﴿ وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا ﴾ [آل عمران: 97]</div>
<p><b>٦. في الجهاد:</b> أعفى غير القادرين منه، وأباح لهم التخلّف عنه. يقول الله تعالى:</p>
<div class="ayah">﴿ لَّيْسَ عَلَى الْأَعْمَىٰ حَرَجٌ وَلَا عَلَى الْأَعْرَجِ حَرَجٌ وَلَا عَلَى الْمَرِيضِ حَرَجٌ ﴾ [الفتح: 17]</div></div>

<div class="card"><h3>من مظاهر سماحته مع غير المسلمين</h3>
<p><b>١.</b> أباح لأتباعه أن يبرّوا من سالَمهم من أهل الأديان الأخرى، وأوجب عليهم العدل والإحسان في معاملتهم. يقول الله تعالى:</p>
<div class="ayah">﴿ لَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ لَمْ يُقَاتِلُوكُمْ فِي الدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَارِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوا إِلَيْهِمْ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ ﴾ [الممتحنة: 8]</div>
<p><b>٢.</b> يجيز للمسلمين التعاون والتعامل مع أهل الأديان الأخرى في مجالات الحياة المختلفة كالعلوم الدنيوية المباحة، ويتجاوز ذلك إلى المصاهرة بشرط ألّا يكون منافيًا لتعاليم الإسلام. يقول الله تعالى:</p>
<div class="ayah">﴿ الْيَوْمَ أُحِلَّ لَكُمُ الطَّيِّبَاتُ وَطَعَامُ الَّذِينَ أُوتُوا الْكِتَابَ حِلٌّ لَّكُمْ وَطَعَامُكُمْ حِلٌّ لَّهُمْ وَالْمُحْصَنَاتُ مِنَ الْمُؤْمِنَاتِ وَالْمُحْصَنَاتُ مِنَ الَّذِينَ أُوتُوا الْكِتَابَ مِن قَبْلِكُمْ إِذَا آتَيْتُمُوهُنَّ أُجُورَهُنَّ مُحْصِنِينَ غَيْرَ مُسَافِحِينَ وَلَا مُتَّخِذِي أَخْدَانٍ ﴾ [المائدة: 6]</div>
<p><b>٣.</b> يقرّ المساواة بين البشر، فلا يفرّق بينهم بسبب اللون أو الجنس، وجعل معيار التفاضل بينهم هو <b>التقوى</b>. يقول الله تعالى:</p>
<div class="ayah">﴿ يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ ﴾ [الحجرات: 13]</div></div>

    id:'g9-islamic-18', title:'من دروس العبادات: صوم رمضان',
    explain:`
<div class="card"><h3>تعريفه وحكمه ودليله</h3>
<p><b>تعريفه:</b> هو الإمساك عن جميع المفطرات، من طلوع الفجر إلى غروب الشمس، بنيّة في أول ليلة منه.</p>
<p><b>حكمه:</b> هو <b>فرض عين</b> بالكتاب والسنة والإجماع.</p>
<p><b>دليل فرضيته من الكتاب:</b> قوله تعالى:</p>
<div class="ayah">﴿ يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ كَمَا كُتِبَ عَلَى الَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ ﴾ [البقرة: 182]</div><br>
<div class="ayah">﴿ شَهْرُ رَمَضَانَ الَّذِي أُنزِلَ فِيهِ الْقُرْآنُ هُدًى لِّلنَّاسِ وَبَيِّنَاتٍ مِّنَ الْهُدَىٰ وَالْفُرْقَانِ فَمَن شَهِدَ مِنكُمُ الشَّهْرَ فَلْيَصُمْهُ وَمَن كَانَ مَرِيضًا أَوْ عَلَىٰ سَفَرٍ فَعِدَّةٌ مِّنْ أَيَّامٍ أُخَرَ يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ وَلِتُكْمِلُوا الْعِدَّةَ وَلِتُكَبِّرُوا اللَّهَ عَلَىٰ مَا هَدَاكُمْ وَلَعَلَّكُمْ تَشْكُرُونَ ﴾ [البقرة: 184]</div>
<p><b>وأما السنة</b> فقوله ﷺ:</p>
<div class="hadith">«بُني الإسلام على خمس: شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وإقام الصلاة، وإيتاء الزكاة، وحجّ البيت، وصوم رمضان». <small>(رواه البخاري)</small></div>
<p><b>وأما الإجماع</b> فقد انعقد إجماع الأمة على فرضيته، فمن جحد فرضية صومه فهو كافر ويُستتاب ثلاثًا، وعليه القضاء والكفارة عن كل يوم أفطره، فإن لم يتب قُتل، ومن أقرّ بفرضيته ولم يصمه فهو عاصٍ لله.</p></div>

<div class="card"><h3>شروط الصوم</h3>
<ul><li><b>شروط وجوب:</b> البلوغ، والقدرة، والإقامة.</li>
<li><b>شروط صحة:</b> الإسلام، وعدم وجود مانع ينافي الصوم.</li>
<li><b>شروط وجوب وصحة معًا:</b> العقل، وخلو المرأة من دم الحيض والنفاس، ودخول الوقت.</li></ul></div>

<div class="card"><h3>ما يثبت به الصوم والفطر</h3>
<p><b>يثبت صوم رمضان بما يأتي:</b></p>
<ol><li>رؤية هلال شهر رمضان، سواء أكانت هذه الرؤية من جماعة يستحيل تواطؤهم على الكذب، أم بشهادة عدلين.</li>
<li>إتمام شهر شعبان ثلاثين يومًا.</li></ol>
<p>ويثبت <b>الفطر</b> بانقضاء شهر رمضان برؤية هلال شهر شوّال، أو بإكمال شهر رمضان ثلاثين يومًا. قال ﷺ:</p>
<div class="hadith">«صوموا لرؤيته وأفطروا لرؤيته، فإن غُمّ عليكم فأكملوا عدّة شعبان ثلاثين يومًا».</div></div>

<div class="card"><h3>أركان الصوم</h3>
<p>للصوم ركنان هما:</p>
<ol><li><b>النية:</b> وهي قصد الصوم، ووقتها من غروب الشمس إلى قُبيل طلوع الفجر، أو معه، والأفضل أن تكون متقدمة على الجزء الأخير من الليل؛ لأنه أحوط، وتكفي نية واحدة للشهر كله ما لم ينقطع الصوم بسبب، ويُستحب تجديدها كل ليلة.</li>
<li><b>الإمساك</b> عن جميع المفطرات من طلوع الفجر إلى غروب الشمس.</li></ol>
<h3>فضله</h3>
<div class="hadith">قال ﷺ: «من صام رمضان إيمانًا واحتسابًا غُفر له ما تقدّم من ذنبه». <small>(متفق عليه)</small></div></div>

<div class="card"><h3>آداب الصوم</h3>
<p>يُندب للصائم أمور منها:</p>
<ol><li>تعجيل الفطر بعد تحقق الغروب وقبل الصلاة، ويُندب أن يكون على رُطَب، فتمر، فإن لم يجد فعلى حسوات من ماء.</li>
<li>الدعاء عقب فطره بالمأثور، كما ورد عن ابن عمر رضي الله عنهما قال: كان رسول الله ﷺ إذا أفطر يقول: «ذهب الظمأ وابتلّت العروق وثبت الأجر إن شاء الله». <small>(سنن أبي داود)</small></li>
<li>كفّ اللسان عن فضول الكلام، وأما كفّه عن الحرام كالغيبة والنميمة وفحش القول فواجب على المرء في كل الأزمنة، ويتأكّد وجوبه في شهر رمضان.</li>
<li>غضّ البصر وكفّه عما حرّم الله، فإن النظرة سهم من سهام إبليس من تركها ذاق حلاوة الإيمان في قلبه.</li>
<li>قيام ليله، فمن قام رمضان إيمانًا واحتسابًا غُفر له ما تقدّم من ذنبه.</li>
<li>الاشتغال بالعلم، وتلاوة القرآن الكريم، والذكر، والصلاة على النبي ﷺ، كلما أمكنه ذلك ليلًا أو نهارًا.</li></ol></div>

<div class="card"><h3>الأعذار المبيحة للفطر</h3>
<p>يُباح الفطر بعذر من الأعذار الآتية:</p>
<ol><li><b>المرض</b> الذي لا يقدر معه على الصوم أو يخاف الهلاك من المرض أو الضعف، فالفطر جائز وعليه القضاء.</li>
<li><b>الحامل والمرضع</b> إذا خافتا على نفسيهما أو ولديهما أفطرتا وعليهما القضاء.</li>
<li><b>السفر</b> ويُشترط فيه: أ) أن يكون السفر مباحًا لقصر الصلاة (وهي مسافة 84 كيلو مترًا تقريبًا). ب) أن يشرع فيه قبل طلوع الفجر وينوي الفطر، فإن كان السفر لا يبيح قصر الصلاة لم يجز فيه الفطر.</li>
<li><b>الإكراه</b> على الإفطار، فمن أُكره فعليه القضاء.</li>
<li><b>الحيض والنفاس:</b> فلو حاضت الصائمة أو نفست وجب عليها الفطر.</li>
<li><b>كِبَر السن:</b> فالشيخ الهرم الذي لا يقدر على الصوم في جميع فصول السنة يفطر ولا قضاء عليه، ويستحب له الفدية إن كان قادرًا، ومثله المريض الذي لا يُرجى شفاؤه.</li></ol></div>

<div class="card"><h3>مبطلات الصوم</h3>
<p>الأمور التي تبطل الصوم منها ما يوجب <b>القضاء</b>، ومنها ما يوجب <b>القضاء والكفارة</b>.</p>
<h3>أ. ما يوجب القضاء فقط</h3>
<p>يجب على الصائم قضاء الصوم بعدد الأيام التي أفطر فيها:</p>
<ol><li>إذا نزل دم الحيض والنفاس.</li>
<li>إذا وصل مائع إلى الحلق عن طريق الفم أو غيره كالأكل نسيانًا، ومنه غلبة المضمضة.</li>
<li>إذا أفطر الصائم ناسيًا، أو شاكًّا في الفجر أو الغروب وتحقّق خطؤه.</li>
<li>إذا أفطر مكرهًا فظنّ إباحة الفطر، واستمرّ مفطرًا بقية اليوم.</li>
<li>إذا تعمّد الفطر في صيام التطوع.</li>
<li>إذا رأى هلال شوّال فظنّ إباحة الفطر فأفطر.</li></ol></div>

<div class="card"><h3>ب. ما يوجب القضاء والكفارة</h3>
<p>الكفارة هي: ما يكفّر به المذنب عن ذنب ترتّب عن مخالفة، وهي:</p>
<p><b>١. كفارة صغرى:</b> وهي <b>الفدية</b>، وذلك بإطعام مسكين عن كل يوم لم يصمه المكلّف، والإطعام هو مُدّ النبي ﷺ بمُدّه من غالب قوت البلد، أو إخراج ربع قيمة زكاة الفطر نقدًا. وتجب الكفارة الصغرى على من فرّط في قضاء رمضان حتى دخل عليه رمضان الآخر، وعلى مرضع أفطرت، ويُستحب الإطعام للشيخ الكبير وصاحب المرض المزمن.</p>
<p><b>٢. كفارة كبرى:</b> وهي ما ترتّب عن انتهاك حرمة شهر رمضان، كأن يأكل أو يشرب متعمّدًا في نهار رمضان، فمن فعل ذلك وجب عليه أن يكفّر عن هذه المخالفة بفعل واحدة من أشياء على <b>التخيير</b>:</p>
<ol><li>عتق رقبة مؤمنة، وهذا غير موجود الآن.</li>
<li>صيام شهرين متتابعين، والتتابع شرط في صحة الصوم.</li>
<li>إطعام ستين مسكينًا، لكل مسكين مُدّ بمُدّ النبي ﷺ، وهو ملء اليدين المتوسّطتين من طعام غالب أهل البلد، وهو الأفضل، أو إخراج قيمة ذلك.</li></ol>
<h3>بعض الحالات التي توجب الكفارة الكبرى</h3>
<ol><li>رفض نية الصيام نهارًا في رمضان.</li>
<li>رفض النية ليلًا والاستمرار بها حتى طلوع الفجر.</li>
<li>تعمّد الأكل أو الشرب أو الجماع نهارًا.</li>
<li>تعمّد إخراج المني نهارًا.</li>
<li>تعمّد القيء وابتلاع شيء منه ولو غلبة نهارًا.</li></ol></div>
