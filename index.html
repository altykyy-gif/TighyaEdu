   3) أدوات مساعدة وتخزين
   ════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const norm = s => (s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
let DB = JSON.parse(JSON.stringify(DEFAULT_DB));
const fmt = sec => String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
const OBJ = q => q.t==='mcq'||q.t==='tf'||q.t==='fill';
const shuffle = a => {a=a.slice();for(let k=a.length-1;k>0;k--){const r=Math.floor(Math.random()*(k+1));[a[k],a[r]]=[a[r],a[k]]}return a};

/* ════════════════════════════════════════════════════════
   4) التطبيق: القائمة الجانبية + عرض الدرس + الفهرس + الامتحان
   ════════════════════════════════════════════════════════ */
const App = {
  cur:null, tab:'explain', view:null, examCtx:null, timerOn:true, school:'',
  init(){
    $('#siteName').textContent=CONFIG.siteName; $('#siteSub').textContent=CONFIG.siteSub;
    document.title=CONFIG.siteName;
    $('#menuBtn').onclick=()=>this.toggleMenu();
    const hh=()=>document.documentElement.style.setProperty('--hh',($('header').offsetHeight||88)+'px');hh();addEventListener('resize',hh);addEventListener('load',hh);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(hh);
    this.menu(); this.home(true); this.route();
    addEventListener('popstate',()=>this.route());
  },
  route(){
    const h=decodeURIComponent((location.hash||'').replace('#','')).trim();
    if(!h){if(this.cur||this.view)this.home(true);return}
    for(const g of DB.grades)for(const sb of g.subjects)for(const l of sb.lessons)
      if(l.id===h){if(!(this.cur&&this.cur.l===h))this.open(g.id,sb.id,l.id,undefined,true);return}
  },
  share(){const u=location.origin+location.pathname+'#'+this.cur.l,t=this.find().l.title;
    if(navigator.share)navigator.share({title:t,url:u}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('تم نسخ رابط الدرس'));
    else prompt('انسخ الرابط',u)},
  toggleMenu(){const o=$('#side').classList.toggle('open');$('#shade').classList.toggle('on',o);document.body.style.overflow=o?'hidden':''},
  closeMenu(){$('#side').classList.remove('open');$('#shade').classList.remove('on');document.body.style.overflow=''},
  gs(gid,sid){const g=DB.grades.find(x=>x.id===gid);return{g,sb:g.subjects.find(x=>x.id===sid)}},
  go(){Quiz.stopTimer();if(location.hash)history.replaceState(null,'',location.pathname+location.search);this.cur=null;this.menu();this.closeMenu();scrollTo(0,0)},
  menu(){
    const v=this.view;
    $('#side').innerHTML = DB.grades.map(g=>`
      <details ${(this.cur&&this.cur.g===g.id)||(v&&v.g===g.id)?'open':''}><summary>📚 ${g.name}</summary>
      ${g.subjects.length? g.subjects.map(s=>`<details class="sd" ${(this.cur&&this.cur.s===s.id)||(v&&v.s===s.id)?'open':''}><summary class="subs">📘 ${s.name}</summary>`+
        (s.index?`<button class="les ${v&&v.type==='index'&&v.s===s.id?'on':''}" onclick="App.showIndex('${g.id}','${s.id}')">📑 الفهرس: المقرر وغير المقرر</button>`:'')+
        (s.notes&&s.notes.length?`<button class="les ${v&&v.type==='notes'&&v.s===s.id?'on':''}" onclick="App.showNotes('${g.id}','${s.id}')">⚠️ الملاحظات (${s.notes.length})</button>`:'')+
        (s.lessons.length?`<button class="les ${v&&v.type==='exam'&&v.s===s.id?'on':''}" onclick="App.examHome('${g.id}','${s.id}')">📝 الامتحان الشامل</button>`:'')+
        s.lessons.map(l=>`<button class="les ${this.cur&&this.cur.l===l.id?'on':''}" onclick="App.open('${g.id}','${s.id}','${l.id}')">${l.title}</button>`).join('')+`</details>`
        ).join('') : '<div class="soon">قريبًا…</div>'}
      </details>`).join('');
  },
  home(noPush){
    if(!noPush&&location.hash)history.pushState(null,'',location.pathname+location.search);
    this.cur=null;this.view=null; this.menu();
    $('#main').innerHTML=`<div class="home"><img src="photo.jpg" alt="">
      <h2>${CONFIG.siteName}</h2><p>${CONFIG.siteSub}</p>
      <p class="noprint">اختر الصف والدرس من القائمة الجانبية لتبدأ 👈</p></div>`;
  },
  showIndex(gid,sid){
    const {g,sb}=this.gs(gid,sid);
    this.view={type:'index',g:gid,s:sid};this.go();
    const have=new Set(sb.lessons.map(l=>l.id));
    const rows=sb.index.map(r=>({...r,ok:!!(r.lesson&&have.has(r.lesson))}));
    const yes=rows.filter(r=>r.ok).length,no=rows.length-yes;
    $('#main').innerHTML=`<div class="crumb">${g.name} ‹ ${sb.name}</div><h2 class="t">فهرس الكتاب: الدروس المقررة وغير المقررة</h2>
      <div class="cnt"><span class="bdg ok">✔ مقرر: ${yes}</span><span class="bdg no">✘ غير مقرر: ${no}</span><span class="bdg">الإجمالي: ${rows.length}</span></div>
      <div style="overflow-x:auto"><table class="idx-table"><thead><tr><th>ص</th><th>الدرس</th><th>الموضوع</th><th>الحالة</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.ok?'':'off'}" ${r.ok?`onclick="App.open('${gid}','${sid}','${r.lesson}')" style="cursor:pointer"`:''}>
        <td>${r.page}</td><td>${r.section}</td><td>${r.title}</td>
        <td>${r.ok?'<span class="bdg ok">مقرر</span>':'<span class="bdg no">غير مقرر</span>'}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint noprint">اضغط على أي درس «مقرر» لفتحه. الدروس «غير المقررة» هي التي لم تُضَف إلى الموقع بعد.</p>
      <div class="bar noprint"><button class="btn gold" onclick="print()">🖨️ طباعة الفهرس</button></div>`;
  },
  showNotes(gid,sid){
    const {g,sb}=this.gs(gid,sid);
    this.view={type:'notes',g:gid,s:sid};this.go();
    const order=sb.lessons.map(l=>l.id),pg=p=>parseInt((String(p).match(/\d+/)||[9999])[0]);
    const ns=(sb.notes||[]).slice().sort((x,y)=>(order.indexOf(x.l)-order.indexOf(y.l))||(pg(x.p)-pg(y.p)));
    const by={};ns.forEach(n=>(by[n.l]=by[n.l]||[]).push(n));
    $('#main').innerHTML=`<div class="crumb">${g.name} ‹ ${sb.name}</div><h2 class="t">ملاحظات المادة</h2>
      <div class="cnt"><span class="bdg no">عدد الملاحظات: ${ns.length}</span><span class="bdg">الدروس: ${Object.keys(by).length}</span></div>
      <p class="hint">أخطاء الكتاب وما يحتاج مراجعة على دليل المعلم، مرتبة بحسب الدرس ثم الصفحة، مع التعليل.</p>
      ${Object.keys(by).map(id=>{const l=sb.lessons.find(x=>x.id===id);return `<div class="nt-les"><b>${l?l.title:id}</b>${l?`<button class="btn" onclick="App.open('${gid}','${sid}','${id}')">📖 فتح الدرس</button>`:''}</div>`+
        by[id].map(n=>`<div class="nt"><div class="top"><span class="bdg">${n.p}</span><span class="bdg no">${n.k}</span></div><p><b>الملاحظة:</b> ${n.t}</p><p class="rs"><b>التعليل / المعالجة:</b> ${n.r}</p></div>`).join('')}).join('')}`;
  },
  /* ----- الامتحان الشامل ----- */
  mins(n){return Math.max(10,Math.ceil(n*CONFIG.examSecondsPerQuestion/60))},
  examHome(gid,sid){
    const {g,sb}=this.gs(gid,sid);
    this.view={type:'exam',g:gid,s:sid};this.go();
    const pools=sb.lessons.map(l=>(l.questions||[]).filter(OBJ).length);
    const sum=n=>pools.reduce((a,c)=>a+Math.min(c,n),0);
    const opens=sb.lessons.reduce((a,l)=>a+(l.questions||[]).filter(q=>q.t==='open').length,0);
    const modes=[
      ['quick','⚡ امتحان سريع','3 أسئلة موضوعية من كل درس',sum(3),''],
      ['medium','📘 امتحان متوسط','6 أسئلة موضوعية من كل درس',sum(6),''],
      ['full','🏆 الامتحان الشامل الكامل','كل الأسئلة الموضوعية في كل الدروس، ثم الأسئلة المقالية للمراجعة',sum(1e9),' + '+opens+' سؤالًا مقاليًا']];
    $('#main').innerHTML=`<div class="crumb">${g.name} ‹ ${sb.name}</div><h2 class="t">الامتحان الشامل</h2>
      <div class="card"><p>يغطي الامتحان <b>جميع دروس المادة (${sb.lessons.length} درسًا)</b>، وتُرتَّب أسئلته بحسب الدروس، وتتبدّل الأسئلة وخيارات الإجابة في كل مرة. بعد التصحيح ترى درجتك العامة ونتيجتك في <b>كل درس على حدة</b> مع تنبيه للدروس التي تحتاج مراجعة، ويمكنك كتابة اسمك في شاشة النتيجة لتصويرها وإرسالها لمعلمك (لا يُحفظ شيء).</p>
      <label class="opt"><input type="checkbox" ${this.timerOn?'checked':''} onchange="App.timerOn=this.checked"> ⏱ تفعيل المؤقّت (يُسلَّم الامتحان تلقائيًا عند انتهاء الوقت)</label></div>
      <div class="modes">${modes.map(m=>`<button class="mode" onclick="App.startExam('${gid}','${sid}','${m[0]}')"><b>${m[1]}</b><span>${m[2]}</span><em>${m[3]} سؤالًا موضوعيًا${m[4]}</em><span>⏱ المدة: ${this.mins(m[3])} دقيقة</span></button>`).join('')}</div>
      <div class="bar noprint"><button class="btn gold" onclick="App.examPaper('${gid}','${sid}')">🖨️ ورقة امتحان للطباعة (مع مفتاح الإجابات)</button>
      <button class="btn" onclick="App.reviewAll('${gid}','${sid}')">📚 مراجعة: ملخص النقاط المهمة لجميع الدروس</button></div>`;
  },
  startExam(gid,sid,mode){
    const {g,sb}=this.gs(gid,sid);
    this.view={type:'exam',g:gid,s:sid};this.examCtx={g:gid,s:sid,mode};this.go();
    const per={quick:3,medium:6,full:1e9}[mode];
    let qs=[],essays=[];
    sb.lessons.forEach(l=>{
      shuffle((l.questions||[]).filter(OBJ)).slice(0,per).forEach(q=>qs.push({...q,lt:l.title,lid:l.id}));
      if(mode==='full')(l.questions||[]).filter(q=>q.t==='open').forEach(q=>essays.push({...q,lt:'أسئلة مقالية — '+l.title,lid:l.id}));
    });
    qs=qs.concat(essays);
    const tot=qs.filter(OBJ).length,label={quick:'السريع',medium:'المتوسط',full:'الكامل'}[mode],mn=this.mins(tot);
    $('#main').innerHTML=`<div class="crumb">${g.name} ‹ ${sb.name}</div><h2 class="t">الامتحان الشامل (${label})</h2>
      <div class="cnt"><span class="bdg ok">عدد الأسئلة المحتسبة: ${tot}</span><span class="bdg">الدروس: ${sb.lessons.length}</span>${this.timerOn?`<span class="bdg">⏱ المدة: ${mn} دقيقة</span>`:''}</div>
      ${this.timerOn?`<div class="timer" id="timerBar"><span>⏱ الوقت المتبقي</span><b id="timerTxt">${fmt(mn*60)}</b></div>`:''}
      ${Quiz.render(qs,`App.startExam('${gid}','${sid}','${mode}')`,`App.examHome('${gid}','${sid}')`)}`;
    if(this.timerOn)Quiz.startTimer(mn);
    scrollTo(0,0);
  },
  /* ----- ورقة امتحان للطباعة + مفتاح الإجابات ----- */
  examPaper(gid,sid,per,ess){
    const {g,sb}=this.gs(gid,sid);
    this.view={type:'exam',g:gid,s:sid};this.go();
    per=+per||2; ess=+ess||0; this.paperCfg={per,ess};
    const mc=[],tf=[],fl=[];
    sb.lessons.forEach(l=>shuffle((l.questions||[]).filter(OBJ)).slice(0,per).forEach(q=>(q.t==='mcq'?mc:q.t==='tf'?tf:fl).push(q)));
    const op=shuffle(sb.lessons.flatMap(l=>(l.questions||[]).filter(q=>q.t==='open'))).slice(0,ess);
    const A=['أ','ب','ج','د','هـ'],blank=t=>t.replace(/\.{4,}/g,'<span class="bl">&nbsp;</span>');
    const obj=mc.length+tf.length+fl.length, total=obj+op.length*4;
    let n=0,Q='',K='',secNo=0;const AR=['الأول','الثاني','الثالث','الرابع'];
    const sec=(t,m)=>`<h3 class="sec">السؤال ${AR[secNo++]}: ${t} <small>(${m})</small></h3>`;
    if(mc.length){Q+=sec('اختر الإجابة الصحيحة','درجة لكل فقرة');K+=`<h3 class="sec">السؤال الأول (اختيار من متعدد)</h3><div class="keygrid">`;
      shuffle(mc).forEach(q=>{n++;const perm=shuffle(q.o.map((_,j)=>j));
        Q+=`<div class="pq"><b>${n}.</b> ${blank(q.q)}<div class="popts">${perm.map((j,k)=>`<span>${A[k]}) ${q.o[j]}</span>`).join('')}</div></div>`;
        K+=`<div class="keyrow"><b>${n}</b> ← ${A[perm.indexOf(q.a)]}</div>`});K+='</div>'}
    if(tf.length){Q+=sec('ضع علامة (✓) أمام العبارة الصحيحة وعلامة (✗) أمام العبارة الخاطئة','درجة لكل فقرة');K+=`<h3 class="sec">السؤال (صح وخطأ)</h3><div class="keygrid">`;
      shuffle(tf).forEach(q=>{n++;Q+=`<div class="pq"><b>${n}.</b> ( &nbsp;&nbsp;&nbsp;&nbsp; ) ${q.q}</div>`;K+=`<div class="keyrow"><b>${n}</b> ← ${q.a?'✓ صح':'✗ خطأ'}</div>`});K+='</div>'}
    if(fl.length){Q+=sec('أكمل الفراغ بما يناسبه','درجة لكل فقرة');K+=`<h3 class="sec">السؤال (إكمال)</h3>`;
      shuffle(fl).forEach(q=>{n++;Q+=`<div class="pq"><b>${n}.</b> ${blank(q.q)}</div>`;K+=`<div class="keyrow"><b>${n}</b> ← ${q.a}</div>`})}
    if(op.length){Q+=sec('أجب عن الأسئلة الآتية','4 درجات لكل سؤال');K+=`<h3 class="sec">الأسئلة المقالية (إجابات نموذجية)</h3>`;
      op.forEach(q=>{n++;Q+=`<div class="pq"><b>${n}.</b> ${q.q}<div class="lines"></div></div>`;K+=`<div class="keyrow"><b>${n}. ${q.q}</b><br>${q.a}</div>`})}
    $('#main').innerHTML=`<div class="crumb">${g.name} ‹ ${sb.name}</div><h2 class="t">ورقة امتحان للطباعة</h2>
      <div class="pctl noprint">
        <label>عدد الأسئلة الموضوعية من كل درس: <select id="pPer">${[1,2,3,4,5].map(x=>`<option ${x===per?'selected':''}>${x}</option>`).join('')}</select></label>
        <label>الأسئلة المقالية: <select id="pEss">${[0,3,5,8].map(x=>`<option ${x===ess?'selected':''}>${x}</option>`).join('')}</select></label>
        <button class="btn gold" onclick="App.examPaper('${gid}','${sid}',$('#pPer').value,$('#pEss').value)">🔄 ورقة جديدة</button>
      </div>
      <div class="pctl noprint"><button class="btn" onclick="App.printPaper('q')">🖨️ طباعة ورقة الأسئلة</button><button class="btn red" onclick="App.printPaper('k')">🔑 طباعة مفتاح الإجابات</button><button class="btn gold" onclick="App.printPaper('all')">🖨️ طباعة الكل</button><button class="btn" onclick="App.examHome('${gid}','${sid}')">رجوع</button></div>
      <p class="hint noprint">الورقة تغطي كل الدروس (${sb.lessons.length} درسًا)، وتتبدل أسئلتها وترتيبها عند كل «ورقة جديدة». اطبع ورقة الأسئلة للطلاب والمفتاح لنفسك.</p>
      <div class="paper" id="paperQ">
        <input class="pi" id="pSchool" placeholder="اكتب اسم المدرسة هنا" value="${this.school}" oninput="App.school=this.value">
        <h2>امتحان شامل في مادة ${sb.name} — ${g.name}</h2>
        <div class="pmeta"><div>اسم الطالب: <span class="bl" style="min-width:180px">&nbsp;</span></div><div>الفصل: <span class="bl">&nbsp;</span></div>
          <div>التاريخ: <span class="bl">&nbsp;</span></div><div>الزمن: <span class="bl" style="min-width:60px">&nbsp;</span> دقيقة</div>
          <div style="grid-column:1/-1">الدرجة: <span class="bl" style="min-width:60px">&nbsp;</span> / <b>${total}</b></div></div>
        ${Q}
        <p style="text-align:center;margin-top:18px">— انتهت الأسئلة، مع التمنيات بالتوفيق —</p></div>
      <div class="paper" id="paperKey"><h2>مفتاح الإجابات — ${sb.name} — ${g.name}</h2>
        <p style="text-align:center">الدرجة الكلية: ${total} (${obj} درجة للأسئلة الموضوعية${op.length?` + ${op.length*4} للمقالية`:''})</p>${K}</div>`;
  },
  printPaper(kind){document.body.dataset.print=kind;window.print();setTimeout(()=>{delete document.body.dataset.print},800)},
  reviewAll(gid,sid){
    const {g,sb}=this.gs(gid,sid);
    this.view={type:'exam',g:gid,s:sid};this.go();
    $('#main').innerHTML=`<div class="crumb">${g.name} ‹ ${sb.name}</div><h2 class="t">ملخص النقاط المهمة لجميع الدروس</h2>
      ${sb.lessons.map((l,i)=>`<div class="card sum"><h3>${i+1}. ${l.title}</h3><ul>${(l.summary||[]).map(x=>`<li>${x}</li>`).join('')}</ul>
        <button class="btn noprint" style="padding:4px 14px" onclick="App.open('${gid}','${sid}','${l.id}')">فتح الدرس</button></div>`).join('')}
      <div class="bar noprint"><button class="btn" onclick="App.examHome('${gid}','${sid}')">📝 العودة إلى الامتحان</button><button class="btn gold" onclick="print()">🖨️ طباعة الملخص</button></div>`;
  },
  find(){const g=DB.grades.find(x=>x.id===this.cur.g),s=g.subjects.find(x=>x.id===this.cur.s);return{g,s,l:s.lessons.find(x=>x.id===this.cur.l)}},
  open(g,s,l,tab,noPush){if(!noPush&&location.hash!=='#'+l)history.pushState(null,'','#'+l);this.view=null;this.cur={g,s,l};this.tab=tab||'explain';this.menu();this.closeMenu();this.render();scrollTo(0,0)},
  render(){
    const {g,s,l}=this.find();
    const tabs=[['explain','📖 الشرح'],['summary','📝 الملخص'],['quiz','✅ الأسئلة']];
    if(l.extra)tabs.push(['extra','🌟 إثراء']);
    $('#main').innerHTML=`<div class="crumb">${g.name} ‹ ${s.name}</div><h2 class="t">${l.title}</h2>
      <div class="tabs">${tabs.map(t=>`<button class="tab ${this.tab===t[0]?'on':''}" onclick="App.tab='${t[0]}';App.render()">${t[1]}</button>`).join('')}</div>
      <div class="tabpane" style="display:${this.tab==='explain'?'block':'none'}">${l.explain||'<div class="card">لم يُضف شرح بعد.</div>'}</div>
      <div class="tabpane" style="display:${this.tab==='summary'?'block':'none'}"><div class="card sum"><h3>ملخص الدرس</h3><ul>${(l.summary||[]).map(x=>`<li>${x}</li>`).join('')||'لا يوجد ملخص.'}</ul></div></div>
      <div class="tabpane" style="display:${this.tab==='quiz'?'block':'none'}">${Quiz.html(l)}</div>
      ${l.extra?`<div class="tabpane xtra" style="display:${this.tab==='extra'?'block':'none'}"><div class="note">ℹ️ فقرات عامة للاطلاع والإثراء فقط: <b>غير مطلوبة في الامتحان ولا يُطلب حفظها</b>.</div><div style="margin-top:10px">${l.extra}</div></div>`:''}
      <div class="bar noprint">${CONFIG.features.print?'<button class="btn gold" onclick="print()">🖨️ طباعة الدرس</button>':''}<button class="btn" onclick="App.share()">🔗 مشاركة رابط الدرس</button></div>`;
  }
};

/* ════════════════════════════════════════════════════════
   5) الاختبار: تصحيح + نقاط + إظهار الإجابة + نتيجة كل درس
   ════════════════════════════════════════════════════════ */
const Quiz = {
  cur:[], name:'', t0:0, timer:null,
  startTimer(mins){this.stopTimer();const end=Date.now()+mins*60000;
    const upd=()=>{const left=Math.max(0,Math.round((end-Date.now())/1000)),t=$('#timerTxt'),b=$('#timerBar');
      if(!t){this.stopTimer();return}t.textContent=fmt(left);if(b)b.classList.toggle('low',left<=300);
      if(left<=0){this.stopTimer();this.check(true)}};
    upd();this.timer=setInterval(upd,1000)},
  stopTimer(){if(this.timer){clearInterval(this.timer);this.timer=null}},
  html(l){
    this.cur=l.questions||[]; if(!this.cur.length) return '<div class="card">لا توجد أسئلة بعد.</div>';
    return this.render(this.cur,"App.render();App.tab='quiz';App.render()");
  },
  render(qs,again,back){
    this.cur=qs; this.t0=Date.now(); let last=null;
    return qs.map((q,i)=>{
      const head=(q.lt&&q.lt!==last)?(last=q.lt,`<h3 class="grp">📘 ${q.lt}</h3>`):'';
      return head+`<div class="q" id="q${i}"><b class="n">${i+1}.</b> ${q.q}
      ${q.t==='mcq'?Quiz.order(q).map(j=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${q.o[j]}</label>`).join(''):''}
      ${q.t==='tf'?['صح','خطأ'].map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j?'0':'1'}"> ${o}</label>`).join(''):''}
      ${q.t==='fill'?`<input type="text" name="q${i}" placeholder="اكتب إجابتك هنا">`:''}
      ${q.t==='note'?`<div class="note">⚠️ ملاحظة: ${q.a}</div>`:''}
      ${q.t==='open'?`<textarea name="q${i}" placeholder="اكتب إجابتك بأسلوبك ثم قارنها بالإجابة النموذجية"></textarea><button type="button" class="btn gold noprint" style="margin-top:6px;padding:6px 16px" onclick="Quiz.reveal(${i})">💡 عرض الإجابة النموذجية</button>`:''}
      <div class="ans" id="a${i}"></div></div>`}).join('')+
      `<div class="bar noprint"><button class="btn" onclick="Quiz.check()">تصحيح الإجابات</button>
      <button class="btn red" onclick="${again}">${back?'امتحان جديد':'إعادة المحاولة'}</button>${back?`<button class="btn gold" onclick="${back}">رجوع</button>`:''}</div><div id="res"></div>`;
  },
  order(q){const idx=q.o.map((_,j)=>j);return CONFIG.features.shuffleOptions?shuffle(idx):idx},
  reveal(i){const a=$('#a'+i);a.className='ans model';a.innerHTML='💡 الإجابة النموذجية: '+Quiz.cur[i].a},
  check(auto){
    const qs=Quiz.cur; let pts=0; const st={};
    const wasTimed=!!Quiz.timer; Quiz.stopTimer(); const tb=$('#timerBar'); if(tb){tb.classList.remove('low');tb.innerHTML=auto?'⏰ انتهى الوقت — تم التسليم تلقائيًا':'✔ تم تسليم الامتحان'}
    const tot=qs.filter(OBJ).length;
    qs.forEach((q,i)=>{
      if(q.t==='note')return;
      if(q.t==='open'){Quiz.reveal(i);return}
      const box=$('#q'+i), n=`[name=q${i}]`; let ok=false, shown='';
      if(q.t==='fill'){ok=norm($(n).value)===norm(q.a);shown=q.a}
      else{
        const r=document.querySelector(n+':checked'), v=r?r.value:null;
        if(q.t==='mcq'){ok=v!==null&&+v===q.a;shown=q.o[q.a]}else{ok=v!==null&&(v==='1')===q.a;shown=q.a?'صح':'خطأ'}
        document.querySelectorAll(n).forEach(inp=>{
          const right=q.t==='mcq'?+inp.value===q.a:(inp.value==='1')===q.a, lab=inp.parentElement;
          if(CONFIG.features.showAnswers&&right)lab.classList.add('c');
          if(inp.checked&&!right)lab.classList.add('x');
          inp.disabled=true;
        });
      }
      if(ok)pts++;
      if(q.lid){const o=st[q.lid]=st[q.lid]||{t:q.lt,ok:0,tot:0};o.tot++;if(ok)o.ok++}
      box.className='q '+(ok?'right':'wrong');
      $('#a'+i).innerHTML=ok?'✔ إجابة صحيحة':(CONFIG.features.showAnswers?'✘ الإجابة الصحيحة: '+shown:'✘ إجابة خاطئة');
      if(q.t==='fill')$(n).disabled=true;
    });
    if(CONFIG.features.scoring){
      const p=tot?Math.round(pts/tot*100):0, ctx=App.examCtx&&App.view&&App.view.type==='exam'?App.examCtx:null;
      let per='';
      if(ctx&&Object.keys(st).length){
        per=`<h3 class="grp">📊 نتيجتك في كل درس</h3><div style="overflow-x:auto"><table class="idx-table"><thead><tr><th>الدرس</th><th>الدرجة</th><th>النسبة</th><th></th></tr></thead><tbody>
        ${Object.keys(st).map(id=>{const o=st[id],pp=Math.round(o.ok/o.tot*100);return `<tr><td>${o.t}</td><td>${o.ok} / ${o.tot}</td>
          <td><div class="meter ${pp<70?'low':''}"><i style="width:${pp}%"></i></div>${pp}%</td>
          <td>${pp<70?`<button class="btn noprint" style="padding:3px 12px" onclick="App.open('${ctx.g}','${ctx.s}','${id}','summary')">راجع الدرس</button>`:'✔'}</td></tr>`}).join('')}
        </tbody></table></div>`;
      }
      let where='';
      if(ctx){const o=App.gs(ctx.g,ctx.s);where=o.g.name+' — '+o.sb.name+' — الامتحان الشامل'}
      else if(App.cur){const f=App.find();where=f.g.name+' — '+f.s.name+' — '+f.l.title}
      const el=Math.round((Date.now()-Quiz.t0)/1000), dt=new Date().toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});
      $('#res').innerHTML=`${auto?'<div class="score" style="background:#c0392b;margin-bottom:8px">⏰ انتهى الوقت — تم التسليم تلقائيًا</div>':''}
        <div class="score"><input class="nm" id="stName" placeholder="✍️ اكتب اسمك هنا" value="${Quiz.name}" oninput="Quiz.name=this.value">
        <small>${where}</small>
        نتيجتك: ${pts} من ${tot} (${p}%)
        <small>⏱ المدة المستغرقة: <b>${fmt(el)}</b> · 📅 ${dt}</small>
        <small>الأسئلة المقالية غير محتسبة في الدرجة</small>
        <small>${p>=90?'🌟 ممتاز!':p>=70?'👏 جيد جدًا':p>=50?'👍 جيد، راجع الملخص':'📖 راجع الدروس وأعد المحاولة'}</small></div>
        <p class="hint noprint">📸 اكتب اسمك ثم التقط صورة لشاشة النتيجة وأرسلها لمعلمك. لا يُحفظ الاسم ولا النتيجة في أي مكان.</p>${per}`;
      $('#res').scrollIntoView({behavior:'smooth'});
    }
  }
};

App.init();
</script>
</body>
</html>
